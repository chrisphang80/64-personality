<!DOCTYPE html>
<html lang="zh-CN" data-device="desktop">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>64personality · 多维人格测评实验室</title>
  <!-- Google Fonts: Inter, Noto Sans SC/TC/JP/KR, Plus Jakarta Sans & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', '"Noto Sans SC"', '"Noto Sans TC"', '"Noto Sans JP"', '"Noto Sans KR"', 'sans-serif'],
            display: ['"Nunito"', '"Plus Jakarta Sans"', '"Noto Sans SC"', '"Noto Sans TC"', '"Noto Sans JP"', '"Noto Sans KR"', 'sans-serif'],
          },
          colors: {
            cream: '#FAF5EB',
            parchment: '#F3ECE0',
            ink: '#3B2E2A',
            cocoa: '#6E5A52',
            latte: '#9C877E',
            blush: '#F4A29E',
            apricot: '#F7C59F',
            mint: '#A8DADC',
            lavender: '#C7CEEA',
            butter: '#FFE699',
          },
          boxShadow: {
            'storybook': '0 10px 30px -8px rgba(59, 46, 42, 0.08), 0 4px 10px -4px rgba(59, 46, 42, 0.04)',
            'storybook-hover': '0 18px 36px -10px rgba(59, 46, 42, 0.14), 0 6px 14px -4px rgba(59, 46, 42, 0.06)',
            'pill': '0 4px 12px rgba(59, 46, 42, 0.06)',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-cream: #FAF5EB;
      --ink-brown: #3B2E2A;
      --border-soft: rgba(59, 46, 42, 0.12);
    }
    html, body {
      background-color: var(--bg-cream);
      color: var(--ink-brown);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    /* Subtle hand-drawn watercolor paper texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(244, 162, 158, 0.14) 0%, transparent 38%),
        radial-gradient(circle at 88% 15%, rgba(168, 218, 220, 0.16) 0%, transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(255, 230, 153, 0.16) 0%, transparent 45%);
    }
    .storybook-card {
      background: rgba(255, 253, 249, 0.92);
      border: 2px solid rgba(59, 46, 42, 0.12);
      box-shadow: 0 10px 28px -8px rgba(59, 46, 42, 0.08);
      backdrop-filter: blur(8px);
    }
    .storybook-outline {
      border: 2px solid #3B2E2A;
      box-shadow: 3px 3px 0px #3B2E2A;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .storybook-outline:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #3B2E2A;
    }
    .storybook-outline:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #3B2E2A;
    }
    /* Responsive Adaptive Engine via data-device */
    html[data-device="mobile"] .desktop-only { display: none !important; }
    html[data-device="desktop"] .mobile-only { display: none !important; }
    html[data-device="mobile"] #top-header { height: 54px; }
    html[data-device="desktop"] #top-header { height: 68px; }
    html[data-device="mobile"] #main-stage { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
    html[data-device="desktop"] #main-stage { padding-bottom: 48px; }

    /* Simulated Mobile Preview Frame when forced on a wide desktop screen */
    @media (min-width: 769px) {
      html.force-mobile-preview body {
        background: #EAE2D3;
        display: flex;
        justify-content: center;
      }
      html.force-mobile-preview #app-shell {
        width: 412px;
        min-height: 100vh;
        background: #FAF5EB;
        border-left: 2px solid rgba(59, 46, 42, 0.18);
        border-right: 2px solid rgba(59, 46, 42, 0.18);
        box-shadow: 0 24px 60px rgba(59, 46, 42, 0.22);
        position: relative;
      }
      html.force-mobile-preview #mobile-bottom-nav {
        width: 412px;
        left: 50%;
        transform: translateX(-50%);
      }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1.5deg); }
    }
    .animate-float {
      animation: floatSlow 4.2s ease-in-out infinite;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-amber-200 selection:text-ink">
  <div id="app-shell" class="relative z-10 min-h-screen flex flex-col">
    <!-- Top Header -->
    <header id="top-header" class="sticky top-0 z-40 bg-[#FAF5EB]/90 backdrop-blur-md border-b border-[#3B2E2A]/10 px-3 sm:px-6 flex items-center justify-between gap-2">
      <button onclick="App.navigate('portal')" class="flex items-center gap-2 text-left group focus:outline-none min-w-0">
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-2xl bg-amber-200 border-2 border-[#3B2E2A] flex items-center justify-center shadow-[2px_2px_0_#3B2E2A] group-hover:scale-105 transition-transform shrink-0">
          <span class="font-display font-black text-xs sm:text-sm text-[#3B2E2A]">64</span>
        </div>
        <div class="min-w-0">
          <div class="font-display font-black text-sm sm:text-base leading-none tracking-tight text-[#3B2E2A] truncate">64personality</div>
          <div id="brand-subtitle" class="text-[10px] font-semibold text-[#6E5A52] tracking-wide mt-0.5 truncate">多维人格测评实验室</div>
        </div>
      </button>

      <!-- Desktop Horizontal Nav -->
      <nav id="desktop-nav" class="desktop-only items-center gap-1.5 bg-[#F3ECE0] p-1 rounded-full border border-[#3B2E2A]/12"></nav>

      <!-- Right Controls: Language Selector + Device Mode Switcher -->
      <div class="flex items-center gap-1.5 shrink-0">
        <!-- Language Dropdown -->
        <div class="relative" id="lang-menu-wrap">
          <button id="lang-trigger" onclick="App.toggleLangMenu(event)" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full bg-white/95 border border-[#3B2E2A]/15 shadow-pill text-xs font-extrabold text-[#3B2E2A] hover:border-[#3B2E2A]/40 transition">
            <span>🌐</span>
            <span id="current-lang-label">简体中文</span>
            <span class="text-[10px] opacity-60">▾</span>
          </button>
          <div id="lang-dropdown" class="hidden absolute right-0 mt-2 w-44 rounded-2xl bg-[#FFFDF9] border-2 border-[#3B2E2A] shadow-[4px_4px_0_#3B2E2A] py-1.5 z-50 animate-pop">
            <!-- Populated dynamically -->
          </div>
        </div>

        <!-- Device Mode Switcher Pill -->
        <div class="flex items-center bg-[#F3ECE0] p-0.5 rounded-full border border-[#3B2E2A]/15 shadow-pill" title="Adaptive Layout Mode">
          <button onclick="App.setDeviceMode('auto')" id="dev-btn-auto" class="px-2 py-1 rounded-full text-[11px] font-bold transition">Auto</button>
          <button onclick="App.setDeviceMode('desktop')" id="dev-btn-desktop" class="px-1.5 py-1 rounded-full text-[11px] font-bold transition" title="Desktop">🖥️</button>
          <button onclick="App.setDeviceMode('mobile')" id="dev-btn-mobile" class="px-1.5 py-1 rounded-full text-[11px] font-bold transition" title="Mobile">📱</button>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Stage -->
    <main id="main-stage" class="flex-1 w-full max-w-6xl mx-auto px-3.5 sm:px-6 pt-4 sm:pt-7"></main>

    <!-- Mobile Fixed Glassmorphic Bottom Tab Bar -->
    <nav id="mobile-bottom-nav" class="mobile-only fixed bottom-0 left-0 right-0 z-40 bg-[#FAF5EB]/92 backdrop-blur-lg border-t border-[#3B2E2A]/12 px-4 pt-1.5 pb-[calc(8px+env(safe-area-inset-bottom))] flex items-center justify-around shadow-[0_-6px_20px_rgba(59,46,42,0.06)]"></nav>
  </div>

  <!-- Interactive Modal Overlay -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-[#3B2E2A]/45 backdrop-blur-xs hidden items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this) App.closeModal()">
    <div id="modal-sheet" class="w-full sm:max-w-xl bg-[#FFFDF9] border-t-2 sm:border-2 border-[#3B2E2A] rounded-t-3xl sm:rounded-3xl max-h-[88vh] overflow-y-auto shadow-2xl p-5 sm:p-7 animate-pop"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-box" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2">
    <div id="toast-text" class="px-4 py-2 rounded-full bg-[#3B2E2A] text-[#FAF5EB] text-xs font-bold shadow-lg border border-amber-200/30 whitespace-nowrap"></div>
  </div>

  <!-- Hidden Canvas for Poster Generation -->
  <canvas id="poster-canvas" width="900" height="1280" class="hidden"></canvas>

  <script>
    /**
     * ============================================================================
     * 1. CHIBI ILLUSTRATION ENGINE (Hand-Drawn Coffee-Brown Ink & Pastel Watercolor)
     * ============================================================================
     */
    const ChibiArtEngine = (() => {
      const INK = '#3B2E2A';

      function getMbtiChibiSVG(artCode, size = 120) {
        const parts = (artCode || 'INTJ-AH').split('-');
        const base = parts[0] || 'INTJ';
        const sub = parts[1] || 'AH';
        const isNT = base[1] === 'N' && base[2] === 'T';
        const isNF = base[1] === 'N' && base[2] === 'F';
        const isSJ = base[1] === 'S' && base[3] === 'J';

        const palette = isNT
          ? { bg: '#EFE9FA', outfit: '#C7CEEA', hair: '#6D597A', accent: '#FFE699' }
          : isNF
          ? { bg: '#E6F5EE', outfit: '#A8DADC', hair: '#52796F', accent: '#F4A29E' }
          : isSJ
          ? { bg: '#E8F1FA', outfit: '#B5D8EB', hair: '#5C6B73', accent: '#F7C59F' }
          : { bg: '#FDF0E2', outfit: '#F7C59F', hair: '#8D5B4C', accent: '#FFE699' };

        // Subtype aura & expression
        let aura = '';
        if (sub === 'AH') {
          aura = `
            <circle cx="26" cy="28" r="6" fill="#FFE699" stroke="${INK}" stroke-width="1.8"/>
            <path d="M92 24 C92 20, 98 20, 98 24 C98 20, 104 20, 104 24 C104 29, 98 33, 98 33 C98 33, 92 29, 92 24 Z" fill="#F4A29E" stroke="${INK}" stroke-width="1.6"/>
          `;
        } else if (sub === 'AC') {
          aura = `
            <polygon points="26,20 32,28 26,36 20,28" fill="#A8DADC" stroke="${INK}" stroke-width="1.8"/>
            <polygon points="96,22 101,29 96,36 91,29" fill="#C7CEEA" stroke="${INK}" stroke-width="1.8"/>
          `;
        } else if (sub === 'OH') {
          aura = `
            <path d="M20 32 Q24 24 31 27 Q37 22 42 29 Q46 34 38 36 L22 36 Q18 35 20 32 Z" fill="#FFFFFF" stroke="${INK}" stroke-width="1.6"/>
            <circle cx="96" cy="28" r="4.5" fill="#A8DADC" stroke="${INK}" stroke-width="1.6"/>
          `;
        } else {
          aura = `
            <path d="M28 20 A9 9 0 1 0 36 33 A7 7 0 1 1 28 20 Z" fill="#FFE699" stroke="${INK}" stroke-width="1.7"/>
            <circle cx="95" cy="26" r="2.5" fill="${INK}"/>
            <circle cx="101" cy="33" r="2" fill="${INK}"/>
          `;
        }

        const isWarm = sub.endsWith('H');
        const isAssertive = sub.startsWith('A');
        const eyes = isWarm
          ? `<path d="M47 61 Q51 56 55 61" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>
             <path d="M65 61 Q69 56 73 61" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`
          : `<circle cx="51" cy="60" r="3.2" fill="${INK}"/>
             <circle cx="69" cy="60" r="3.2" fill="${INK}"/>
             <circle cx="50" cy="59" r="1" fill="#FFFFFF"/>
             <circle cx="68" cy="59" r="1" fill="#FFFFFF"/>`;

        const mouth = isAssertive
          ? `<path d="M55 70 Q60 75 65 70" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`
          : `<path d="M56 71 Q60 73 64 71" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;

        // Base-type iconic headgear / prop
        let headgear = '';
        if (base === 'ENTJ' || base === 'ESTJ') {
          headgear = `<polygon points="46,35 51,23 60,31 69,23 74,35" fill="#FFE699" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
        } else if (base === 'INTP' || base === 'ISTJ') {
          headgear = `
            <rect x="44" y="55" width="13" height="10" rx="3" fill="none" stroke="${INK}" stroke-width="2"/>
            <rect x="63" y="55" width="13" height="10" rx="3" fill="none" stroke="${INK}" stroke-width="2"/>
            <line x1="57" y1="60" x2="63" y2="60" stroke="${INK}" stroke-width="2"/>
          `;
        } else if (base === 'INFP' || base === 'ENFP' || base === 'ISFP') {
          headgear = `
            <circle cx="44" cy="41" r="4.5" fill="#F4A29E" stroke="${INK}" stroke-width="1.7"/>
            <circle cx="52" cy="38" r="4.5" fill="#FFE699" stroke="${INK}" stroke-width="1.7"/>
          `;
        } else if (base === 'INFJ' || base === 'INTJ') {
          headgear = `<polygon points="60,22 63,30 71,30 65,35 67,42 60,38 53,42 55,35 49,30 57,30" fill="#FFE699" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
        }

        return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="52" fill="${palette.bg}" stroke="${INK}" stroke-width="2.2"/>
          ${aura}
          <!-- Chibi Outfit -->
          <path d="M36 104 C38 86, 48 80, 60 80 C72 80, 82 86, 84 104 Z" fill="${palette.outfit}" stroke="${INK}" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M52 80 L60 91 L68 80" fill="#FFFDF9" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
          <!-- Back Hair -->
          <path d="M35 58 C34 38, 46 30, 60 30 C74 30, 86 38, 85 58 C86 70, 81 78, 76 79 L44 79 C39 78, 34 70, 35 58 Z" fill="${palette.hair}" stroke="${INK}" stroke-width="2.3"/>
          <!-- Face -->
          <circle cx="60" cy="59" r="21" fill="#FFF3E4" stroke="${INK}" stroke-width="2.3"/>
          <!-- Front Bangs -->
          <path d="M39 54 C42 40, 52 36, 60 42 C67 36, 78 40, 81 54 C75 47, 67 47, 60 51 C53 47, 45 47, 39 54 Z" fill="${palette.hair}" stroke="${INK}" stroke-width="2.1" stroke-linejoin="round"/>
          <!-- Blush -->
          <ellipse cx="46" cy="66" rx="3.8" ry="2.2" fill="#F4A29E" opacity="0.75"/>
          <ellipse cx="74" cy="66" rx="3.8" ry="2.2" fill="#F4A29E" opacity="0.75"/>
          ${eyes}
          ${mouth}
          ${headgear}
        </svg>`;
      }

      function getAnimalChibiSVG(artKey, size = 120) {
        const key = (artKey || 'fox').toLowerCase();
        const themes = {
          lion:    { bg: '#FFF3D6', fur: '#F7C59F', mane: '#E09F5A', inner: '#FFF8EB' },
          wolf:    { bg: '#EBF0F7', fur: '#9AA8B8', mane: '#6E7D8F', inner: '#F8FAFC' },
          fox:     { bg: '#FDECE4', fur: '#F28B50', mane: '#D96B27', inner: '#FFFDF9' },
          owl:     { bg: '#EFE9FA', fur: '#9E8FB2', mane: '#6D597A', inner: '#FFF8EB' },
          deer:    { bg: '#E8F5EC', fur: '#E6B88A', mane: '#B5835A', inner: '#FFFDF9' },
          falcon:  { bg: '#E6F2FA', fur: '#7C98B3', mane: '#4A6580', inner: '#FFFDF9' },
          eagle:   { bg: '#E6F2FA', fur: '#7C98B3', mane: '#4A6580', inner: '#FFFDF9' },
          bear:    { bg: '#F5EBE0', fur: '#B08968', mane: '#7F5539', inner: '#EDE0D4' },
          dolphin: { bg: '#E3F6F5', fur: '#8ECAE6', mane: '#5FA8D3', inner: '#FFFDF9' }
        };
        const t = themes[key] || themes.fox;

        let earsOrCrown = '';
        if (key === 'lion') {
          earsOrCrown = `<circle cx="60" cy="60" r="34" fill="${t.mane}" stroke="${INK}" stroke-width="2.4"/>`;
        } else if (key === 'wolf' || key === 'fox') {
          earsOrCrown = `
            <polygon points="33,46 39,20 53,39" fill="${t.fur}" stroke="${INK}" stroke-width="2.3" stroke-linejoin="round"/>
            <polygon points="87,46 81,20 67,39" fill="${t.fur}" stroke="${INK}" stroke-width="2.3" stroke-linejoin="round"/>
            <polygon points="38,42 41,27 49,39" fill="${t.inner}"/>
            <polygon points="82,42 79,27 71,39" fill="${t.inner}"/>
          `;
        } else if (key === 'deer') {
          earsOrCrown = `
            <path d="M46 35 L40 18 M42 25 L34 22 M74 35 L80 18 M78 25 L86 22" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>
            <ellipse cx="35" cy="45" rx="8" ry="5" transform="rotate(-25 35 45)" fill="${t.fur}" stroke="${INK}" stroke-width="2"/>
            <ellipse cx="85" cy="45" rx="8" ry="5" transform="rotate(25 85 45)" fill="${t.fur}" stroke="${INK}" stroke-width="2"/>
          `;
        } else if (key === 'bear') {
          earsOrCrown = `
            <circle cx="38" cy="36" r="10" fill="${t.fur}" stroke="${INK}" stroke-width="2.3"/>
            <circle cx="82" cy="36" r="10" fill="${t.fur}" stroke="${INK}" stroke-width="2.3"/>
            <circle cx="38" cy="36" r="5" fill="${t.inner}"/>
            <circle cx="82" cy="36" r="5" fill="${t.inner}"/>
          `;
        } else if (key === 'owl') {
          earsOrCrown = `
            <polygon points="36,38 42,25 50,36" fill="${t.mane}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
            <polygon points="84,38 78,25 70,36" fill="${t.mane}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
          `;
        } else if (key === 'dolphin') {
          earsOrCrown = `
            <path d="M55 32 Q62 18 70 33" fill="${t.mane}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M24 62 Q14 56 26 52" fill="${t.fur}" stroke="${INK}" stroke-width="2.1"/>
            <path d="M96 62 Q106 56 94 52" fill="${t.fur}" stroke="${INK}" stroke-width="2.1"/>
          `;
        } else {
          earsOrCrown = `
            <path d="M50 32 L56 21 L60 28 L64 21 L70 32" fill="${t.mane}" stroke="${INK}" stroke-width="2.1" stroke-linejoin="round"/>
          `;
        }

        const faceDetails = key === 'owl'
          ? `
            <circle cx="49" cy="58" r="11" fill="${t.inner}" stroke="${INK}" stroke-width="2"/>
            <circle cx="71" cy="58" r="11" fill="${t.inner}" stroke="${INK}" stroke-width="2"/>
            <circle cx="49" cy="58" r="4" fill="${INK}"/>
            <circle cx="71" cy="58" r="4" fill="${INK}"/>
            <polygon points="56,64 64,64 60,72" fill="#FFE699" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>
          `
          : `
            <ellipse cx="60" cy="69" rx="13" ry="10" fill="${t.inner}" stroke="${INK}" stroke-width="1.8"/>
            <circle cx="48" cy="56" r="3.5" fill="${INK}"/>
            <circle cx="72" cy="56" r="3.5" fill="${INK}"/>
            <circle cx="47" cy="55" r="1.2" fill="#FFFFFF"/>
            <circle cx="71" cy="55" r="1.2" fill="#FFFFFF"/>
            <ellipse cx="42" cy="63" rx="4" ry="2.3" fill="#F4A29E" opacity="0.8"/>
            <ellipse cx="78" cy="63" rx="4" ry="2.3" fill="#F4A29E" opacity="0.8"/>
            <ellipse cx="60" cy="66" rx="3.8" ry="2.6" fill="${INK}"/>
            <path d="M55 72 Q60 76 65 72" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
          `;

        return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="52" fill="${t.bg}" stroke="${INK}" stroke-width="2.2"/>
          ${earsOrCrown}
          <!-- Chibi Body -->
          <path d="M40 103 C42 88, 50 83, 60 83 C70 83, 78 88, 80 103 Z" fill="${t.fur}" stroke="${INK}" stroke-width="2.3"/>
          <ellipse cx="60" cy="94" rx="10" ry="8" fill="${t.inner}"/>
          <!-- Animal Head -->
          <ellipse cx="60" cy="60" rx="26" ry="24" fill="${t.fur}" stroke="${INK}" stroke-width="2.4"/>
          ${faceDetails}
        </svg>`;
      }

      function getLoveChibiSVG(code, size = 130) {
        const c = (code || 'ARFD').toUpperCase();
        const isActive = c[0] === 'A';
        const isRomantic = c[1] === 'R';
        const isFiery = c[2] === 'F';
        const bgCol = isFiery ? '#FDE8EC' : '#EDF4FA';
        const heartCol = isFiery ? '#F4A29E' : '#C7CEEA';
        const outfitCol = isRomantic ? '#F7C59F' : '#A8DADC';

        return `<svg width="${size}" height="${size}" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <circle cx="65" cy="65" r="56" fill="${bgCol}" stroke="${INK}" stroke-width="2.2"/>
          <!-- Floating Hearts -->
          <path d="M65 26 C65 19, 75 19, 75 26 C75 19, 85 19, 85 26 C85 34, 75 41, 75 41 C75 41, 65 34, 65 26 Z" fill="${heartCol}" stroke="${INK}" stroke-width="2"/>
          <path d="M30 38 C30 34, 36 34, 36 38 C36 34, 42 34, 42 38 C42 43, 36 47, 36 47 C36 47, 30 43, 30 38 Z" fill="#FFE699" stroke="${INK}" stroke-width="1.7"/>

        { d: 'SN', r: 1, t: { 'zh-CN': '我更信任亲眼所见的客观事实，而不是抽象的理论推测。', 'zh-TW': '我更信任親眼所見的客觀事實，而不是抽象的理論推測。', 'en': 'I trust tangible, observable facts far more than abstract theoretical speculation.', 'ja': '抽象的な理論の推測よりも、自分の目で確かめた客観的な事実を信頼する。', 'ko': '추상적인 이론적 추측보다 직접 보고 확인한 객관적 사실을 더 신뢰한다.', 'es': 'Confío mucho más en los hechos tangibles que en las especulaciones abstractas.', 'ms': 'Saya lebih mempercayai fakta nyata yang boleh dilihat berbanding spekulasi abstrak.' }},
        { d: 'SN', r: -1, t: { 'zh-CN': '我经常沉浸在关于未来可能性与隐喻象征的奇思妙想中。', 'zh-TW': '我經常沉浸在關於未來可能性與隱喻象徵的奇思妙想中。', 'en': 'I often get absorbed in imaginative thoughts about future possibilities and hidden meanings.', 'ja': '未来の可能性や象徴的な意味についての想像にふけることがよくある。', 'ko': '미래의 가능성과 상징적 의미에 대한 상상에 자주 깊이 빠져든다.', 'es': 'A menudo me absorben ideas imaginativas sobre posibilidades futuras y simbolismos.', 'ms': 'Saya sering tenggelam dalam imaginasi tentang kemungkinan masa depan dan makna tersirat.' }},
        { d: 'SN', r: 1, t: { 'zh-CN': '学习新技能时，我喜欢按部就班的清晰操作步骤。', 'zh-TW': '學習新技能時，我喜歡按部就班的清晰操作步驟。', 'en': 'When learning a new skill, I prefer clear, step-by-step practical instructions.', 'ja': '新しいスキルを学ぶときは、段階的で分かりやすい実践手順を好む。', 'ko': '새로운 기술을 배울 때 단계별로 명확하게 정리된 실용적 가이드를 선호한다.', 'es': 'Al aprender una habilidad nueva, prefiero instrucciones prácticas paso a paso.', 'ms': 'Apabila mempelajari kemahiran baharu, saya suka langkah praktikal yang jelas satu demi satu.' }},
        { d: 'SN', r: -1, t: { 'zh-CN': '相比执行既有规则，我更热衷于探索从未有人尝试过的新概念。', 'zh-TW': '相比執行既有規則，我更熱衷於探索從未有人嘗試過的新概念。', 'en': 'I am far more excited by uncharted concepts than by following established routines.', 'ja': '既存のルールに従うことより、誰も試したことのない新しい概念を探求する方がワクワクする。', 'ko': '정해진 규칙을 따르는 것보다 아무도 시도하지 않은 새로운 개념을 탐구하는 데 끌린다.', 'es': 'Me entusiasman mucho más los conceptos inéditos que seguir rutinas establecidas.', 'ms': 'Saya lebih teruja meneroka konsep baharu yang belum dicuba berbanding rutin sedia ada.' }},
        { d: 'SN', r: 1, t: { 'zh-CN': '回忆往事时，我能清晰记得当时的衣着、光线与具体细节。', 'zh-TW': '回憶往事時，我能清晰記得當時的衣著、光線與具體細節。', 'en': 'When recalling memories, I vividly remember concrete details like colors, sounds, and outfits.', 'ja': '過去の出来事を思い出すとき、当時の服装や光、具体的な細部まで鮮明に覚えている。', 'ko': '과거를 회상할 때 당시의 옷차림, 빛, 구체적인 디테일이 생생하게 기억난다.', 'es': 'Al recordar el pasado, evoco con claridad detalles concretos como colores y sonidos.', 'ms': 'Apabila mengimbau kenangan, saya ingat butiran konkrit seperti warna dan pakaian dengan jelas.' }},
        { d: 'SN', r: -1, t: { 'zh-CN': '我总是不自觉地把看似无关的事物联系在一起，发现背后的规律。', 'zh-TW': '我總是不自覺地把看似無關的事物聯繫在一起，發現背後的規律。', 'en': 'I instinctively connect seemingly unrelated things to uncover underlying patterns.', 'ja': '一見無関係に見える事柄を無意識に結びつけ、背後にあるパターンを見出す。', 'ko': '겉보기에 무관해 보이는 것들을 본능적으로 연결해 숨은 패턴을 찾아낸다.', 'es': 'Conecto instintivamente cosas aparentemente inconexas para descubrir patrones ocultos.', 'ms': 'Saya secara naluri menghubungkan perkara yang nampak tidak berkaitan untuk mencari pola.' }},
        { d: 'SN', r: 1, t: { 'zh-CN': '我认为“脚踏实地解决眼前问题”比“空谈宏大愿景”重要得多。', 'zh-TW': '我認為「腳踏實地解決眼前問題」比「空談宏大願景」重要得多。', 'en': 'Solving immediate practical problems matters much more to me than grand theoretical visions.', 'ja': '壮大なビジョンを語るよりも、目の前の現実的な課題を着実に解決する方がはるかに重要だ。', 'ko': '거창한 비전을 이야기하는 것보다 눈앞의 현실적 문제를 착실히 해결하는 것이 훨씬 중요하다.', 'es': 'Resolver problemas prácticos inmediatos importa mucho más que grandes visiones teóricas.', 'ms': 'Menyelesaikan masalah praktikal semasa jauh lebih penting daripada visi teori yang besar.' }},
        { d: 'SN', r: -1, t: { 'zh-CN': '我喜欢寓意深刻、留白丰富的艺术作品，而非直白写实的表达。', 'zh-TW': '我喜歡寓意深刻、留白豐富的藝術作品，而非直白寫實的表達。', 'en': 'I am drawn to symbolic, open-ended art rather than literal, straightforward depictions.', 'ja': 'ストレートな写実表現よりも、余白と深い寓意に富んだ芸術作品に惹かれる。', 'ko': '직설적인 사실 묘사보다 여백이 많고 깊은 상징이 담긴 예술 작품에 끌린다.', 'es': 'Me atrae el arte simbólico y abierto a interpretación más que el realismo literal.', 'ms': 'Saya tertarik kepada karya seni bersimbol dan terbuka berbanding gambaran realistik terus terang.' }},

        { d: 'TF', r: 1, t: { 'zh-CN': '做重要决定时，我优先依据客观逻辑与利弊分析，而非个人情绪。', 'zh-TW': '做重要決定時，我優先依據客觀邏輯與利弊分析，而非個人情緒。', 'en': 'When making major decisions, I prioritize objective logic and pros/cons over personal feelings.', 'ja': '重要な決断を下すときは、個人の感情よりも客観的な論理と損得分析を優先する。', 'ko': '중요한 결정을 내릴 때 개인적인 감정보다 객관적 논리와 이해득실 분석을 우선한다.', 'es': 'Al tomar decisiones importantes, priorizo la lógica objetiva sobre los sentimientos.', 'ms': 'Apabila membuat keputusan penting, saya utamakan logik objektif berbanding perasaan peribadi.' }},
        { d: 'TF', r: -1, t: { 'zh-CN': '看到他人陷入痛苦时，我会自动感同身受并优先给予情绪抚慰。', 'zh-TW': '看到他人陷入痛苦時，我會自動感同身受並優先給予情緒撫慰。', 'en': 'When someone is hurting, I instinctively empathize and offer emotional comfort first.', 'ja': '誰かが苦しんでいるのを見ると、自然と共感し、まず心のケアを優先する。', 'ko': '타인이 고통스러워하는 모습을 보면 자연스럽게 감정이입되어 정서적 위로를 먼저 건넨다.', 'es': 'Cuando alguien sufre, empatizo al instante y ofrezco consuelo emocional primero.', 'ms': 'Apabila melihat orang lain sedih, saya secara naluri berempati dan memberi ketenangan emosi dahulu.' }},
        { d: 'TF', r: 1, t: { 'zh-CN': '在辩论中，找到真理的逻辑漏洞比维持表面和谐更重要。', 'zh-TW': '在辯論中，找到真理的邏輯漏洞比維持表面和諧更重要。', 'en': 'In a debate, uncovering logical flaws matters more to me than preserving surface harmony.', 'ja': '議論においては、表面的な調和を保つことよりも論理の矛盾を突き止める方が重要だ。', 'ko': '토론에서는 표면적인 화합을 유지하는 것보다 논리적 허점을 찾아내는 것이 더 중요하다.', 'es': 'En un debate, detectar fallos lógicos importa más que mantener una armonía superficial.', 'ms': 'Dalam perdebatan, mengesan kelemahan logik lebih penting daripada menjaga keharmonian luaran.' }},
        { d: 'TF', r: -1, t: { 'zh-CN': '批评别人之前，我会反复斟酌措辞以免伤害对方的自尊心。', 'zh-TW': '批評別人之前，我會反覆斟酌措辭以免傷害對方的自尊心。', 'en': 'Before offering criticism, I carefully soften my words to avoid hurting the other person.', 'ja': '人を批判する前には、相手の自尊心を傷つけないよう言葉選びを慎重に考える。', 'ko': '타인을 비판하기 전에 상대의 자존심이 상하지 않도록 표현을 신중하게 고른다.', 'es': 'Antes de criticar a alguien, cuido mucho mis palabras para no herir su autoestima.', 'ms': 'Sebelum menegur seseorang, saya menapis kata-kata dengan teliti agar tidak melukakan hatinya.' }},
        { d: 'TF', r: 1, t: { 'zh-CN': '朋友向我倾诉烦恼时，我的第一反应是帮他分析原因并给出解决方案。', 'zh-TW': '朋友向我傾訴煩惱時，我的第一反應是幫他分析原因並給出解決方案。', 'en': 'When a friend vents a problem, my first instinct is to analyze causes and propose solutions.', 'ja': '友人が悩みを打ち明けてきたとき、まず原因を分析して解決策を提案したくなる。', 'ko': '친구가 고민을 털어놓으면 가장 먼저 원인을 분석하고 해결책을 제시하려 한다.', 'es': 'Cuando un amigo me cuenta un problema, mi primer impulso es analizarlo y dar soluciones.', 'ms': 'Apabila rakan meluahkan masalah, tindak balas pertama saya ialah menganalisis punca dan memberi solusi.' }},
        { d: 'TF', r: -1, t: { 'zh-CN': '即使某件事完全符合规则，如果它显得冷酷无人情，我也会感到抵触。', 'zh-TW': '即使某件事完全符合規則，如果它顯得冷酷無人情，我也會感到抵觸。', 'en': 'Even if something follows every rule, I resist it if it feels cold or lacking compassion.', 'ja': 'たとえルール通りであっても、冷酷で思いやりに欠けるやり方には強い抵抗を感じる。', 'ko': '아무리 규칙에 딱 들어맞더라도 냉정하고 인간미가 없으면 거부감이 든다.', 'es': 'Aunque algo cumpla todas las reglas, me resisto si resulta frío o falto de compasión.', 'ms': 'Walaupun sesuatu mengikut peraturan, saya menolaknya jika ia terasa dingin dan tiada belas kasihan.' }},
        { d: 'TF', r: 1, t: { 'zh-CN': '我欣赏公平公正、一视同仁的制度，胜过因人而异的特殊照顾。', 'zh-TW': '我欣賞公平公正、一視同仁的制度，勝過因人而異的特殊照顧。', 'en': 'I value fair, impartial principles far above making personal exceptions.', 'ja': '人によって対応を変える特別な配慮よりも、公平公正で一貫したルールを尊重する。', 'ko': '사람에 따라 달라지는 특별 대우보다 공정하고 일관된 원칙을 훨씬 높이 평가한다.', 'es': 'Valoro los principios justos e imparciales por encima de las excepciones personales.', 'ms': 'Saya menghargai prinsip yang adil dan saksama berbanding layanan istimewa mengikut individu.' }},
        { d: 'TF', r: -1, t: { 'zh-CN': '我的价值观很大程度上由内心深处的情感共鸣与善意所驱动。', 'zh-TW': '我的價值觀很大程度上由內心深處的情感共鳴與善意所驅動。', 'en': 'My core values are deeply guided by empathy, kindness, and emotional resonance.', 'ja': '私の価値観は、心の奥底にある感情的な共鳴と思いやりによって大きく動かされている。', 'ko': '나의 가치관은 마음속 깊은 곳의 정서적 공감과 선의에 의해 크게 움직인다.', 'es': 'Mis valores fundamentales se guían profundamente por la empatía y la calidez humana.', 'ms': 'Nilai teras saya banyak dipandu oleh empati, kebaikan hati dan resonans emosi.' }},

        { d: 'JP', r: 1, t: { 'zh-CN': '出发旅行前，我喜欢把交通、住宿与每日行程表规划得井井有条。', 'zh-TW': '出發旅行前，我喜歡把交通、住宿與每日行程表規劃得井井有條。', 'en': 'Before a trip, I love planning transport, stays, and daily itineraries in clear order.', 'ja': '旅行に出発する前には、交通や宿泊、毎日のスケジュールをきちんと計画したい。', 'ko': '여행을 떠나기 전 교통, 숙소, 일별 일정을 빈틈없이 계획해 두는 것을 좋아한다.', 'es': 'Antes de viajar, me encanta planificar el transporte, alojamiento e itinerario diario.', 'ms': 'Sebelum melancong, saya suka merancang pengangkutan, penginapan dan jadual harian dengan teratur.' }},
        { d: 'JP', r: -1, t: { 'zh-CN': '我更享受说走就走、随遇而安的惊喜感，讨厌被日程表死死框住。', 'zh-TW': '我更享受說走就走、隨遇而安的驚喜感，討厭被日程表死死框住。', 'en': 'I love spontaneous adventures and dislike being tightly boxed in by rigid schedules.', 'ja': 'スケジュールに縛られるのを嫌い、思い立ったらすぐ行動するサプライズ感を楽しむ。', 'ko': '빡빡한 일정표에 갇히는 것을 싫어하며 즉흥적이고 자유로운 흐름을 즐긴다.', 'es': 'Disfruto las aventuras espontáneas y detesto sentirme atrapado por horarios rígidos.', 'ms': 'Saya menikmati pengembaraan spontan dan tidak suka terikat dengan jadual yang terlalu ketat.' }},
        { d: 'JP', r: 1, t: { 'zh-CN': '面对截止日期，我习惯提前启动并稳步推进，绝不拖到最后一刻。', 'zh-TW': '面對截止日期，我習慣提前啟動並穩步推進，絕不拖到最後一刻。', 'en': 'With deadlines, I start early and progress steadily rather than rushing at the last minute.', 'ja': '締め切りに対しては早めに着手して着実に進め、ギリギリまで溜め込むことはない。', 'ko': '마감 기한이 있으면 미리 시작해 꾸준히 진행하며 마지막 순간까지 미루지 않는다.', 'es': 'Ante los plazos, empiezo con antelación y avanzo de forma constante sin dejarlo para el final.', 'ms': 'Untuk tarikh akhir, saya bermula awal dan bergerak stabil tanpa menangguh hingga saat akhir.' }},
        { d: 'JP', r: -1, t: { 'zh-CN': '在压力逼近截止时间时，我的灵感和爆发力反而最为惊人。', 'zh-TW': '在壓力逼近截止時間時，我的靈感和爆發力反而最為驚人。', 'en': 'My creativity and burst of energy peak right when a deadline draws close.', 'ja': '締め切りが迫るプレッシャーの中でこそ、ひらめきと爆発力が最大限に発揮される。', 'ko': '마감 시간이 코앞으로 다가왔을 때 오히려 영감과 폭발적인 집중력이 샘솟는다.', 'es': 'Mi creatividad y energía alcanzan su punto máximo justo cuando se acerca la fecha límite.', 'ms': 'Kreativiti dan lonjakan tenaga saya memuncak apabila tarikh akhir semakin hampir.' }},
        { d: 'JP', r: 1, t: { 'zh-CN': '事情尽早尘埃落定会让我感到安心，悬而未决的状态会消耗我的精力。', 'zh-TW': '事情盡早塵埃落定會讓我感到安心，懸而未決的狀態會消耗我的精力。', 'en': 'Having decisions settled gives me peace of mind; open-ended ambiguity drains me.', 'ja': '物事が早く確定すると安心し、未決定のまま宙ぶらりんな状態はエネルギーを消耗する。', 'ko': '일이 일찍 확정되어야 마음이 편하며, 미결 상태로 남아 있으면 에너지가 소모된다.', 'es': 'Tener las cosas decididas me da paz; dejar asuntos abiertos me agota mentalmente.', 'ms': 'Keputusan yang muktamad memberi ketenangan; perkara tergantung meletihkan fikiran saya.' }},
        { d: 'JP', r: -1, t: { 'zh-CN': '我喜欢保留多种开放选项，随时根据当下心情调整计划方向。', 'zh-TW': '我喜歡保留多種開放選項，隨時根據當下心情調整計畫方向。', 'en': 'I prefer keeping multiple options open so I can pivot based on how I feel in the moment.', 'ja': '複数の選択肢を開いたままにしておき、その時の気分で柔軟に方向転換したい。', 'ko': '여러 선택지를 열어 두고 그날의 기분과 상황에 따라 유연하게 계획을 바꾸는 편이다.', 'es': 'Prefiero mantener varias opciones abiertas para cambiar de rumbo según mi estado de ánimo.', 'ms': 'Saya suka mengekalkan pelbagai pilihan terbuka supaya boleh berubah mengikut suasana semasa.' }},
        { d: 'JP', r: 1, t: { 'zh-CN': '我的桌面和文件通常分类清晰，用完东西后会习惯性放回原位。', 'zh-TW': '我的桌面和文件通常分類清晰，用完東西後會習慣性放回原位。', 'en': 'My workspace and files are neatly organized, and I habitually put things back in place.', 'ja': 'デスクやファイルはきちんと整理されており、使った物は自然と元の場所に戻す。', 'ko': '책상과 파일이 깔끔하게 정리되어 있으며, 사용한 물건은 습관적으로 제자리에 둔다.', 'es': 'Mi escritorio y archivos están bien ordenados y suelo devolver cada cosa a su sitio.', 'ms': 'Ruang kerja dan fail saya tersusun rapi, dan saya biasa meletakkan barang kembali ke tempat asal.' }},
        { d: 'JP', r: -1, t: { 'zh-CN': '同时开启好几个兴趣项目并自由切换，比按部就班做完一件更令我兴奋。', 'zh-TW': '同時開啟好幾個興趣專案並自由切換，比按部就班做完一件更令我興奮。', 'en': 'Juggling several exciting projects at once thrills me more than finishing one linearly.', 'ja': '一つのことを順番に終わらせるより、複数の興味あるプロジェクトを並行して行き来する方が楽しい。', 'ko': '하나를 순서대로 끝내는 것보다 흥미로운 여러 프로젝트를 동시에 넘나드는 것이 더 즐겁다.', 'es': 'Alternar entre varios proyectos interesantes a la vez me motiva más que seguir uno lineal.', 'ms': 'Mengendalikan beberapa projek menarik serentak lebih mengujakan saya berbanding satu demi satu.' }},

        { d: 'AO', r: 1, t: { 'zh-CN': '即使遭遇突发变故，我也很快能稳住心态，相信自己能够搞定。', 'zh-TW': '即使遭遇突發變故，我也很快能穩住心態，相信自己能夠搞定。', 'en': 'Even during sudden setbacks, I stay composed and trust my ability to handle it.', 'ja': '突発的なトラブルが起きてもすぐに心を落ち着かせ、自分なら乗り越えられると信じられる。', 'ko': '갑작스러운 위기가 닥쳐도 금방 평정심을 되찾고 스스로 해결할 수 있다고 믿는다.', 'es': 'Incluso ante imprevistos repentinos, mantengo la calma y confío en poder resolverlo.', 'ms': 'Walaupun berdepan halangan mengejut, saya cepat bertenang dan yakin mampu mengatasinya.' }},
        { d: 'AO', r: -1, t: { 'zh-CN': '夜深人静时，我经常反复回想白天说过的话，担心自己哪里表现不够好。', 'zh-TW': '夜深人靜時，我經常反覆回想白天說過的話，擔心自己哪裡表現不夠好。', 'en': 'Late at night, I often replay conversations from the day and worry if I fell short.', 'ja': '夜静かになると、昼間に言ったことを何度も思い返して「悪くなかったかな」と心配になる。', 'ko': '밤이 되면 낮에 했던 말과 행동을 자꾸 되짚어 보며 부족하지 않았는지 걱정한다.', 'es': 'Por la noche suelo repasar lo que dije durante el día preocupándome por si algo salió mal.', 'ms': 'Pada waktu malam, saya sering mengimbas kembali perbualan siang dan risau jika ada kekurangan.' }},
        { d: 'AO', r: 1, t: { 'zh-CN': '做完决定后我很少后悔或反复内耗，而是把注意力投向下一步。', 'zh-TW': '做完決定後我很少後悔或反覆內耗，而是把注意力投向下一步。', 'en': 'Once I make a choice, I rarely second-guess myself and focus straight ahead.', 'ja': '一度決断したら後悔したりクヨクヨ悩んだりせず、すぐに次のステップへ意識を向ける。', 'ko': '결정을 내린 후에는 후회하거나 자책하지 않고 곧바로 다음 단계에 집중한다.', 'es': 'Una vez tomo una decisión, rara vez miro atrás y me enfoco en el siguiente paso.', 'ms': 'Setelah membuat keputusan, saya jarang menyesal dan terus fokus pada langkah seterusnya.' }},
        { d: 'AO', r: -1, t: { 'zh-CN': '别人的一句无心评价或微妙眼神，可能会在我心里盘旋好几个小时。', 'zh-TW': '別人的一句無心評價或微妙眼神，可能會在我心裡盤旋好幾個小時。', 'en': 'A casual remark or subtle glance from someone can linger in my mind for hours.', 'ja': '誰かの何気ない一言や微妙な視線が、何時間も心の中で引っかかり続けることがある。', 'ko': '타인의 무심한 한마디나 미묘한 표정이 몇 시간 동안 머릿속을 맴돌 때가 많다.', 'es': 'Un comentario casual o una mirada sutil puede quedarse dando vueltas en mi mente horas.', 'ms': 'Komen bersahaja atau pandangan halus seseorang boleh bermain di fikiran saya berjam-jam.' }},
        { d: 'AO', r: 1, t: { 'zh-CN': '在高压竞赛或重要汇报前，我依然能保持平稳的呼吸与自信状态。', 'zh-TW': '在高壓競賽或重要匯報前，我依然能保持平穩的呼吸與自信狀態。', 'en': 'Before high-stakes presentations or challenges, I remain steady and self-assured.', 'ja': 'プレッシャーのかかる場面や重要な発表の前でも、落ち着いた呼吸と自信を保てる。', 'ko': '압박감이 큰 발표나 중요한 순간 앞에서도 안정된 호흡과 자신감을 유지한다.', 'es': 'Antes de presentaciones de alta presión, mantengo la serenidad y la confianza.', 'ms': 'Sebelum pembentangan bertekanan tinggi, saya kekal tenang dan yakin diri.' }},
        { d: 'AO', r: -1, t: { 'zh-CN': '我对自己有着近乎严苛的完美主义要求，稍有瑕疵就会感到焦虑。', 'zh-TW': '我對自己有著近乎嚴苛的完美主義要求，稍有瑕疵就會感到焦慮。', 'en': 'I hold myself to perfectionist standards and feel anxious over minor flaws.', 'ja': '自分に対して完璧主義的な高い基準を持っており、少しのミスでも不安を感じやすい。', 'ko': '스스로에게 완벽주의적 기준을 적용해 작은 실수에도 쉽게 불안감을 느낀다.', 'es': 'Me exijo estándares perfeccionistas y siento ansiedad ante cualquier pequeño fallo.', 'ms': 'Saya menetapkan piawaian perfeksionis pada diri sendiri dan mudah cemas jika ada cacat cela.' }},
        { d: 'AO', r: 1, t: { 'zh-CN': '我不太容易被外界的负面情绪传染，内心像一座稳固的灯塔。', 'zh-TW': '我不太容易被外界的負面情緒傳染，內心像一座穩固的燈塔。', 'en': 'I am rarely swept away by external negativity; my inner core stays like a steady lighthouse.', 'ja': '周囲のネガティブな感情に巻き込まれにくく、心は安定した灯台のように揺るがない。', 'ko': '주변의 부정적인 감정에 쉽게 휩쓸리지 않으며 내면이 단단한 등대처럼 흔들리지 않는다.', 'es': 'Rara vez me contagia la negatividad externa; mi interior permanece como un faro firme.', 'ms': 'Saya tidak mudah terpengaruh dengan emosi negatif luar; jiwa saya teguh seperti rumah api.' }},
        { d: 'AO', r: -1, t: { 'zh-CN': '我的情绪天线非常敏锐，能瞬间捕捉到空气中细微的氛围变化。', 'zh-TW': '我的情緒天線非常敏銳，能瞬間捕捉到空氣中細微的氛圍變化。', 'en': 'My emotional antennae are finely tuned to pick up the slightest shift in room atmosphere.', 'ja': '感情のアンテナが非常に敏感で、その場の空気のわずかな変化も瞬時に察知する。', 'ko': '감정 안테나가 매우 예민해서 공간의 미묘한 분위기 변화도 순간적으로 포착한다.', 'es': 'Mis antenas emocionales captan al instante el más mínimo cambio en el ambiente.', 'ms': 'Antena emosi saya sangat peka dan segera mengesan perubahan suasana yang paling halus.' }},

        // --- HC (8 questions: +1 = H Warm/Harmonious, -1 = C Cool/Boundary-driven) ---
        { d: 'HC', r: 1, t: { 'zh-CN': '与人相处时，我喜欢用温暖的微笑、鼓励和赞美拉近彼此距离。', 'zh-TW': '與人相處時，我喜歡用溫暖的微笑、鼓勵和讚美拉近彼此距離。', 'en': 'When interacting, I naturally use warm smiles, encouragement, and praise to connect.', 'ja': '人と接するときは、温かい笑顔や励まし、褒め言葉で自然と距離を縮めるのが好きだ。', 'ko': '사람들과 어울릴 때 따뜻한 미소와 격려, 칭찬으로 자연스럽게 거리를 좁힌다.', 'es': 'Al relacionarme, uso sonrisas cálidas, ánimo y elogios para acercarme a los demás.', 'ms': 'Apabila bergaul, saya suka menggunakan senyuman mesra, galakan dan pujian untuk merapatkan hubungan.' }},
        { d: 'HC', r: -1, t: { 'zh-CN': '我在社交中习惯保持礼貌而清醒的边界感，不会轻易对陌生人敞开心扉。', 'zh-TW': '我在社交中習慣保持禮貌而清醒的邊界感，不會輕易對陌生人敞開心扉。', 'en': 'I maintain polite, clear personal boundaries and rarely open up quickly to strangers.', 'ja': '社交では礼儀正しくも明確な境界線を保ち、初対面の人にすぐ心を開くことはない。', 'ko': '대인관계에서 예의 바르면서도 명확한 경계선을 유지하며 낯선 이에게 쉽게 마음을 열지 않는다.', 'es': 'Mantengo límites personales claros y corteses, y no me abro fácilmente ante desconocidos.', 'ms': 'Saya mengekalkan batasan peribadi yang sopan tetapi jelas dan tidak mudah terbuka kepada orang asing.' }},
        { d: 'HC', r: 1, t: { 'zh-CN': '看到新加入集体的成员有些局促，我会主动走过去热情招呼。', 'zh-TW': '看到新加入集體的成員有些局促，我會主動走過去熱情招呼。', 'en': 'When a newcomer looks shy in a group, I proactively walk over with a warm welcome.', 'ja': 'グループに新しく入った人が緊張していると、自分から歩み寄って温かく声をかける。', 'ko': '모임에 새로 온 사람이 어색해하면 먼저 다가가 따뜻하게 인사를 건넨다.', 'es': 'Si alguien nuevo parece tímido en un grupo, me acerco a darle una cálida bienvenida.', 'ms': 'Jika ahli baharu kelihatan kekok dalam kumpulan, saya segera menyapa dengan mesra.' }},
        { d: 'HC', r: -1, t: { 'zh-CN': '即便面对亲近的人，我也需要保留一块绝对不被打扰的独立精神领地。', 'zh-TW': '即便面對親近的人，我也需要保留一塊絕對不被打擾的獨立精神領地。', 'en': 'Even with close loved ones, I need an untouched sanctuary of mental independence.', 'ja': '親しい相手であっても、誰にも踏み込まれない独立した精神的領域を保ちたい。', 'ko': '아무리 가까운 사이라도 누구에게도 방해받지 않는 독립적인 정신적 영역이 꼭 필요하다.', 'es': 'Incluso con seres queridos, necesito un espacio mental independiente e intacto.', 'ms': 'Walaupun dengan orang tersayang, saya perlukan ruang kebebasan mental yang tidak diganggu.' }},
        { d: 'HC', r: 1, t: { 'zh-CN': '我觉得表达关爱与善意不需要藏着掖着，真诚的热情最有感染力。', 'zh-TW': '我覺得表達關愛與善意不需要藏著掖著，真誠的熱情最有感染力。', 'en': 'Affection and kindness should be expressed openly; genuine warmth is contagious.', 'ja': '思いやりや優しさは隠さずに表現すべきで、誠実な温かさこそが一番心を動かす。', 'ko': '애정과 호의는 숨기지 않고 표현해야 하며, 진심 어린 따뜻함이 가장 큰 울림을 준다.', 'es': 'El afecto y la amabilidad deben expresarse abiertamente; la calidez genuina contagia.', 'ms': 'Kasih sayang dan kebaikan wajar dizahirkan secara terbuka; kemesraan ikhlas amat menyentuh hati.' }},
        { d: 'HC', r: -1, t: { 'zh-CN': '别人常说我第一眼看起来有点高冷或神秘，熟了之后才发现我很有趣。', 'zh-TW': '別人常說我第一眼看起來有點高冷或神秘，熟了之後才發現我很有趣。', 'en': 'People often say I seem cool or mysterious at first, until they get to know me.', 'ja': '第一印象は少しクールでミステリアスに見られがちだが、仲良くなると面白いと言われる。', 'ko': '첫인상은 다소 차갑거나 신비로워 보이지만 친해지면 의외로 재미있다는 말을 자주 듣는다.', 'es': 'Suelen decir que parezco distante o misterioso al principio, hasta que me conocen bien.', 'ms': 'Orang sering kata saya kelihatan dingin atau misteri pada mulanya sehingga mereka mengenali saya.' }},
        { d: 'HC', r: 1, t: { 'zh-CN': '我很容易对小动物、温馨故事或他人的善举产生柔软的感动。', 'zh-TW': '我很容易對小動物、溫馨故事或他人的善舉產生柔軟的感動。', 'en': 'I am easily touched by cute animals, heartwarming stories, and small acts of kindness.', 'ja': '小動物や心温まる物語、人のちょっとした優しさにすぐ心がほっこり感動する。', 'ko': '작은 동물이나 따뜻한 이야기, 타인의 작은 선행에 마음이 쉽게 몽글몽글해진다.', 'es': 'Me conmueven fácilmente los animales tiernos, las historias cálidas y los gestos amables.', 'ms': 'Saya mudah tersentuh dengan haiwan comel, kisah menyentuh hati dan kebaikan kecil orang lain.' }},
        { d: 'HC', r: -1, t: { 'zh-CN': '在合作中，我更看重彼此的专业能力与效率，而非刻意的寒暄客套。', 'zh-TW': '在合作中，我更看重彼此的專業能力與效率，而非刻意的寒暄客套。', 'en': 'In collaboration, I value competence and clarity far more than small talk or pleasantries.', 'ja': '協力作業では、形式的な世間話よりもお互いの専門性と効率を重視する。', 'ko': '협업할 때는 의례적인 인사치레보다 서로의 전문성과 효율성을 훨씬 중요하게 생각한다.', 'es': 'Al colaborar, valoro mucho más la competencia y eficacia que las charlas triviales.', 'ms': 'Dalam kerjasama, saya lebih mementingkan kecekapan profesional berbanding basa-basi kosong.' }}

        { d: 'Dominance', r: -1, t: { 'zh-CN': '比起发号施令，我更喜欢作为幕后支援者默默守护团队。', 'zh-TW': '比起發號施令，我更喜歡作為幕後支援者默默守護團隊。', 'en': 'Rather than giving orders, I prefer quietly supporting and protecting the group from behind.', 'ja': '命令を下すよりも、裏方のサポーターとして静かに仲間を見守る方が好きだ。', 'ko': '지시를 내리는 것보다 뒤에서 조용히 팀을 돕고 지키는 조력자 역할이 더 편하다.', 'es': 'Más que dar órdenes, prefiero apoyar y proteger al grupo discretamente desde atrás.', 'ms': 'Berbanding memberi arahan, saya lebih suka menyokong dan melindungi pasukan dari belakang.' }},
        { d: 'Dominance', r: 1, t: { 'zh-CN': '面对不公的挑战，我有足够的勇气正面迎战。', 'zh-TW': '面對不公的挑戰，我有足夠的勇氣正面迎戰。', 'en': 'When facing an unfair challenge, I have the courage to confront it head-on.', 'ja': '理不尽な挑戦に対しては、正面から立ち向かう十分な勇気を持っている。', 'ko': '부당한 도전에 직면했을 때 정면으로 맞서 싸울 충분한 용기가 있다.', 'es': 'Ante un desafío injusto, tengo el valor suficiente para enfrentarlo de frente.', 'ms': 'Apabila berdepan cabaran tidak adil, saya mempunyai keberanian untuk menentangnya secara berdepan.' }},

        { d: 'Social', r: 1, t: { 'zh-CN': '与志同道合的伙伴并肩奔跑，比独自单打独斗更让我有安全感。', 'zh-TW': '與志同道合的夥伴並肩奔跑，比獨自單打獨鬥更讓我有安全感。', 'en': 'Running alongside a loyal pack gives me far more strength than going solo.', 'ja': '一人で戦うよりも、志を同じくする仲間と肩を並べて走る方が安心感と力が湧く。', 'ko': '혼자 싸우는 것보다 뜻을 함께하는 무리와 나란히 달릴 때 훨씬 큰 힘과 안정감을 느낀다.', 'es': 'Correr junto a una manada leal me da mucha más fuerza que ir en solitario.', 'ms': 'Bergerak bersama kumpulan yang setia memberi saya lebih kekuatan berbanding bersendirian.' }},
        { d: 'Social', r: 1, t: { 'zh-CN': '我擅长在群体中传递快乐信号，很快就能和大家打成一片。', 'zh-TW': '我擅長在群體中傳遞快樂訊號，很快就能和大家打成一片。', 'en': 'I naturally radiate playful energy in a group and bond quickly with everyone.', 'ja': 'グループの中で楽しい空気を広げるのが得意で、すぐにみんなと打ち解ける。', 'ko': '무리 속에서 즐거운 에너지를 전파하는 데 능숙해 금세 모두와 어울린다.', 'es': 'Irradio energía alegre en grupo y conecto rápidamente con todo el mundo.', 'ms': 'Saya pandai menyebarkan keceriaan dalam kumpulan dan cepat mesra dengan semua.' }},
        { d: 'Social', r: -1, t: { 'zh-CN': '我像一只习惯在月光下独行的动物，享受完全自由的孤独。', 'zh-TW': '我像一隻習慣在月光下獨行的動物，享受完全自由的孤獨。', 'en': 'Like a solitary creature under the moonlight, I cherish complete, untethered solitude.', 'ja': '月明かりの下を一人で歩く生き物のように、完全に自由な孤独を愛している。', 'ko': '달빛 아래 홀로 걷는 동물처럼 누구에게도 구속받지 않는 완전한 고독을 즐긴다.', 'es': 'Como una criatura solitaria bajo la luna, aprecio la soledad libre y sin ataduras.', 'ms': 'Seperti haiwan yang berjalan sendirian di bawah cahaya bulan, saya menghargai kesunyian bebas.' }},
        { d: 'Social', r: 1, t: { 'zh-CN': '我非常重视族群的羁绊，为了保护同伴愿意付出一切。', 'zh-TW': '我非常重視族群的羈絆，為了保護同伴願意付出一切。', 'en': 'I deeply value pack loyalty and would do anything to protect my inner circle.', 'ja': '仲間の絆を何よりも大切にし、大切な人を守るためなら全力を尽くす。', 'ko': '동료와의 유대를 무엇보다 소중히 여기며 내 사람을 지키기 위해서라면 무엇이든 한다.', 'es': 'Valoro profundamente la lealtad del grupo y daría todo por proteger a los míos.', 'ms': 'Saya amat menghargai ikatan kumpulan dan sanggup berkorban demi melindungi rakan.' }},

        { d: 'Agility', r: 1, t: { 'zh-CN': '环境变化时，我能像灵巧的狐狸一样瞬间调整策略并找到新出口。', 'zh-TW': '環境變化時，我能像靈巧的狐狸一樣瞬間調整策略並找到新出口。', 'en': 'When conditions shift, I pivot like a nimble fox and spot new pathways instantly.', 'ja': '環境が変化すると、機敏なキツネのように瞬時に戦略を変え新しい活路を見出す。', 'ko': '환경이 변하면 영리한 여우처럼 순식간에 전략을 수정해 새로운 돌파구를 찾는다.', 'es': 'Cuando cambia el entorno, me adapto como un zorro ágil y hallo nuevas salidas al instante.', 'ms': 'Apabila keadaan berubah, saya menyesuaikan strategi sepantas musang dan menemui jalan baharu.' }},
        { d: 'Agility', r: 1, t: { 'zh-CN': '我的感官非常警觉，风吹草动都逃不过我的直觉雷达。', 'zh-TW': '我的感官非常警覺，風吹草動都逃不過我的直覺雷達。', 'en': 'My senses are hyper-alert; not even the faintest rustle escapes my intuitive radar.', 'ja': '感覚が非常に鋭く、わずかな変化や気配も直感のレーダーを逃れない。', 'ko': '감각이 매우 예민해서 작은 움직임이나 기류 변화도 직관의 레이더를 벗어나지 못한다.', 'es': 'Mis sentidos están siempre alerta; ni el más leve movimiento escapa a mi radar intuitivo.', 'ms': 'Deria saya sangat peka; pergerakan paling halus pun tidak terlepas daripada radar naluri saya.' }},
        { d: 'Agility', r: -1, t: { 'zh-CN': '相比快速变通，我更喜欢以沉稳厚重的步伐稳扎稳打。', 'zh-TW': '相比快速變通，我更喜歡以沉穩厚重的步伐穩紮穩打。', 'en': 'Rather than rapid pivoting, I prefer steady, grounded, deliberate strides.', 'ja': '素早い方向転換よりも、どっしりと落ち着いた歩幅で着実に進む方を好む。', 'ko': '빠른 임기응변보다 묵직하고 차분한 발걸음으로 한 걸음씩 나아가는 편이 좋다.', 'es': 'Más que cambios rápidos, prefiero avanzar con pasos firmes, constantes y pausados.', 'ms': 'Berbanding perubahan pantas, saya lebih suka langkah yang mantap, tenang dan teratur.' }},
        { d: 'Agility', r: 1, t: { 'zh-CN': '我总能用出其不意的幽默或机智化解尴尬局面。', 'zh-TW': '我總能用出其不意的幽默或機智化解尷尬局面。', 'en': 'I can defuse awkward tension in a flash with unexpected wit and cleverness.', 'ja': '予想外のユーモアや機転を利かせて、気まずい空気を一瞬で和らげることができる。', 'ko': '예상치 못한 유머와 재치로 어색한 분위기를 순식간에 풀어내는 능력이 있다.', 'es': 'Sé disolver tensiones incómodas al instante con ingenio y humor inesperado.', 'ms': 'Saya pandai meredakan suasana kekok dalam sekelip mata dengan jenaka dan kebijaksanaan.' }},

        { d: 'Wisdom', r: 1, t: { 'zh-CN': '我习惯站在高处俯瞰全局，思考事物长远的因果脉络。', 'zh-TW': '我習慣站在高處俯瞰全局，思考事物長遠的因果脈絡。', 'en': 'I naturally soar above the noise to see the big picture and long-term consequences.', 'ja': '高い視点から全体を見渡し、物事の長期的な因果関係を深く考える習慣がある。', 'ko': '높은 곳에서 전체 판을 내려다보며 사물의 장기적인 인과관계를 깊이 생각한다.', 'es': 'Suelo elevarme sobre el ruido para observar el panorama completo a largo plazo.', 'ms': 'Saya biasa melihat gambaran keseluruhan dari tempat tinggi dan memikirkan kesan jangka panjang.' }},
        { d: 'Wisdom', r: 1, t: { 'zh-CN': '周围的人遇到迷茫时，经常来向我寻求冷静而通透的建议。', 'zh-TW': '周圍的人遇到迷茫時，經常來向我尋求冷靜而通透的建議。', 'en': 'When friends feel lost, they frequently turn to me for calm, insightful counsel.', 'ja': '周りの人が迷ったとき、冷静で本質を突いたアドバイスを求めてよく相談に来る。', 'ko': '주변 사람들이 길을 잃고 헤맬 때 차분하고 통찰력 있는 조언을 구하러 자주 찾아온다.', 'es': 'Cuando los demás se sienten perdidos, acuden a mí buscando consejos serenos y lúcidos.', 'ms': 'Apabila rakan keliru, mereka sering mencari saya untuk mendapatkan nasihat yang tenang dan bernas.' }},
        { d: 'Wisdom', r: -1, t: { 'zh-CN': '我更相信当下的热血冲动，不喜欢在行动前过度思虑。', 'zh-TW': '我更相信當下的熱血衝動，不喜歡在行動前過度思慮。', 'en': 'I trust immediate passion and action over overthinking before leaping.', 'ja': '行動する前に考えすぎるよりも、その瞬間の熱い衝動と行動力を信じる。', 'ko': '행동하기 전에 지나치게 고민하기보다 그 순간의 뜨거운 열정과 실행력을 믿는다.', 'es': 'Confío más en el impulso apasionado del momento que en analizar demasiado antes de actuar.', 'ms': 'Saya lebih mempercayai semangat tindakan semasa berbanding berfikir terlalu lama sebelum bergerak.' }},
        { d: 'Wisdom', r: 1, t: { 'zh-CN': '静谧的夜晚与深度阅读能让我获得源源不断的灵性洞见。', 'zh-TW': '靜謐的夜晚與深度閱讀能讓我獲得源源不斷的靈性洞見。', 'en': 'Quiet nights and deep reflection bring me an endless stream of clarity and insight.', 'ja': '静かな夜と深い思索や読書から、尽きることのない洞察力とひらめきを得る。', 'ko': '고요한 밤과 깊은 사색은 나에게 끊임없는 통찰과 영감을 가져다준다.', 'es': 'Las noches tranquilas y la reflexión profunda me brindan claridad constante.', 'ms': 'Malam yang tenang dan renungan mendalam memberi saya ilham serta kejernihan fikiran.' }}
      ],

      // 16 Questions for 16 Love Type (4 per axis: AI, RP, FS, DM)
      love: [
        { d: 'AI', r: 1, t: { 'zh-CN': '遇到心动的人，我会主动释放信号甚至率先告白，不想留下遗憾。', 'zh-TW': '遇到心動的人，我會主動釋放訊號甚至率先告白，不想留下遺憾。', 'en': 'When attracted to someone, I take the initiative and confess first rather than hold back.', 'ja': '惹かれる人に出会ったら、後悔しないよう自分からサインを送り積極的にアプローチする。', 'ko': '마음에 드는 사람이 생기면 후회하지 않도록 먼저 신호를 보내고 적극적으로 다가간다.', 'es': 'Cuando alguien me atrae, tomo la iniciativa y me declaro primero sin guardarme nada.', 'ms': 'Apabila tertarik pada seseorang, saya mengambil inisiatif dan meluahkan perasaan dahulu.' }},
        { d: 'AI', r: -1, t: { 'zh-CN': '在感情初期，我更倾向于含蓄观察，等待对方先迈出确定的一步。', 'zh-TW': '在感情初期，我更傾向於含蓄觀察，等待對方先邁出確定的一步。', 'en': 'Early in romance, I observe subtly and wait for the other person to take the first clear step.', 'ja': '恋愛の初期は控えめに様子を見守り、相手が先に一歩踏み出してくれるのを待つ。', 'ko': '연애 초기에는 조심스럽게 지켜보며 상대가 먼저 확실한 한 걸음을 내딛기를 기다린다.', 'es': 'Al inicio del romance, observo con discreción y espero a que la otra persona dé el primer paso.', 'ms': 'Pada awal percintaan, saya memerhati secara halus dan menunggu pasangan melangkah dahulu.' }},
        { d: 'AI', r: 1, t: { 'zh-CN': '吵架或冷战时，我通常是主动递台阶、发起沟通的那一方。', 'zh-TW': '吵架或冷戰時，我通常是主動遞台階、發起溝通的那一方。', 'en': 'After a disagreement, I am usually the one who reaches out first to mend the bridge.', 'ja': '喧嘩や気まずい空気になったときは、自分から歩み寄って話し合いを切り出すことが多い。', 'ko': '다투거나 냉전이 생기면 보통 내가 먼저 손을 내밀고 대화를 시도하는 편이다.', 'es': 'Tras una discusión, suelo ser quien tiende el puente primero para hablar y reconciliarnos.', 'ms': 'Selepas perselisihan faham, saya biasanya pihak yang memulakan komunikasi untuk berdamai.' }},
        { d: 'AI', r: -1, t: { 'zh-CN': '即使非常喜欢对方，我也会保持克制，等待慢热的安全感建立。', 'zh-TW': '即使非常喜歡對方，我也會保持克制，等待慢熱的安全感建立。', 'en': 'Even when deeply infatuated, I pace myself slowly until deep trust feels secure.', 'ja': 'どれほど好きでも感情を抑え、じっくり安心感が育つまで慎重に距離を縮める。', 'ko': '아무리 좋아해도 감정을 절제하며 천천히 신뢰와 안정감이 쌓일 때까지 기다린다.', 'es': 'Aunque me guste mucho alguien, mantengo la calma hasta construir confianza segura.', 'ms': 'Walaupun sangat menyukai seseorang, saya menahan diri sehingga rasa percaya terbina kukuh.' }},

        { d: 'RP', r: 1, t: { 'zh-CN': '手写情书、纪念日惊喜和星空下的散步对我来说不可或缺。', 'zh-TW': '手寫情書、紀念日驚喜和星空下的散步對我來說不可或缺。', 'en': 'Handwritten love notes, anniversary surprises, and stargazing walks are essential to me.', 'ja': '手書きのラブレターや記念日のサプライズ、星空の下の散歩は恋愛に欠かせない。', 'ko': '손편지, 기념일 서프라이즈, 별빛 아래 산책 같은 낭만은 연애에 꼭 필요하다.', 'es': 'Las cartas escritas a mano, sorpresas de aniversario y paseos bajo las estrellas son esenciales.', 'ms': 'Surat cinta tulisan tangan, kejutan ulang tahun dan berjalan di bawah bintang amat bermakna bagi saya.' }},
        { d: 'RP', r: -1, t: { 'zh-CN': '比起花哨的浪漫仪式，我更看重对方在日常生活中的务实可靠。', 'zh-TW': '比起花哨的浪漫儀式，我更看重對方在日常生活中的務實可靠。', 'en': 'Practical daily reliability matters much more to me than grand romantic gestures.', 'ja': '派手なロマンチック演出よりも、日常生活での誠実さと頼りがいを重視する。', 'ko': '화려한 로맨틱 이벤트보다 일상 속에서 보여주는 현실적이고 든든한 믿음을 더 중시한다.', 'es': 'La fiabilidad práctica en el día a día me importa mucho más que los gestos románticos grandiosos.', 'ms': 'Kebolehpercayaan praktikal dalam kehidupan harian jauh lebih penting daripada gimik romantik.' }},
        { d: 'RP', r: 1, t: { 'zh-CN': '我常在脑海里编织关于两个人的诗意画面与理想化童话。', 'zh-TW': '我常在腦海裡編織關於兩個人的詩意畫面與理想化童話。', 'en': 'I love daydreaming poetic scenes and fairytale moments shared with my partner.', 'ja': '二人の詩的なワンシーンや理想の物語を頭の中で思い描くのが好きだ。', 'ko': '두 사람의 시적인 장면과 동화 같은 순간들을 머릿속으로 자주 그려본다.', 'es': 'Me encanta imaginar escenas poéticas y momentos de cuento compartidos en pareja.', 'ms': 'Saya suka membayangkan detik-detik puitis dan kisah indah bersama pasangan.' }},
        { d: 'RP', r: -1, t: { 'zh-CN': '我认为爱情最好的证明是一起规划财务、分担家务与共同成长。', 'zh-TW': '我認為愛情最好的證明是一起規劃財務、分擔家務與共同成長。', 'en': 'The truest proof of love is building shared plans, daily teamwork, and practical growth.', 'ja': '愛の最高の証明は、将来の計画や日々の家事を共に分かち合い成長していくことだ。', 'ko': '사랑의 가장 확실한 증명은 함께 미래를 계획하고 일상을 나누며 성장하는 것이다.', 'es': 'La mejor prueba de amor es construir planes juntos, compartir tareas y crecer en equipo.', 'ms': 'Bukti cinta sejati ialah merancang masa depan bersama, berkongsi tanggungjawab dan berkembang.' }},

        { d: 'FS', r: 1, t: { 'zh-CN': '爱上一个人时，我的爱意像盛夏烈火一样炽热浓烈、毫不掩饰。', 'zh-TW': '愛上一個人時，我的愛意像盛夏烈火一樣熾熱濃烈、毫不掩飾。', 'en': 'When I fall in love, my affection burns bright, intense, and unmistakably passionate.', 'ja': '誰かを愛すると、真夏の炎のように熱く濃密で隠しきれない愛情を注ぐ。', 'ko': '누군가를 사랑하게 되면 한여름의 불꽃처럼 뜨겁고 강렬하게 애정을 표현한다.', 'es': 'Cuando me enamoro, mi afecto arde con intensidad, pasión y total entrega.', 'ms': 'Apabila jatuh cinta, kasih sayang saya membara dengan penuh semangat dan keikhlasan.' }},
        { d: 'FS', r: -1, t: { 'zh-CN': '我更向往细水长流、温柔克制、彼此安心的默契陪伴。', 'zh-TW': '我更嚮往細水長流、溫柔克制、彼此安心的默契陪伴。', 'en': 'I cherish gentle, steady, tranquil companionship that deepens quietly over time.', 'ja': '激しい情熱よりも、穏やかに長く続く優しく安心できる寄り添いを望む。', 'ko': '격정적인 사랑보다 잔잔하게 오래 흐르며 서로에게 편안한 안식처가 되는 사랑을 원한다.', 'es': 'Prefiero una compañía serena, suave y constante que se profundice con calma.', 'ms': 'Saya mengimpikan persahabatan cinta yang tenang, lembut dan kekal mendalam dari semasa ke semasa.' }},
        { d: 'FS', r: 1, t: { 'zh-CN': '我喜欢频繁的肢体拥抱、秒回消息与直白热烈的“我爱你”。', 'zh-TW': '我喜歡頻繁的肢體擁抱、秒回消息與直白熱烈的「我愛你」。', 'en': 'I love frequent hugs, instant replies, and heartfelt, frequent words of affection.', 'ja': '頻繁なハグや即レス、ストレートな「大好き」という言葉のやり取りが好きだ。', 'ko': '자주 안아주고 메시지를 바로 답장하며 솔직하게 사랑한다고 말하는 연애가 좋다.', 'es': 'Me encantan los abrazos frecuentes, las respuestas rápidas y decir "te amo" abiertamente.', 'ms': 'Saya suka pelukan mesra, balasan mesej pantas dan ucapan sayang yang tulus.' }},
        { d: 'FS', r: -1, t: { 'zh-CN': '过度的情绪起伏会让我疲惫，平和稳定的情感温度最让我舒适。', 'zh-TW': '過度的情緒起伏會讓我疲憊，平和穩定的情感溫度最讓我舒適。', 'en': 'Dramatic emotional rollercoasters exhaust me; calm emotional warmth feels best.', 'ja': '激しい感情の起伏は疲れてしまうため、穏やかで安定した温度感が一番心地よい。', 'ko': '지나친 감정 기복은 쉽게 지치게 하며, 평온하고 일정한 온도의 사랑이 가장 편안하다.', 'es': 'Las montañas rusas emocionales me agotan; prefiero una calidez serena y estable.', 'ms': 'Turun naik emosi yang melampau meletihkan saya; kehangatan yang tenang paling selesa.' }},

        { d: 'DM', r: 1, t: { 'zh-CN': '在亲密关系中，我渴望灵魂深度交融、事事分享的共生感。', 'zh-TW': '在親密關係中，我渴望靈魂深度交融、事事分享的共生感。', 'en': 'In love, I crave deep soul fusion and sharing every detail of daily life together.', 'ja': '恋愛では魂が深く溶け合い、日々の出来事をすべて分かち合う一体感を求める。', 'ko': '연애에서는 영혼이 깊이 연결되어 일상의 모든 것을 함께 나누는 일체감을 원한다.', 'es': 'En pareja, anhelo una fusión profunda de almas y compartir cada detalle del día.', 'ms': 'Dalam percintaan, saya mendambakan penyatuan jiwa dan berkongsi setiap detik kehidupan.' }},
        { d: 'DM', r: -1, t: { 'zh-CN': '即便在热恋中，我也必须拥有独立的独处时间与个人朋友圈。', 'zh-TW': '即便在熱戀中，我也必須擁有獨立的獨處時間與個人朋友圈。', 'en': 'Even when deeply in love, I need independent solo time and my own personal space.', 'ja': 'どれほど愛し合っていても、一人の時間や自分の交友関係はしっかり保ちたい。', 'ko': '아무리 깊이 사랑하더라도 혼자만의 시간과 개인적인 인간관계는 반드시 지켜야 한다.', 'es': 'Incluso muy enamorado, necesito mi tiempo independiente a solas y mi propio espacio.', 'ms': 'Walaupun sedang hangat bercinta, saya tetap perlukan masa bersendirian dan ruang peribadi.' }},
        { d: 'DM', r: 1, t: { 'zh-CN': '伴侣的情绪状态会直接牵动我的喜怒哀乐，我们是命运共同体。', 'zh-TW': '伴侶的情緒狀態會直接牽動我的喜怒哀樂，我們是命運共同體。', 'en': 'My partner’s mood deeply shapes mine; we feel like two halves of one shared orbit.', 'ja': 'パートナーの感情が自分の喜怒哀楽に直結し、二人は運命共同体だと感じる。', 'ko': '연인의 감정 상태가 나의 기분에 직접적인 영향을 주며 우리는 운명 공동체라고 느낀다.', 'es': 'El estado de ánimo de mi pareja influye directamente en el mío; somos un equipo unido.', 'ms': 'Emosi pasangan sangat mempengaruhi perasaan saya; kami bagaikan satu kesatuan jiwa.' }},
        { d: 'DM', r: -1, t: { 'zh-CN': '我认为健康的爱情是两棵并肩而立的树，各自扎根又彼此守望。', 'zh-TW': '我認為健康的愛情是兩棵並肩而立的樹，各自扎根又彼此守望。', 'en': 'Healthy love is two independent trees standing side by side—rooted separately yet close.', 'ja': '健全な愛とは、隣り合って立つ二本の木のように、それぞれが自立しつつ支え合う関係だ。', 'ko': '건강한 사랑은 나란히 선 두 그루의 나무처럼 각자 독립적으로 뿌리내리며 바라보는 것이다.', 'es': 'El amor sano son dos árboles independientes lado a lado: con raíces propias pero cercanos.', 'ms': 'Cinta yang sihat ibarat dua pohon berdiri berdampingan—berakar sendiri namun saling menjaga.' }}

      // 24 Questions for 12 Jungian Archetypes (2 per archetype)
      jungian: [
        { d: 'ruler', r: 1, t: { 'zh-CN': '我喜欢制定秩序与规则，确保团队朝着清晰的目标高效运转。', 'zh-TW': '我喜歡制定秩序與規則，確保團隊朝著清晰的目標高效運轉。', 'en': 'I enjoy establishing order and structure so everything runs smoothly toward clear goals.', 'ja': '秩序とルールを整え、チームが明確な目標に向かって効率よく動くように導くのが好きだ。', 'ko': '질서와 규칙을 세워 팀이 명확한 목표를 향해 효율적으로 움직이도록 이끄는 것을 좋아한다.', 'es': 'Disfruto creando orden y estructura para que todo avance con eficacia hacia metas claras.', 'ms': 'Saya suka mewujudkan ketertiban dan struktur agar pasukan bergerak lancar ke arah matlamat.' }},
        { d: 'ruler', r: 1, t: { 'zh-CN': '当周围陷入混乱时，我自然会承担起统筹与责任。', 'zh-TW': '當周圍陷入混亂時，我自然會承擔起統籌與責任。', 'en': 'When chaos erupts, I naturally step up to coordinate and take responsibility.', 'ja': '周囲が混乱に陥ったとき、自然と全体を取りまとめ責任を引き受ける。', 'ko': '주변이 혼란에 빠지면 자연스럽게 전체를 조율하고 책임을 짊어진다.', 'es': 'Cuando surge el caos, asumo de forma natural la coordinación y la responsabilidad.', 'ms': 'Apabila keadaan menjadi huru-hara, saya secara semula jadi menyelaraskan dan memikul tanggungjawab.' }},

        { d: 'creator', r: 1, t: { 'zh-CN': '把脑海中的独特灵感转化为看得见的作品，是我最大的快乐。', 'zh-TW': '把腦海中的獨特靈感轉化為看得見的作品，是我最大的快樂。', 'en': 'Turning original ideas in my mind into tangible creations brings me peak joy.', 'ja': '頭の中にある独創的なひらめきを形ある作品に変えることが最大の喜びだ。', 'ko': '머릿속의 독창적인 영감을 눈에 보이는 작품으로 구현할 때 가장 큰 행복을 느낀다.', 'es': 'Convertir ideas originales de mi mente en obras tangibles es mi mayor alegría.', 'ms': 'Menjelmakan ilham asli dalam fikiran menjadi karya nyata adalah kegembiraan terbesar saya.' }},
        { d: 'creator', r: 1, t: { 'zh-CN': '我无法忍受千篇一律的平庸复制，总想注入个人美学印记。', 'zh-TW': '我無法忍受千篇一律的平庸複製，總想注入個人美學印記。', 'en': 'I dislike cookie-cutter imitation and always want to infuse my own aesthetic signature.', 'ja': '画一的なコピーには我慢できず、常に自分ならではの美意識や個性を吹き込みたい。', 'ko': '천편일률적인 모방을 견디지 못하며 항상 나만의 미학적 색깔을 담아내고 싶다.', 'es': 'No soporto las copias genéricas; siempre quiero dejar mi propia huella estética.', 'ms': 'Saya tidak gemar tiruan yang seragam dan sentiasa mahu menyuntik sentuhan estetika sendiri.' }},

        { d: 'caregiver', r: 1, t: { 'zh-CN': '照顾他人的需求并看到他们露出安心笑容，让我感到自我价值。', 'zh-TW': '照顧他人的需求並看到他們露出安心笑容，讓我感到自我價值。', 'en': 'Nurturing others and seeing their relieved smiles gives me deep fulfillment.', 'ja': '人のニーズに寄り添い、安心した笑顔を見ることが自分の存在価値につながる。', 'ko': '타인의 필요를 보살피고 그들이 안심하며 웃는 모습을 볼 때 큰 보람을 느낀다.', 'es': 'Cuidar las necesidades de los demás y ver su sonrisa tranquila me llena de sentido.', 'ms': 'Menjaga keperluan orang lain dan melihat senyuman tenang mereka memberi kepuasan mendalam.' }},
        { d: 'caregiver', r: 1, t: { 'zh-CN': '我经常把家人和朋友的冷暖放在自己之前。', 'zh-TW': '我經常把家人和朋友的冷暖放在自己之前。', 'en': 'I often put the comfort and well-being of loved ones ahead of my own.', 'ja': '家族や友人の心地よさや安心を、自分自身のことよりも優先しがちだ。', 'ko': '가족과 친구들의 안위를 나 자신보다 먼저 챙기는 편이다.', 'es': 'A menudo pongo el bienestar de mi familia y amigos por delante del mío.', 'ms': 'Saya sering mengutamakan keselesaan keluarga dan rakan melebihi diri sendiri.' }},

        { d: 'hero', r: 1, t: { 'zh-CN': '越是艰难险阻的任务，越能激发我迎难而上的斗志。', 'zh-TW': '越是艱難險阻的任務，越能激發我迎難而上的鬥志。', 'en': 'The tougher the obstacle, the fiercer my determination to conquer it.', 'ja': '困難で険しい課題であればあるほど、立ち向かう闘志が燃え上がる。', 'ko': '어렵고 험난한 과제일수록 맞서 돌파하려는 투지가 더욱 강하게 불타오른다.', 'es': 'Cuanto más difícil es el obstáculo, mayor es mi determinación para superarlo.', 'ms': 'Semakin sukar halangan yang dihadapi, semakin membara semangat juang saya untuk menaklukinya.' }},
        { d: 'hero', r: 1, t: { 'zh-CN': '我希望用自己的实力与勇气保护弱者、捍卫正义。', 'zh-TW': '我希望用自己的實力與勇氣保護弱者、捍衛正義。', 'en': 'I strive to use my strength and courage to stand up for fairness and protect others.', 'ja': '自分の実力と勇気をもって弱い立場の人を守り、正義を貫きたいと願っている。', 'ko': '나의 실력과 용기로 약자를 보호하고 정의를 지키고 싶다는 열망이 있다.', 'es': 'Aspiro a usar mi fuerza y valentía para defender lo justo y proteger a los demás.', 'ms': 'Saya berazam menggunakan kekuatan dan keberanian untuk membela keadilan serta melindungi orang lain.' }},

        { d: 'outlaw', r: 1, t: { 'zh-CN': '我不在乎是否符合主流期待，只想忠于叛逆而真实的自我。', 'zh-TW': '我不在乎是否符合主流期待，只想忠於叛逆而真實的自我。', 'en': 'I do not care about fitting conventional molds; I stay true to my untamed spirit.', 'ja': '世間の常識に合わせることは気にせず、反骨精神あふれる本当の自分に忠実でいたい。', 'ko': '주류의 기대에 맞추는 데 연연하지 않고 거침없고 진실한 나 자신에게 충실하고 싶다.', 'es': 'No me importa encajar en moldes convencionales; soy fiel a mi espíritu libre.', 'ms': 'Saya tidak kisah mengikut acuan arus perdana; saya setia pada jiwa bebas dan asli saya.' }},

        { d: 'magician', r: 1, t: { 'zh-CN': '我擅长洞察事物背后的深层联系，促成意想不到的蜕变。', 'zh-TW': '我擅長洞察事物背後的深層聯繫，促成意想不到的蛻變。', 'en': 'I see hidden connections beneath the surface and catalyze unexpected transformation.', 'ja': '物事の背後にある深い繋がりを見抜き、思いがけない変容を引き起こすのが得意だ。', 'ko': '사물 이면의 깊은 연결고리를 통찰해 예상치 못한 변화와 혁신을 이끌어낸다.', 'es': 'Percibo conexiones ocultas bajo la superficie y catalizo transformaciones inesperadas.', 'ms': 'Saya mampu melihat hubungan tersembunyi dan mencetuskan transformasi luar jangkaan.' }},
        { d: 'magician', r: 1, t: { 'zh-CN': '我相信意识与愿景的力量能够将看似不可能的梦想变为现实。', 'zh-TW': '我相信意識與願景的力量能夠將看似不可能的夢想變為現實。', 'en': 'I believe focused vision and intention can turn seemingly impossible dreams into reality.', 'ja': '意識とビジョンの力があれば、不可能に見える夢も現実に変えられると信じている。', 'ko': '의식과 비전의 힘이 불가능해 보이는 꿈도 현실로 바꿀 수 있다고 믿는다.', 'es': 'Creo que la visión enfocada puede convertir sueños aparentemente imposibles en realidad.', 'ms': 'Saya percaya kuasa visi dan niat mampu mengubah impian mustahil menjadi kenyataan.' }},

        { d: 'explorer', r: 1, t: { 'zh-CN': '未知的远方、陌生的文化与未踏足的领域总是强烈召唤着我。', 'zh-TW': '未知的遠方、陌生的文化與未踏足的領域總是強烈召喚著我。', 'en': 'Uncharted horizons, unfamiliar cultures, and open roads constantly call to me.', 'ja': '未知の土地や異文化、まだ誰も踏み入れていない領域がいつも私を強く呼び寄せる。', 'ko': '미지의 세계, 낯선 문화, 가보지 않은 길은 언제나 나를 강하게 끌어당긴다.', 'es': 'Los horizontes inexplorados y las culturas desconocidas me llaman constantemente.', 'ms': 'Ufuk yang belum diterokai, budaya asing dan jalan baharu sentiasa memanggil jiwa saya.' }},
        { d: 'explorer', r: 1, t: { 'zh-CN': '相比安稳舒适的重复生活，我更害怕失去自由探索的空间。', 'zh-TW': '相比安穩舒適的重複生活，我更害怕失去自由探索的空間。', 'en': 'I fear losing the freedom to roam far more than leaving a comfortable routine.', 'ja': '安定した快適な日常を離れることよりも、自由に探検する余地を失うことの方が怖い。', 'ko': '안정적이고 편안한 일상을 떠나는 것보다 자유롭게 탐험할 공간을 잃는 것이 더 두렵다.', 'es': 'Temo mucho más perder mi libertad de explorar que dejar una rutina cómoda.', 'ms': 'Saya lebih takut kehilangan kebebasan meneroka berbanding meninggalkan rutin yang selesa.' }},

        { d: 'sage', r: 1, t: { 'zh-CN': '追寻客观真理、研究底层逻辑与深度阅读是我一生的热爱。', 'zh-TW': '追尋客觀真理、研究底層邏輯與深度閱讀是我一生的熱愛。', 'en': 'Seeking objective truth, studying first principles, and deep learning are my lifelong passion.', 'ja': '客観的な真理の探求や根本原理の研究、深い学びこそが私の生涯の情熱だ。', 'ko': '객관적 진리를 탐구하고 근본 원리를 연구하며 깊이 배우는 것이 평생의 열정이다.', 'es': 'Buscar la verdad objetiva, estudiar principios fundamentales y aprender es mi pasión.', 'ms': 'Mencari kebenaran objektif, mengkaji prinsip asas dan pembelajaran mendalam adalah minat utama saya.' }},
        { d: 'sage', r: 1, t: { 'zh-CN': '在得出结论前，我一定会多方求证、保持独立清醒的判断。', 'zh-TW': '在得出結論前，我一定會多方求證、保持獨立清醒的判斷。', 'en': 'Before drawing conclusions, I verify multiple sources and maintain clear independent judgment.', 'ja': '結論を出す前には必ず多角的に検証し、冷静で独立した判断を保つ。', 'ko': '결론을 내리기 전에 반드시 다각도로 검증하며 냉철하고 독립적인 판단을 유지한다.', 'es': 'Antes de concluir, verifico múltiples fuentes y mantengo un juicio independiente.', 'ms': 'Sebelum membuat kesimpulan, saya mengesahkan pelbagai sumber dengan pertimbangan bebas.' }},

        { d: 'innocent', r: 1, t: { 'zh-CN': '我始终相信人性本善，喜欢在平凡日常中发现纯真的美好。', 'zh-TW': '我始終相信人性本善，喜歡在平凡日常中發現純真的美好。', 'en': 'I hold onto faith in goodness and love discovering pure, simple wonders in everyday life.', 'ja': '人の善意を信じ、何気ない日常の中に純粋で美しい輝きを見つけるのが好きだ。', 'ko': '인간의 선의를 믿으며 평범한 일상 속에서 순수하고 작은 아름다움을 발견하는 것을 좋아한다.', 'es': 'Confío en la bondad humana y disfruto hallando maravillas puras en lo cotidiano.', 'ms': 'Saya percaya pada kebaikan hati dan suka menemui keindahan murni dalam kehidupan seharian.' }},
        { d: 'innocent', r: 1, t: { 'zh-CN': '真诚、简单与透明的相处方式让我感到最放松。', 'zh-TW': '真誠、簡單與透明的相處方式讓我感到最放鬆。', 'en': 'Sincere, simple, and transparent relationships make me feel most at peace.', 'ja': '誠実でシンプル、裏表のない付き合い方が一番心をリラックスさせてくれる。', 'ko': '진실하고 단순하며 투명한 관계 속에서 가장 큰 편안함을 느낀다.', 'es': 'Las relaciones sinceras, sencillas y transparentes son las que más paz me dan.', 'ms': 'Hubungan yang ikhlas, ringkas dan telus membuatkan saya berasa paling tenang.' }},

        { d: 'lover', r: 1, t: { 'zh-CN': '审美体验、艺术感官与灵魂层面的深情共鸣是我生命的养分。', 'zh-TW': '審美體驗、藝術感官與靈魂層面的深情共鳴是我生命的養分。', 'en': 'Aesthetic beauty, sensory richness, and soulful emotional intimacy nourish my life.', 'ja': '美しいものへの感動や芸術的感性、魂レベルでの深い共鳴が私の生きる糧だ。', 'ko': '아름다움에 대한 감각, 예술적 취향, 영혼의 깊은 교감이 내 삶의 원동력이다.', 'es': 'La belleza estética, los sentidos y la intimidad emocional nutren mi existencia.', 'ms': 'Keindahan estetika, deria seni dan keintiman jiwa yang mendalam menyuburkan hidup saya.' }},
        { d: 'lover', r: 1, t: { 'zh-CN': '我全心投入所爱之人与所爱之事，渴望深度连接与美感。', 'zh-TW': '我全心投入所愛之人與所愛之事，渴望深度連接與美感。', 'en': 'I devote myself wholeheartedly to the people and passions I love, craving deep connection.', 'ja': '愛する人や好きなことに全身全霊を注ぎ、深い結びつきと美しさを求める。', 'ko': '사랑하는 사람과 일에 온 마음을 다해 몰입하며 깊은 연결과 아름다움을 갈망한다.', 'es': 'Me entrego de corazón a las personas y pasiones que amo, buscando conexión profunda.', 'ms': 'Saya mencurahkan sepenuh hati kepada insan dan minat yang dicintai demi ikatan mendalam.' }},

        { d: 'everyman', r: 1, t: { 'zh-CN': '我喜欢脚踏实地的归属感，平等友善地对待身边的每一个人。', 'zh-TW': '我喜歡腳踏實地的歸屬感，平等友善地對待身邊的每一個人。', 'en': 'I value grounded belonging and treat everyone around me with warmth and equality.', 'ja': '地に足のついた帰属意識を大切にし、周りのすべての人に平等で親しみやすく接する。', 'ko': '소박하고 따뜻한 소속감을 소중히 여기며 주변 모든 사람을 평등하고 다정하게 대한다.', 'es': 'Valoro el sentido de pertenencia sencillo y trato a todos con cercanía e igualdad.', 'ms': 'Saya menghargai rasa kekitaan yang membumi dan melayan semua orang secara mesra serta saksama.' }},

          love: 'Menghargai persefahaman jiwa yang mendalam; berkongsi sisi lembut dalam rutin harian mengeratkan lagi hubungan.'
        }
      };
      return packs[lang] || packs['en'];
    }

    /**
     * ============================================================================
     * 5. SVG CHARTS & DATA VISUALIZATION GENERATORS
     * ============================================================================
     */
    const ChartEngine = {
      renderHexRadar(scores, labels) {
        // scores: array of 6 numbers (0..100)
        const cx = 150, cy = 150, maxR = 104;
        const angles = [-90, -30, 30, 90, 150, 210].map(deg => deg * Math.PI / 180);
        const gridLevels = [0.25, 0.5, 0.75, 1.0];
        let grids = '';
        gridLevels.forEach(lvl => {
          const pts = angles.map(a => `${(cx + Math.cos(a) * maxR * lvl).toFixed(1)},${(cy + Math.sin(a) * maxR * lvl).toFixed(1)}`).join(' ');
          grids += `<polygon points="${pts}" fill="none" stroke="#3B2E2A" stroke-opacity="${lvl === 1 ? 0.25 : 0.1}" stroke-width="1.2" stroke-dasharray="${lvl === 1 ? 'none' : '3 3'}" />`;
        });
        let axes = '';
        angles.forEach(a => {
          axes += `<line x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(a) * maxR).toFixed(1)}" y2="${(cy + Math.sin(a) * maxR).toFixed(1)}" stroke="#3B2E2A" stroke-opacity="0.14" stroke-width="1" />`;
        });
        const dataPts = angles.map((a, i) => {
          const r = maxR * (Math.max(15, Math.min(100, scores[i])) / 100);
          return `${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`;
        }).join(' ');
        const dots = angles.map((a, i) => {
          const r = maxR * (Math.max(15, Math.min(100, scores[i])) / 100);
          const x = (cx + Math.cos(a) * r).toFixed(1);
          const y = (cy + Math.sin(a) * r).toFixed(1);
          const lx = (cx + Math.cos(a) * (maxR + 24)).toFixed(1);
          const ly = (cy + Math.sin(a) * (maxR + 20)).toFixed(1);
          return `
            <circle cx="${x}" cy="${y}" r="4.5" fill="#F4A29E" stroke="#3B2E2A" stroke-width="1.8" />
            <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="800" fill="#3B2E2A">${labels[i]}</text>
          `;
        }).join('');

        return `<svg viewBox="0 0 300 300" class="w-full max-w-[290px] mx-auto overflow-visible">
          ${grids}
          ${axes}
          <polygon points="${dataPts}" fill="rgba(247, 197, 159, 0.48)" stroke="#3B2E2A" stroke-width="2.2" stroke-linejoin="round" />
          ${dots}
        </svg>`;
      },

      renderQuadRadar(scores, labels, fillCol = 'rgba(168, 218, 220, 0.5)') {
        const cx = 145, cy = 145, maxR = 98;
        const angles = [-90, 0, 90, 180].map(deg => deg * Math.PI / 180);
        let grids = '';
        [0.33, 0.66, 1.0].forEach(lvl => {
          const pts = angles.map(a => `${(cx + Math.cos(a) * maxR * lvl).toFixed(1)},${(cy + Math.sin(a) * maxR * lvl).toFixed(1)}`).join(' ');
          grids += `<polygon points="${pts}" fill="none" stroke="#3B2E2A" stroke-opacity="0.14" stroke-width="1.2" />`;
        });
        const dataPts = angles.map((a, i) => {
          const r = maxR * (Math.max(15, Math.min(100, scores[i])) / 100);
          return `${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`;
        }).join(' ');
        const dots = angles.map((a, i) => {
          const r = maxR * (Math.max(15, Math.min(100, scores[i])) / 100);
          const x = (cx + Math.cos(a) * r).toFixed(1);
          const y = (cy + Math.sin(a) * r).toFixed(1);
          const lx = (cx + Math.cos(a) * (maxR + 24)).toFixed(1);
          const ly = (cy + Math.sin(a) * (maxR + 18)).toFixed(1);
          return `
            <circle cx="${x}" cy="${y}" r="4.5" fill="#FFE699" stroke="#3B2E2A" stroke-width="1.8" />
            <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="800" fill="#3B2E2A">${labels[i]} (${scores[i]}%)</text>
          `;
        }).join('');

        return `<svg viewBox="0 0 290 290" class="w-full max-w-[280px] mx-auto overflow-visible">
          ${grids}
          <line x1="${cx}" y1="${cy - maxR}" x2="${cx}" y2="${cy + maxR}" stroke="#3B2E2A" stroke-opacity="0.14" />
          <line x1="${cx - maxR}" y1="${cy}" x2="${cx + maxR}" y2="${cy}" stroke="#3B2E2A" stroke-opacity="0.14" />
          <polygon points="${dataPts}" fill="${fillCol}" stroke="#3B2E2A" stroke-width="2.2" stroke-linejoin="round" />
          ${dots}
        </svg>`;
      },

      renderPolar12Radar(keys, scores, labels) {
        const cx = 160, cy = 160, maxR = 104;
        const angles = keys.map((_, i) => (-90 + i * 30) * Math.PI / 180);
        let rings = '';
        [0.33, 0.66, 1.0].forEach(lvl => {
          rings += `<circle cx="${cx}" cy="${cy}" r="${(maxR * lvl).toFixed(1)}" fill="none" stroke="#3B2E2A" stroke-opacity="0.12" stroke-dasharray="3 3" />`;
        });
        const spokes = angles.map((a, i) => {
          const x2 = (cx + Math.cos(a) * maxR).toFixed(1);
          const y2 = (cy + Math.sin(a) * maxR).toFixed(1);
          const lx = (cx + Math.cos(a) * (maxR + 24)).toFixed(1);
          const ly = (cy + Math.sin(a) * (maxR + 20)).toFixed(1);
          return `
            <line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#3B2E2A" stroke-opacity="0.12" />
            <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="800" fill="#3B2E2A">${labels[i]}</text>
          `;
        }).join('');
        const poly = angles.map((a, i) => {
          const r = maxR * (Math.max(18, Math.min(100, scores[i])) / 100);
          return `${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`;
        }).join(' ');
        const pts = angles.map((a, i) => {
          const r = maxR * (Math.max(18, Math.min(100, scores[i])) / 100);
          return `<circle cx="${(cx + Math.cos(a) * r).toFixed(1)}" cy="${(cy + Math.sin(a) * r).toFixed(1)}" r="3.5" fill="#C7CEEA" stroke="#3B2E2A" stroke-width="1.5" />`;
        }).join('');

        return `<svg viewBox="0 0 320 320" class="w-full max-w-[310px] mx-auto overflow-visible">
          ${rings}
          ${spokes}
          <polygon points="${poly}" fill="rgba(199, 206, 234, 0.55)" stroke="#3B2E2A" stroke-width="2" stroke-linejoin="round" />
          ${pts}
        </svg>`;
      }
    };

    /**
     * ============================================================================
     * 6. MAIN APPLICATION CONTROLLER & STATE MANAGEMENT
     * ============================================================================
     */
    const App = {
      state: {
        lang: 'zh-CN',
        devicePref: 'auto', // 'auto' | 'desktop' | 'mobile'
        view: 'portal',     // 'portal' | 'quiz' | 'result' | 'atlas' | 'profile'
        quiz: null,         // { testId, mode, questions, index, answers }
        result: null,       // computed report payload
        previewSubtype: null,
        dualityView: 'both', // 'both' | 'day' | 'night'
        simDay: 'ENTJ',
        simNight: 'INFP',
        atlasFilter: { search: '', system: 'all', tier: 'all' },
        nickname: '',
        history: []
      },

      init() {
        // 1. Restore or auto-detect language
        const savedLang = localStorage.getItem('64personality_lang');
        if (savedLang && UI_STRINGS[savedLang]) {
          this.state.lang = savedLang;
        } else {
          const nav = (navigator.language || 'en').toLowerCase();
          if (nav.startsWith('zh-tw') || nav.startsWith('zh-hk') || nav.startsWith('zh-mo')) this.state.lang = 'zh-TW';
          else if (nav.startsWith('zh')) this.state.lang = 'zh-CN';
          else if (nav.startsWith('ja')) this.state.lang = 'ja';
          else if (nav.startsWith('ko')) this.state.lang = 'ko';
          else if (nav.startsWith('es')) this.state.lang = 'es';
          else if (nav.startsWith('ms') || nav.startsWith('id')) this.state.lang = 'ms';
          else this.state.lang = 'en';
        }

        // 2. Restore archive & nickname
        try {
          const rawHist = localStorage.getItem('64personality_history');
          if (rawHist) this.state.history = JSON.parse(rawHist);
          this.state.nickname = localStorage.getItem('64personality_nick') || '';
        } catch (e) {}

        // 3. Setup Desktop/Mobile adaptive listeners
        const savedDev = localStorage.getItem('64personality_device');
        if (savedDev && ['auto', 'desktop', 'mobile'].includes(savedDev)) {
          this.state.devicePref = savedDev;
        }
        this.applyDeviceMode();
        window.addEventListener('resize', () => this.applyDeviceMode());
        window.addEventListener('orientationchange', () => this.applyDeviceMode());

        // Close language dropdown when clicking outside
        document.addEventListener('click', (e) => {
          const wrap = document.getElementById('lang-menu-wrap');
          const dd = document.getElementById('lang-dropdown');
          if (wrap && dd && !wrap.contains(e.target)) {
            dd.classList.add('hidden');
          }
        });

        this.renderAll();
      },

      t(key) {
        const pack = UI_STRINGS[this.state.lang] || UI_STRINGS['en'];
        return pack[key] !== undefined ? pack[key] : (UI_STRINGS['en'][key] || key);
      },

      loc(obj) {
        if (!obj) return '';
        if (typeof obj === 'string') return obj;
        return obj[this.state.lang] || obj['en'] || obj['zh-CN'] || Object.values(obj)[0];
      },

      toggleLangMenu(e) {
        if (e) e.stopPropagation();
        const dd = document.getElementById('lang-dropdown');
        dd.classList.toggle('hidden');
      },

      setLanguage(code) {
        if (!UI_STRINGS[code]) return;
        this.state.lang = code;
        localStorage.setItem('64personality_lang', code);
        document.documentElement.lang = code;
        document.getElementById('lang-dropdown').classList.add('hidden');
        this.renderAll();
        this.toast(this.t('langToast'));
      },

      setDeviceMode(mode) {
        this.state.devicePref = mode;
        localStorage.setItem('64personality_device', mode);
        this.applyDeviceMode();
        this.renderAll();
      },

      applyDeviceMode() {
        const isSmallViewport = window.matchMedia('(max-width: 768px)').matches;
        const effective = this.state.devicePref === 'auto'
          ? (isSmallViewport ? 'mobile' : 'desktop')
          : this.state.devicePref;
        document.documentElement.setAttribute('data-device', effective);
        if (this.state.devicePref === 'mobile' && !isSmallViewport) {
          document.documentElement.classList.add('force-mobile-preview');
        } else {
          document.documentElement.classList.remove('force-mobile-preview');
        }
        ['auto', 'desktop', 'mobile'].forEach(m => {
          const btn = document.getElementById(`dev-btn-${m}`);
          if (btn) {
            btn.className = this.state.devicePref === m
              ? 'px-2 py-1 rounded-full text-[11px] font-extrabold bg-[#3B2E2A] text-[#FAF5EB] transition'
              : 'px-2 py-1 rounded-full text-[11px] font-bold text-[#6E5A52] hover:text-[#3B2E2A] transition';
          }
        });
      },

      toast(msg) {
        const box = document.getElementById('toast-box');
        const txt = document.getElementById('toast-text');
        txt.textContent = msg;
        box.classList.remove('opacity-0', '-translate-y-2');
        box.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => {
          box.classList.add('opacity-0', '-translate-y-2');
          box.classList.remove('opacity-100', 'translate-y-0');
        }, 2600);
      },

      navigate(view) {
        this.state.view = view;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        this.renderAll();
      },

      renderAll() {
        document.documentElement.lang = this.state.lang;
        document.title = `64personality · ${this.t('brandSub')}`;
        document.getElementById('brand-subtitle').textContent = this.t('brandSub');

        // Render Language Selector
        const curLangObj = LANGUAGES.find(l => l.code === this.state.lang) || LANGUAGES[0];
        document.getElementById('current-lang-label').textContent = curLangObj.label;
        document.getElementById('lang-dropdown').innerHTML = LANGUAGES.map(l => `
          <button onclick="App.setLanguage('${l.code}')" class="w-full px-3.5 py-2 text-left text-xs font-bold flex items-center justify-between hover:bg-amber-100/70 transition ${l.code === this.state.lang ? 'bg-amber-100 text-[#3B2E2A] font-black' : 'text-[#6E5A52]'}">
            <span>${l.flag} ${l.label}</span>

        // Render Navigation Bars (Desktop & Mobile)
