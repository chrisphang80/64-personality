          { id: 'portal', icon: '🧭', label: this.t('navTests') },

        document.getElementById('desktop-nav').innerHTML = navItems.map(item => `
          <button onclick="App.navigate('${item.id}')" class="px-4 py-1.5 rounded-full text-xs font-extrabold flex items-center gap-1.5 transition ${activeTab === item.id ? 'bg-[#3B2E2A] text-[#FAF5EB] shadow-xs' : 'text-[#6E5A52] hover:text-[#3B2E2A]'}">
            <span>${item.icon}</span>
            <span>${item.label}</span>
          </button>
        `).join('');

        document.getElementById('mobile-bottom-nav').innerHTML = navItems.map(item => `
          <button onclick="App.navigate('${item.id}')" class="flex flex-col items-center justify-center py-1 px-4 rounded-2xl transition ${activeTab === item.id ? 'text-[#3B2E2A] scale-105' : 'text-[#9C877E]'}">
            <span class="text-lg leading-none">${item.icon}</span>
            <span class="text-[11px] font-extrabold mt-1">${item.label}</span>
            ${activeTab === item.id ? '<span class="w-4 h-1 rounded-full bg-[#3B2E2A] mt-0.5"></span>' : '<span class="w-4 h-1 mt-0.5"></span>'}
          </button>
        `).join('');

        // Render Main Stage
        const stage = document.getElementById('main-stage');
        if (this.state.view === 'portal') stage.innerHTML = this.renderPortal();
        else if (this.state.view === 'quiz') {
          stage.innerHTML = this.renderQuiz();
          this.bindQuizSwipe();
        }
        else if (this.state.view === 'result') stage.innerHTML = this.renderResult();
        else if (this.state.view === 'atlas') stage.innerHTML = this.renderAtlas();
        else if (this.state.view === 'profile') stage.innerHTML = this.renderProfile();
      },

      /**
       * ========================================================================
       * QUIZ ENGINE (Quick 24Q / Pro 48Q, 7-Point Likert Scale & Mobile Swipe-Back)
       * ========================================================================
       */
      startQuiz(testId, mode = 'standard') {
        let questions = [];
        if (testId === 'mbti64') {
          const all = QUIZ_BANKS.mbti64;
          if (mode === 'quick') {
            // Take first 4 questions of each 8-question dimension block -> 24 balanced questions
            const dims = ['EI', 'SN', 'TF', 'JP', 'AO', 'HC'];
            dims.forEach(dim => {
              const subset = all.filter(q => q.d === dim).slice(0, 4);
              questions.push(...subset);
            });
          } else {
            questions = [...all];
          }
        } else {
          questions = [...QUIZ_BANKS[testId]];
        }
        this.state.quiz = {
          testId,
          mode,
          questions,
          index: 0,
          answers: new Array(questions.length).fill(null)
        };
        this.navigate('quiz');
      },

      answerQuestion(val) {
        const qz = this.state.quiz;
        if (!qz) return;
        qz.answers[qz.index] = val;
        if (qz.index < qz.questions.length - 1) {
          qz.index++;
          this.renderAll();
        } else {
          this.finishQuiz();
        }
      },

      prevQuestion() {
        const qz = this.state.quiz;
        if (!qz || qz.index <= 0) return;
        qz.index--;
        this.renderAll();
      },

      nextQuestion() {
        const qz = this.state.quiz;
        if (!qz) return;
        if (qz.answers[qz.index] === null) {
          this.toast(this.t('unansweredToast'));
          return;
        }
        if (qz.index < qz.questions.length - 1) {
          qz.index++;
          this.renderAll();
        } else {
          this.finishQuiz();
        }
      },

      bindQuizSwipe() {
        const card = document.getElementById('quiz-swipe-card');
        if (!card) return;
        let startX = 0, startY = 0;
        card.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
          }
        }, { passive: true });
        card.addEventListener('touchend', (e) => {
          if (e.changedTouches.length === 1) {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = Math.abs(e.changedTouches[0].clientY - startY);
            if (dx > 65 && dy < 55) {
              this.prevQuestion();
            }
          }
        }, { passive: true });
      },

      renderQuiz() {
        const qz = this.state.quiz;
        if (!qz) return this.renderPortal();
        const meta = TESTS_META[qz.testId];

      /**
       * ========================================================================
       * PSYCHOMETRIC SCORING & INSTANT RANDOM DEMO ENGINE
       * ========================================================================
       */
      runRandomDemo(testId) {
        this.startQuiz(testId, testId === 'mbti64' ? 'quick' : 'standard');
        const qz = this.state.quiz;
        const choices = [-3, -2, -1, 1, 2, 3];
        qz.answers = qz.questions.map(() => choices[Math.floor(Math.random() * choices.length)]);
        this.finishQuiz(true);
        this.toast(this.t('demoToast'));
      },

      finishQuiz(isDemo = false) {
        const qz = this.state.quiz;
        if (!qz) return;
        const testId = qz.testId;
        let report = null;

        if (testId === 'mbti64') {
          const dims = ['EI', 'SN', 'TF', 'JP', 'AO', 'HC'];
          const pctMap = {};
          dims.forEach(d => {
            let sum = 0, max = 0;
            qz.questions.forEach((q, i) => {
              if (q.d === d) {
                const v = qz.answers[i] ?? 0;
                sum += v * q.r;
                max += 3;
              }
            });
            pctMap[d] = Math.round(((sum + max) / (2 * max)) * 100);
          });
          const l1 = pctMap.EI >= 50 ? 'E' : 'I';
          const l2 = pctMap.SN >= 50 ? 'S' : 'N';
          const l3 = pctMap.TF >= 50 ? 'T' : 'F';
          const l4 = pctMap.JP >= 50 ? 'J' : 'P';
          const s1 = pctMap.AO >= 50 ? 'A' : 'O';
          const s2 = pctMap.HC >= 50 ? 'H' : 'C';
          const baseCode = `${l1}${l2}${l3}${l4}`;
          const subtype = `${s1}-${s2}`;
          report = {
            testId: 'mbti64',
            baseCode,
            subtype,
            code: `${baseCode}-${subtype}`,
            pctMap,
            timestamp: Date.now()
          };
          this.state.previewSubtype = subtype;
        } else if (testId === 'animal') {
          const axes = ['Dominance', 'Social', 'Agility', 'Wisdom'];
          const scores = {};
          axes.forEach(ax => {
            let sum = 0, max = 0;
            qz.questions.forEach((q, i) => {
              if (q.d === ax) {
                sum += (qz.answers[i] ?? 0) * q.r;
                max += 3;
              }
            });
            scores[ax] = Math.round(((sum + max) / (2 * max)) * 100);
          });
          // Match closest of 8 animals
          const profiles = {
            lion:    [90, 75, 65, 70],
            wolf:    [75, 45, 80, 75],
            fox:     [55, 60, 95, 80],
            owl:     [45, 35, 60, 96],
            deer:    [30, 70, 75, 75],
            eagle:   [85, 40, 88, 85],
            bear:    [80, 50, 35, 72],
            dolphin: [50, 95, 85, 75]
          };
          let ranked = Object.entries(profiles).map(([id, vec]) => {
            const dist = Math.hypot(
              scores.Dominance - vec[0],
              scores.Social - vec[1],
              scores.Agility - vec[2],
              scores.Wisdom - vec[3]
            );
            return { id, dist };
          }).sort((a, b) => a.dist - b.dist);

          report = {
            testId: 'animal',
            code: ranked[0].id,
            shadowCode: ranked[ranked.length - 1].id,
            scores,
            timestamp: Date.now()
          };
        } else if (testId === 'love') {
          const dims = ['AI', 'RP', 'FS', 'DM'];
          const pctMap = {};
          dims.forEach(d => {
            let sum = 0, max = 0;
            qz.questions.forEach((q, i) => {
              if (q.d === d) {
                sum += (qz.answers[i] ?? 0) * q.r;
                max += 3;
              }
            });
            pctMap[d] = Math.round(((sum + max) / (2 * max)) * 100);
          });
          const code =
            (pctMap.AI >= 50 ? 'A' : 'I') +
            (pctMap.RP >= 50 ? 'R' : 'P') +
            (pctMap.FS >= 50 ? 'F' : 'S') +
            (pctMap.DM >= 50 ? 'D' : 'M');
          report = {
            testId: 'love',
            code,
            pctMap,
            timestamp: Date.now()
          };
        } else if (testId === 'jungian') {
          const keys = Object.keys(JUNGIAN_DATA);
          const scores = {};
          keys.forEach(k => {
            let sum = 0, max = 0;
            qz.questions.forEach((q, i) => {
              if (q.d === k) {
                sum += (qz.answers[i] ?? 0) * q.r;
                max += 3;
              }
            });
            scores[k] = Math.round(((sum + max) / (2 * max)) * 100);
          });
          const sorted = [...keys].sort((a, b) => scores[b] - scores[a]);
          report = {
            testId: 'jungian',
            code: sorted[0],
            wingCode: sorted[1],
            shadowCode: sorted[sorted.length - 1],
            scores,
            timestamp: Date.now()
          };
        } else if (testId === 'duality') {
          const dims = ['EI', 'SN', 'TF', 'JP'];
          const dayPct = {}, nightPct = {};
          dims.forEach(d => {
            let dSum = 0, dMax = 0, nSum = 0, nMax = 0;
            qz.questions.forEach((q, i) => {
              if (q.d === d) {
                const v = qz.answers[i] ?? 0;
                if (q.track === 'day') { dSum += v * q.r; dMax += 3; }
                else { nSum += v * q.r; nMax += 3; }
              }
            });
            dayPct[d] = Math.round(((dSum + dMax) / (2 * dMax)) * 100);
            nightPct[d] = Math.round(((nSum + nMax) / (2 * nMax)) * 100);
          });
          const dayCode = (dayPct.EI >= 50 ? 'E' : 'I') + (dayPct.SN >= 50 ? 'S' : 'N') + (dayPct.TF >= 50 ? 'T' : 'F') + (dayPct.JP >= 50 ? 'J' : 'P');
          const nightCode = (nightPct.EI >= 50 ? 'E' : 'I') + (nightPct.SN >= 50 ? 'S' : 'N') + (nightPct.TF >= 50 ? 'T' : 'F') + (nightPct.JP >= 50 ? 'J' : 'P');
          const contrast = Math.round(dims.reduce((acc, d) => acc + Math.abs(dayPct[d] - nightPct[d]), 0) / 4);
          report = {
            testId: 'duality',
            code: `${dayCode}/${nightCode}`,
            dayCode,
            nightCode,
            dayPct,
            nightPct,
            contrast,
            timestamp: Date.now()
          };
          this.state.simDay = dayCode;
          this.state.simNight = nightCode;
          this.state.dualityView = 'both';
        }

        this.state.result = report;
        // Save to archive
        this.state.history.unshift(report);
        if (this.state.history.length > 30) this.state.history.pop();
        try {
          localStorage.setItem('64personality_history', JSON.stringify(this.state.history));
        } catch (e) {}

        this.navigate('result');
      },

                </ul>
              </div>
              <div class="storybook-card rounded-3xl p-5 space-y-2.5">
                <h3 class="font-display font-black text-base text-[#3B2E2A]">${this.t('blindSpots')}</h3>
                <ul class="space-y-2 text-xs sm:text-sm text-[#3B2E2A]/90">
                  ${rich.blindSpots.map(s => `<li class="flex items-start gap-2"><span class="text-amber-600 font-black">•</span><span>${s}</span></li>`).join('')}
                </ul>
              </div>
              <div class="storybook-card rounded-3xl p-5 space-y-2">
                <h3 class="font-display font-black text-base text-[#3B2E2A]">${this.t('careerAdvice')}</h3>

              <div class="storybook-card rounded-3xl p-5 space-y-2">

      },

      /**
       * ========================================================================
       * FULL STORYBOOK ATLAS (64 Subtypes + 8 Animals + 16 Love + 12 Jungian)
       * ========================================================================
       */
      updateAtlasFilter(key, val) {
        this.state.atlasFilter[key] = val;
        this.renderAll();
      },

      getAllAtlasItems() {
        const items = [];
        // 1. All 64 MBTI Subtypes
        Object.keys(MBTI_BASE_DATA).forEach(base => {
          ['A-H', 'A-C', 'O-H', 'O-C'].forEach(st => {
            const sub = SUBTYPE_META[st];
            items.push({
              system: 'mbti64',
              code: `${base}-${st}`,
              artType: 'mbti',
              artKey: `${base}-${sub.artCode}`,
              name: `${this.loc(MBTI_BASE_DATA[base].name)} · ${this.loc(sub.tag).split(' (')[0]}`,
              motto: this.loc(MBTI_BASE_DATA[base].motto),
              desc: `${this.loc(MBTI_BASE_DATA[base].summary)} ${this.loc(sub.desc)}`,
              tier: POPULARITY_TIERS[base] || 'classic'
            });
          });
        });
        // 2. All 8 Spirit Animals
        Object.values(ANIMAL_DATA).forEach(ani => {
          items.push({
            system: 'animal',
            code: ani.id.toUpperCase(),
            artType: 'animal',
            artKey: ani.artKey,
            name: `${this.loc(ani.name)} (${this.loc(ani.role)})`,
            motto: this.loc(ani.motto),
            desc: this.loc(ani.motto),
            tier: POPULARITY_TIERS[ani.id] || 'hot'
          });
        });
        // 3. All 16 Love Types
        Object.entries(LOVE_TYPES_DATA).forEach(([code, lv]) => {
          items.push({
            system: 'love',
            code,
            artType: 'love',
            artKey: code,
            name: this.loc(lv.name),
            motto: `🎁 ${this.loc(lv.keepsake)}`,
            desc: `${this.loc(lv.name)} · 🎁 ${this.loc(lv.keepsake)}`,
            tier: POPULARITY_TIERS[code] || 'resonate'
          });
        });
        // 4. All 12 Jungian Archetypes
        Object.entries(JUNGIAN_DATA).forEach(([id, jg]) => {
          items.push({
            system: 'jungian',
            code: id.toUpperCase(),
            artType: 'jungian',
            artKey: id,
            name: this.loc(jg.name),
            motto: this.loc(jg.motto),
            desc: this.loc(jg.motto),
            tier: POPULARITY_TIERS[id] || 'classic'
          });
        });
        return items;
      },

      renderAtlas() {
        const isDesktop = document.documentElement.getAttribute('data-device') === 'desktop';
        const { search, system, tier } = this.state.atlasFilter;
        const q = search.trim().toLowerCase();
        const tiersObj = this.t('tiers');

        const filtered = this.getAllAtlasItems().filter(it => {
          if (system !== 'all' && it.system !== system) return false;
          if (tier !== 'all' && it.tier !== tier) return false;
          if (q && !(`${it.code} ${it.name} ${it.motto}`.toLowerCase().includes(q))) return false;
          return true;
        });

        return `
          <div class="space-y-5 animate-pop">
            <section class="storybook-card rounded-3xl p-5 sm:p-7 space-y-4">
              <div>
                <h1 class="font-display font-black text-2xl sm:text-3xl text-[#3B2E2A]">${this.t('atlasTitle')}</h1>
                <p class="text-xs sm:text-sm text-[#6E5A52] mt-1">${this.t('atlasSub')}</p>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <input type="text" value="${search.replace(/"/g, '&quot;')}" oninput="App.updateAtlasFilter('search', this.value)" placeholder="${this.t('searchPlaceholder')}"
                  class="px-3.5 py-2.5 rounded-2xl bg-white border-2 border-[#3B2E2A]/15 text-xs font-bold text-[#3B2E2A] focus:outline-none focus:border-[#3B2E2A]" />
                <select onchange="App.updateAtlasFilter('system', this.value)" class="px-3.5 py-2.5 rounded-2xl bg-white border-2 border-[#3B2E2A]/15 text-xs font-extrabold text-[#3B2E2A]">
                  <option value="all" ${system === 'all' ? 'selected' : ''}>${this.t('allSystems')} (100)</option>
                  <option value="mbti64" ${system === 'mbti64' ? 'selected' : ''}>MBTI-64 (64)</option>
                  <option value="animal" ${system === 'animal' ? 'selected' : ''}>ANIMAL-8 (8)</option>
                  <option value="love" ${system === 'love' ? 'selected' : ''}>LOVE-16 (16)</option>
                  <option value="jungian" ${system === 'jungian' ? 'selected' : ''}>JUNG-12 (12)</option>
                </select>
                <select onchange="App.updateAtlasFilter('tier', this.value)" class="px-3.5 py-2.5 rounded-2xl bg-white border-2 border-[#3B2E2A]/15 text-xs font-extrabold text-[#3B2E2A]">
                  <option value="all" ${tier === 'all' ? 'selected' : ''}>${this.t('allTiers')}</option>
                  ${Object.entries(tiersObj).map(([k, lbl]) => `<option value="${k}" ${tier === k ? 'selected' : ''}>${lbl}</option>`).join('')}
                </select>
              </div>
            </section>

            <div class="grid ${isDesktop ? 'grid-cols-4' : 'grid-cols-2'} gap-3 sm:gap-4">
              ${filtered.map((it, idx) => {
                let svg = '';
                if (it.artType === 'mbti') svg = ChibiArtEngine.getMbtiChibiSVG(it.artKey, 110);
                else if (it.artType === 'animal') svg = ChibiArtEngine.getAnimalChibiSVG(it.artKey, 110);
                else if (it.artType === 'love') svg = ChibiArtEngine.getLoveChibiSVG(it.artKey, 110);
                else svg = ChibiArtEngine.getJungianChibiSVG(it.artKey, 110);

                return `
                  <button onclick='App.openAtlasModal(${JSON.stringify(it).replace(/'/g, "&apos;")})' class="storybook-card rounded-3xl p-3.5 text-left flex flex-col justify-between gap-2 hover:-translate-y-1 transition group">
                    <div class="flex items-center justify-between gap-1">
                      <span class="px-2 py-0.5 rounded-full bg-amber-100 text-[10px] font-black text-[#3B2E2A]">${it.code}</span>
                      <span class="text-[10px] font-bold text-[#6E5A52] truncate">${tiersObj[it.tier]}</span>
                    </div>
                    <div class="w-full h-24 rounded-2xl bg-[#FAF5EB] flex items-center justify-center p-1 group-hover:scale-105 transition-transform">
                      ${svg}
                    </div>
                    <div>
                      <div class="font-display font-black text-xs sm:text-sm text-[#3B2E2A] line-clamp-1">${it.name}</div>
                      <div class="text-[11px] text-[#6E5A52] line-clamp-2 mt-0.5">${it.motto}</div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      openAtlasModal(it) {
        const tiersObj = this.t('tiers');
        const rich = getLocalizedRichTraits(this.state.lang, it.system, it.code);
        let svg = '';
        if (it.artType === 'mbti') svg = ChibiArtEngine.getMbtiChibiSVG(it.artKey, 165);
        else if (it.artType === 'animal') svg = ChibiArtEngine.getAnimalChibiSVG(it.artKey, 165);
        else if (it.artType === 'love') svg = ChibiArtEngine.getLoveChibiSVG(it.artKey, 165);
        else svg = ChibiArtEngine.getJungianChibiSVG(it.artKey, 165);

        const sheet = document.getElementById('modal-sheet');
        sheet.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <span class="px-3 py-1 rounded-full bg-amber-200 border border-[#3B2E2A]/20 text-xs font-black text-[#3B2E2A]">${it.code} · ${tiersObj[it.tier]}</span>
              <button onclick="App.closeModal()" class="w-8 h-8 rounded-full bg-[#F3ECE0] flex items-center justify-center text-sm font-black text-[#3B2E2A]">✕</button>
            </div>
            <div class="flex flex-col sm:flex-row items-center gap-4">
              <div class="w-40 h-40 rounded-3xl bg-[#FAF5EB] border-2 border-[#3B2E2A] flex items-center justify-center p-2 shrink-0">
                ${svg}
              </div>
              <div class="space-y-1.5 text-center sm:text-left">
                <h2 class="font-display font-black text-xl sm:text-2xl text-[#3B2E2A]">${it.name}</h2>
                <p class="text-xs italic text-[#6E5A52] font-semibold">“${it.motto}”</p>
                <p class="text-xs text-[#3B2E2A]/90 leading-relaxed pt-1">${it.desc}</p>
              </div>
            </div>
            <div class="p-3.5 rounded-2xl bg-[#FAF5EB] border border-[#3B2E2A]/12 space-y-1.5 text-xs">
              <div class="font-black text-[#3B2E2A]">${this.t('strengths')}</div>
              ${rich.strengths.map(s => `<div class="text-[#6E5A52]">• ${s}</div>`).join('')}
            </div>
            <button onclick="App.closeModal()" class="storybook-outline w-full py-2.5 rounded-2xl bg-amber-200 text-[#3B2E2A] text-xs font-black">
              ${this.t('modalClose')}
            </button>
          </div>
        `;
        const bd = document.getElementById('modal-backdrop');
        bd.classList.remove('hidden');
        bd.classList.add('flex');
      },

      closeModal() {
        const bd = document.getElementById('modal-backdrop');
        bd.classList.add('hidden');
        bd.classList.remove('flex');
      },

      /**
       * ========================================================================
       * PROFILE, UNIFIED PERSONA PASSPORT & CROSS-SYSTEM SYNTHESIS
       * ========================================================================
       */
      saveNickname(val) {
        this.state.nickname = val;
        try { localStorage.setItem('64personality_nick', val); } catch (e) {}
      },

      clearHistory() {
        this.state.history = [];
        try { localStorage.removeItem('64personality_history'); } catch (e) {}
        this.renderAll();
        this.toast(this.t('clearedToast'));
      },

      openSavedReport(index) {
        const item = this.state.history[index];
        if (!item) return;
        this.state.result = item;
        if (item.testId === 'mbti64') this.state.previewSubtype = item.subtype;
        if (item.testId === 'duality') {
          this.state.simDay = item.dayCode;
          this.state.simNight = item.nightCode;
        }
        this.navigate('result');
      },

      renderProfile() {
        const latestByTest = {};
        this.state.history.forEach(h => {
          if (!latestByTest[h.testId]) latestByTest[h.testId] = h;
        });
        const badgeIds = ['mbti64', 'animal', 'love', 'jungian', 'duality'];
        const collectedCount = badgeIds.filter(id => latestByTest[id]).length;

        // Cross-System Synthesis if >= 2 completed
        let synthesisHtml = '';
        if (collectedCount >= 2) {
          const parts = [];
          if (latestByTest.mbti64) parts.push(`${latestByTest.mbti64.code} (${this.loc(MBTI_BASE_DATA[latestByTest.mbti64.baseCode].name)})`);
          if (latestByTest.animal) parts.push(`${this.loc(ANIMAL_DATA[latestByTest.animal.code].name)}`);
          if (latestByTest.love) parts.push(`${latestByTest.love.code} (${this.loc(LOVE_TYPES_DATA[latestByTest.love.code].name)})`);
          if (latestByTest.jungian) parts.push(`${this.loc(JUNGIAN_DATA[latestByTest.jungian.code].name)}`);
          if (latestByTest.duality) parts.push(`☀️${latestByTest.duality.dayCode} / 🌙${latestByTest.duality.nightCode}`);

          const synTemplates = {
            'zh-CN': `你的多维灵魂由【${parts.join(' × ')}】交织而成：既有清晰的认知原型定位，又在情感依恋与潜意识本能中展现出立体而迷人的生命张力。`,
            'zh-TW': `你的多維靈魂由【${parts.join(' × ')}】交織而成：既有清晰的認知原型定位，又在情感依戀與潛意識本能中展現出立體而迷人的生命張力。`,
            'en': `Your multi-dimensional soul weaves together [${parts.join(' × ')}], uniting cognitive clarity, instinctual wisdom, and authentic emotional resonance into a singular signature.`,
            'ja': `あなたの多次元な魂は【${parts.join(' × ')}】の融合によって形作られており、認知スタイルと本能的直感が美しく調和しています。`,
            'ko': `당신의 다차원 영혼은 [${parts.join(' × ')}]의 조화로 이루어져 있으며, 인지적 명료함과 본능적 감성이 입체적으로 어우러집니다.`,
            'es': `Tu alma multidimensional entrelaza [${parts.join(' × ')}], uniendo claridad cognitiva, sabiduría instintiva y resonancia emocional.`,
            'ms': `Jiwa pelbagai dimensi anda menggabungkan [${parts.join(' × ')}], menyatukan kejelasan kognitif dan naluri emosi yang harmoni.`
          };
          synthesisHtml = `
            <div class="p-4 rounded-2xl bg-gradient-to-r from-amber-100/80 via-rose-100/60 to-indigo-100/70 border border-[#3B2E2A]/15 text-xs sm:text-sm text-[#3B2E2A] leading-relaxed font-semibold">
              ${synTemplates[this.state.lang] || synTemplates['en']}
            </div>
          `;
        } else {
          synthesisHtml = `
            <div class="p-4 rounded-2xl bg-[#FAF5EB] border border-dashed border-[#3B2E2A]/25 text-xs text-[#6E5A52]">
              ${this.t('synthesisNeedMore')}
            </div>
          `;
        }

        return `
          <div class="space-y-5 animate-pop">
            <section class="storybook-card rounded-3xl p-5 sm:p-7 space-y-5">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h1 class="font-display font-black text-2xl sm:text-3xl text-[#3B2E2A]">${this.t('profileTitle')}</h1>
                  <p class="text-xs sm:text-sm text-[#6E5A52] mt-1">${this.t('profileSub')}</p>
                </div>
                <div class="px-3.5 py-1.5 rounded-full bg-amber-200 border border-[#3B2E2A]/20 text-xs font-black text-[#3B2E2A] self-start">
                  ${this.t('passportProgress')}: ${collectedCount} / 5
                </div>
              </div>

              <!-- Custom Poster Nickname -->
              <div class="max-w-md">
                <label class="block text-[11px] font-extrabold text-[#6E5A52] mb-1">${this.t('nicknameLabel')}</label>
                <input type="text" value="${this.state.nickname.replace(/"/g, '&quot;')}" oninput="App.saveNickname(this.value)" placeholder="${this.t('nicknamePlaceholder')}"
                  class="w-full px-3.5 py-2 rounded-2xl bg-white border-2 border-[#3B2E2A]/15 text-xs font-extrabold text-[#3B2E2A] focus:outline-none focus:border-[#3B2E2A]" />
              </div>

              <!-- 5 System Badges -->
              <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                ${badgeIds.map(id => {
                  const rec = latestByTest[id];
                  const meta = TESTS_META[id];
                  return `
                    <div class="p-3 rounded-2xl border-2 ${rec ? 'bg-white border-[#3B2E2A] shadow-[2px_2px_0_#3B2E2A]' : 'bg-[#FAF5EB]/60 border-dashed border-[#3B2E2A]/20 opacity-65'} text-center space-y-1">
                      <div class="text-[10px] font-black text-[#6E5A52]">${meta.badge}</div>
                      <div class="font-display font-black text-sm text-[#3B2E2A] truncate">${rec ? rec.code.toUpperCase() : '—'}</div>
                      <div class="text-[10px] font-bold text-emerald-700">${rec ? '✓ UNLOCKED' : 'LOCKED'}</div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Cross-System Synthesis -->
              <div class="space-y-2">
                <h2 class="font-display font-black text-base text-[#3B2E2A]">${this.t('synthesisTitle')}</h2>
                ${synthesisHtml}
              </div>
            </section>

            <!-- History Archive -->
            <section class="storybook-card rounded-3xl p-5 sm:p-7 space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="font-display font-black text-lg text-[#3B2E2A]">${this.t('historyTitle')} (${this.state.history.length})</h2>
                ${this.state.history.length > 0 ? `
                  <button onclick="App.clearHistory()" class="text-xs font-extrabold text-rose-700 hover:underline">${this.t('clearHistory')}</button>
                ` : ''}
              </div>
              ${this.state.history.length === 0 ? `
                <p class="text-xs text-[#6E5A52] py-4 text-center">${this.t('noHistory')}</p>
              ` : `
                <div class="space-y-2.5">
                  ${this.state.history.map((h, idx) => {
                    const meta = TESTS_META[h.testId];
                    const dateStr = new Date(h.timestamp).toLocaleDateString();
                    return `
                      <div class="p-3.5 rounded-2xl bg-[#FAF5EB] border border-[#3B2E2A]/12 flex items-center justify-between gap-3">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded-full ${meta.accent} text-[10px] font-black text-[#3B2E2A]">${meta.badge}</span>
                            <span class="font-display font-black text-sm text-[#3B2E2A]">${h.code.toUpperCase()}</span>
                          </div>
                          <div class="text-[11px] text-[#6E5A52] mt-0.5">${this.loc(meta.title)} · ${dateStr}</div>
                        </div>
                        <button onclick="App.openSavedReport(${idx})" class="px-3.5 py-1.5 rounded-xl bg-white border border-[#3B2E2A]/20 text-xs font-extrabold text-[#3B2E2A] hover:bg-amber-100 transition shrink-0">
                          ${this.t('viewReport')} →
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </section>
          </div>
        `;
      },

      /**
       * ========================================================================
       * LOCALIZED COPY REPORT & HTML5 CANVAS PNG POSTER GENERATOR
       * ========================================================================
       */
      getLocalizedReportSummary() {
        const res = this.state.result;
        if (!res) return { title: '64personality', sub: '', motto: '', lines: [] };
        const nick = this.state.nickname.trim();
        const prefix = nick ? `@${nick} · ` : '';
        const rich = getLocalizedRichTraits(this.state.lang, res.testId, res.code);

        if (res.testId === 'mbti64') {
          const st = this.state.previewSubtype || res.subtype;
          const baseObj = MBTI_BASE_DATA[res.baseCode];
          const subObj = SUBTYPE_META[st];
          return {
            title: `${res.baseCode}-${st} · ${this.loc(baseObj.name)}`,
            sub: `${prefix}${this.loc(subObj.tag)}`,
            motto: this.loc(baseObj.motto),
            lines: rich.strengths
          };
        }
        if (res.testId === 'animal') {
          const ani = ANIMAL_DATA[res.code];
          return {
            title: `${this.loc(ani.name)} · ${this.loc(ani.role)}`,
            sub: `${prefix}${this.loc(TESTS_META.animal.title)}`,
            motto: this.loc(ani.motto),
            lines: rich.strengths
          };
        }
        if (res.testId === 'love') {
          const lv = LOVE_TYPES_DATA[res.code];
          return {
            title: `${res.code} · ${this.loc(lv.name)}`,
            sub: `${prefix}🎁 ${this.loc(lv.keepsake)}`,
            motto: `${this.t('soulmateLabel')}: ${lv.match} (${this.loc(LOVE_TYPES_DATA[lv.match].name)})`,
            lines: rich.strengths
          };
        }
        if (res.testId === 'jungian') {
          const dom = JUNGIAN_DATA[res.code];
          return {
            title: `${this.loc(dom.name)} (${res.scores[res.code]}%)`,
            sub: `${prefix}${this.loc(TESTS_META.jungian.title)}`,
            motto: this.loc(dom.motto),
            lines: rich.strengths
          };
        }
        const dObj = MBTI_BASE_DATA[res.dayCode];
        const nObj = MBTI_BASE_DATA[res.nightCode];
        return {
          title: `☀️ ${res.dayCode} × 🌙 ${res.nightCode}`,
          sub: `${prefix}${this.t('contrastIndex')}: ${res.contrast}%`,
          motto: `${this.loc(dObj.name)} / ${this.loc(nObj.name)}`,
          lines: rich.strengths
        };
      },

      copyReportText() {
        const info = this.getLocalizedReportSummary();
        const text = [
          `✨ 64personality · ${this.t('brandSub')}`,
          `━━━━━━━━━━━━━━━━━━━━`,
          `🏷️ ${info.title}`,
          `📌 ${info.sub}`,
          `💬 “${info.motto}”`,
          ``,
          `${this.t('strengths')}:`,
          ...info.lines.map(l => `• ${l}`),
          `━━━━━━━━━━━━━━━━━━━━`
        ].join('\n');

        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          this.toast(this.t('copiedToast'));
        } catch (e) {}
        document.body.removeChild(ta);
      },

      downloadPngPoster() {
        const res = this.state.result;
        if (!res) return;
        const info = this.getLocalizedReportSummary();
        const canvas = document.getElementById('poster-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        // Warm Cream Parchment Background
        ctx.fillStyle = '#FAF5EB';
        ctx.fillRect(0, 0, W, H);

        // Soft Watercolor Blobs
        const g1 = ctx.createRadialGradient(180, 220, 20, 180, 220, 320);
        g1.addColorStop(0, 'rgba(244, 162, 158, 0.25)');
        g1.addColorStop(1, 'rgba(244, 162, 158, 0)');
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, W, H);

        const g2 = ctx.createRadialGradient(720, 960, 20, 720, 960, 360);
        g2.addColorStop(0, 'rgba(168, 218, 220, 0.28)');
        g2.addColorStop(1, 'rgba(168, 218, 220, 0)');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, W, H);

        // Storybook Double Border
        ctx.strokeStyle = '#3B2E2A';
        ctx.lineWidth = 5;
        ctx.strokeRect(36, 36, W - 72, H - 72);
        ctx.lineWidth = 2;
        ctx.strokeRect(50, 50, W - 100, H - 100);

        // Header Stamp
        ctx.fillStyle = '#3B2E2A';
        ctx.font = '800 28px "Plus Jakarta Sans", "Noto Sans SC", sans-serif';
        ctx.fillText(`64personality · ${this.t('brandSub')}`, 86, 118);

        // Main Title
        ctx.font = '900 50px "Nunito", "Noto Sans SC", sans-serif';
        ctx.fillStyle = '#3B2E2A';
        ctx.fillText(info.title, 86, 205, W - 172);

        // Subtitle Pill
        ctx.font = '700 26px "Plus Jakarta Sans", "Noto Sans SC", sans-serif';
        ctx.fillStyle = '#6E5A52';
        ctx.fillText(info.sub, 86, 255, W - 172);

        // Render Chibi SVG onto Canvas Image
        let svgMarkup = '';
        if (res.testId === 'mbti64') {
          const st = this.state.previewSubtype || res.subtype;
          svgMarkup = ChibiArtEngine.getMbtiChibiSVG(`${res.baseCode}-${SUBTYPE_META[st].artCode}`, 340);
        } else if (res.testId === 'animal') {
          svgMarkup = ChibiArtEngine.getAnimalChibiSVG(ANIMAL_DATA[res.code].artKey, 340);
        } else if (res.testId === 'love') {
          svgMarkup = ChibiArtEngine.getLoveChibiSVG(res.code, 340);
        } else if (res.testId === 'jungian') {
          svgMarkup = ChibiArtEngine.getJungianChibiSVG(res.code, 340);
        } else {
          svgMarkup = ChibiArtEngine.getDualityChibiSVG(res.dayCode, res.nightCode, 340);
        }

        const svgBlob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const img = new Image();
        img.onload = () => {
          // Draw Chibi Frame
          ctx.fillStyle = '#FFFDF9';
          ctx.fillRect(260, 295, 380, 360);
          ctx.strokeStyle = '#3B2E2A';
          ctx.lineWidth = 4;
          ctx.strokeRect(260, 295, 380, 360);
          ctx.drawImage(img, 280, 305, 340, 340);
          URL.revokeObjectURL(url);

          // Motto Box
          ctx.fillStyle = '#F3ECE0';
          ctx.fillRect(86, 695, W - 172, 110);
          ctx.fillStyle = '#3B2E2A';
          ctx.font = '700 25px "Plus Jakarta Sans", "Noto Sans SC", sans-serif';
          ctx.fillText(`“${info.motto}”`, 112, 760, W - 224);

          // Strengths Section
          ctx.font = '900 28px "Plus Jakarta Sans", "Noto Sans SC", sans-serif';
          ctx.fillStyle = '#3B2E2A';
          ctx.fillText(this.t('strengths'), 86, 865);

          ctx.font = '600 23px "Plus Jakarta Sans", "Noto Sans SC", sans-serif';
          ctx.fillStyle = '#6E5A52';
          info.lines.forEach((line, idx) => {
            ctx.fillText(`• ${line}`, 96, 920 + idx * 48, W - 192);
          });

          // Footer Stamp
          ctx.fillStyle = '#9C877E';
          ctx.font = '700 20px "Plus Jakarta Sans", sans-serif';
          ctx.fillText(`64personality · ${this.t('resultBadge')} · ${new Date().toLocaleDateString()}`, 86, H - 78);

          // Trigger Download
          const a = document.createElement('a');
          a.download = `64personality-${res.code}-${this.state.lang}.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
          this.toast(this.t('posterToast'));
        };
        img.src = url;
      }
    };

    window.onload = () => {
      App.init();
    };
  </script>
</body>
</html>
