<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>64personality · 全维人格测评实验室</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Rounded Storybook Display + Clean Chinese Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: '#FAF5EB',
            cream: '#FFFDF9',
            ink: '#3B2E2A',
            inkSoft: '#6E5A52',
            sand: '#E6DCC8',
            tierHot: '#D9534F',
            tierSocial: '#D97736',
            tierResonate: '#D4A024',
            tierClassic: '#589E47',
            tierHiddenGem: '#35968E',
            tierNiche: '#3B86C4',
            tierSecret: '#8459A8',
          },
          fontFamily: {
            display: ['Fredoka', 'Noto Sans TC', 'sans-serif'],
            sans: ['Noto Sans TC', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            storybook: '0 6px 0 #E3D6C1, 0 12px 24px rgba(59, 46, 42, 0.08)',
            storybookSm: '0 4px 0 #E3D6C1, 0 6px 14px rgba(59, 46, 42, 0.06)',
            inkBtn: '0 4px 0 #3B2E2A',
          }
        }
      }
    };
  </script>

  <style>
    /* ==========================================================================
       Storybook Chibi Parchment Base Styling
       ========================================================================== */
    :root {
      --bg-parchment: #FAF5EB;
      --ink-brown: #3B2E2A;
      --ink-soft: #6E5A52;
      --border-sand: #E6DCC8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-parchment);
      background-image:
        radial-gradient(rgba(186, 165, 134, 0.16) 1px, transparent 1px),
        radial-gradient(rgba(217, 119, 54, 0.06) 1.5px, transparent 1.5px);
      background-size: 24px 24px, 48px 48px;
      background-position: 0 0, 12px 12px;
      color: var(--ink-brown);
      font-family: 'Noto Sans TC', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* Storybook Hand-Drawn Border Card */
    .sb-card {
      background: #FFFDF9;
      border: 2.5px solid #3B2E2A;
      border-radius: 24px;
      box-shadow: 0 5px 0 #3B2E2A;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .sb-card-soft {
      background: #FFFDF9;
      border: 2px solid #E2D5BE;
      border-radius: 22px;
      box-shadow: 0 4px 0 #E6DCC8, 0 10px 20px rgba(59, 46, 42, 0.05);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .sb-card-hover:hover {
      transform: translateY(-3px);
    }

    /* Tactile Ink-Outlined Button */
    .sb-btn {
      border: 2.5px solid #3B2E2A;
      border-radius: 999px;
      box-shadow: 0 4px 0 #3B2E2A;
      font-weight: 700;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .sb-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #3B2E2A;
    }

    /* Subtle Floating Animation for Chibi Art */
    @keyframes chibiBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes doodleTwinkle {
      0%, 100% { opacity: 0.85; transform: scale(1) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.12) rotate(6deg); }
    }

    .chibi-float {
      animation: chibiBob 3.6s ease-in-out infinite;
    }

    .chibi-svg .floating-doodles {
      transform-origin: center;
      animation: doodleTwinkle 3.2s ease-in-out infinite;
    }

    /* 7-Point Likert Scale Circles */
    .likert-circle {
      border: 2.5px solid #3B2E2A;
      border-radius: 9999px;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFDF9;
    }

    .likert-circle:hover {
      transform: scale(1.12);
    }

    .likert-circle.selected {
      box-shadow: 0 3px 0 #3B2E2A;
      transform: scale(1.14);
    }

    /* Mobile Preview Simulation Frame when Desktop users toggle Mobile mode */
    body.force-mobile-view #app-shell {
      max-width: 430px;
      margin: 16px auto 96px auto;
      border: 3px solid #3B2E2A;
      border-radius: 36px;
      background: #FAF5EB;
      box-shadow: 0 14px 40px rgba(59, 46, 42, 0.18);
      overflow-x: hidden;
      min-height: calc(100vh - 110px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F3EAD8;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBBBA0;
      border-radius: 999px;
      border: 2px solid #F3EAD8;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-amber-200 selection:text-ink">

  <!-- Toast Notification Banner (No alert() used anywhere) -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] pointer-events-none flex flex-col items-center gap-2 w-full max-w-md px-4"></div>

  <!-- Main App Shell -->
  <div id="app-shell" class="min-h-screen flex flex-col transition-all duration-300">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-40 bg-[#FAF5EB]/90 backdrop-blur-md border-b-2 border-[#E6DCC8]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
        <!-- Brand Logo -->
        <button onclick="App.navigate('hub')" class="flex items-center gap-2.5 text-left group focus:outline-none">
          <div class="w-10 h-10 rounded-2xl bg-[#F4C2C2] border-2 border-[#3B2E2A] shadow-[0_2px_0_#3B2E2A] flex items-center justify-center overflow-hidden group-hover:rotate-3 transition-transform">
            <svg viewBox="0 0 40 40" class="w-8 h-8">
              <circle cx="20" cy="21" r="12" fill="#FDE6D2" stroke="#3B2E2A" stroke-width="2.2"/>
              <path d="M9 19 C9 10, 31 10, 31 19 C28 14, 12 14, 9 19 Z" fill="#8E6C88" stroke="#3B2E2A" stroke-width="2"/>
              <circle cx="16" cy="21" r="1.5" fill="#3B2E2A"/>
              <circle cx="24" cy="21" r="1.5" fill="#3B2E2A"/>
              <ellipse cx="13.5" cy="23.5" rx="2" ry="1.2" fill="#F29B9B"/>
              <ellipse cx="26.5" cy="23.5" rx="2" ry="1.2" fill="#F29B9B"/>
              <path d="M18 24.5 Q20 26.8 22 24.5" fill="none" stroke="#3B2E2A" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M31 8 L32.2 10.5 L35 11.5 L32.2 12.5 L31 15 L29.8 12.5 L27 11.5 L29.8 10.5 Z" fill="#F2CA6B" stroke="#3B2E2A" stroke-width="1.2"/>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-display font-bold text-lg sm:text-xl tracking-tight text-[#3B2E2A]">64personality</span>
              <span class="hidden sm:inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#F2CA6B] border border-[#3B2E2A] text-[#3B2E2A]">绘本实验室</span>
            </div>
            <p class="text-[11px] text-[#6E5A52] leading-none hidden sm:block">全维人格测评与手绘Q版图鉴</p>
          </div>
        </button>

        <!-- Desktop Navigation Links (Hidden in Mobile Mode) -->
        <nav id="desktop-nav" class="hidden md:flex items-center gap-1.5 bg-[#F2E9D8] p-1.5 rounded-full border-2 border-[#3B2E2A]">
          <button data-nav="hub" onclick="App.navigate('hub')" class="nav-pill px-4 py-1.5 rounded-full text-sm font-bold transition-all">
            🏡 测评大厅
          </button>
          <button data-nav="atlas" onclick="App.navigate('atlas')" class="nav-pill px-4 py-1.5 rounded-full text-sm font-bold transition-all">
            📖 全人格图鉴
          </button>
          <button data-nav="profile" onclick="App.navigate('profile')" class="nav-pill px-4 py-1.5 rounded-full text-sm font-bold transition-all flex items-center gap-1.5">
            🪪 全维护照
            <span id="passport-badge-desktop" class="px-1.5 py-0.2 text-xs rounded-full bg-[#D9534F] text-white font-bold">0/5</span>
          </button>
        </nav>

        <!-- Dual-Mode Responsive Switcher: Auto / Desktop / Mobile -->
        <div class="flex items-center gap-1 bg-[#FFFDF9] border-2 border-[#3B2E2A] rounded-full p-1 shadow-[0_2px_0_#3B2E2A]" title="切换电脑端/手机端排版预览">
          <button onclick="App.setViewportMode('auto')" id="mode-btn-auto" class="px-2.5 py-1 rounded-full text-xs font-bold transition-colors">自动</button>
          <button onclick="App.setViewportMode('desktop')" id="mode-btn-desktop" class="px-2 py-1 rounded-full text-xs font-bold transition-colors" title="电脑宽屏工作台">🖥️</button>
          <button onclick="App.setViewportMode('mobile')" id="mode-btn-mobile" class="px-2 py-1 rounded-full text-xs font-bold transition-colors" title="手机端交互布局">📱</button>
        </div>
      </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 pb-28 md:pb-12">
      <!-- Views rendered dynamically by App -->
    </main>

    <!-- Footer (Desktop) -->
    <footer id="desktop-footer" class="border-t-2 border-[#E6DCC8] bg-[#F5EDE0] py-6 px-4 text-center text-xs text-[#6E5A52]">
      <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <p class="font-bold text-[#3B2E2A]">64personality · 全维人格测评实验室 (Storybook Chibi Edition)</p>
        <p>五大测评系统 · 全手绘暖棕描边Q版绘本插画引擎 · 本地隐私存储</p>
      </div>
    </footer>
  </div>

  <!-- Mobile Bottom Fixed Frosted-Glass Tab Bar -->
  <nav id="mobile-bottom-nav" class="fixed bottom-0 left-0 right-0 z-50 bg-[#FFFDF9]/92 backdrop-blur-lg border-t-2 border-[#3B2E2A] px-3 py-2 flex items-center justify-around shadow-[0_-4px_20px_rgba(59,46,42,0.08)] md:hidden">
    <button data-nav="hub" onclick="App.navigate('hub')" class="mob-nav-btn flex flex-col items-center justify-center py-1 px-4 rounded-2xl transition-all">
      <span class="text-xl leading-none">🏡</span>
      <span class="text-[11px] font-bold mt-1">测评大厅</span>
    </button>
    <button data-nav="atlas" onclick="App.navigate('atlas')" class="mob-nav-btn flex flex-col items-center justify-center py-1 px-4 rounded-2xl transition-all">
      <span class="text-xl leading-none">📖</span>
      <span class="text-[11px] font-bold mt-1">人格图鉴</span>
    </button>
    <button data-nav="profile" onclick="App.navigate('profile')" class="mob-nav-btn relative flex flex-col items-center justify-center py-1 px-4 rounded-2xl transition-all">
      <span class="text-xl leading-none">🪪</span>
      <span class="text-[11px] font-bold mt-1">全维护照</span>
      <span id="passport-badge-mobile" class="absolute top-0.5 right-2 px-1.5 text-[10px] rounded-full bg-[#D9534F] text-white font-bold border border-[#3B2E2A]">0/5</span>
    </button>
  </nav>

  <!-- Modal / Bottom-Sheet Drawer Container -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-[#3B2E2A]/50 backdrop-blur-xs hidden items-center justify-center p-0 sm:p-4 transition-opacity" onclick="if(event.target===this) App.closeModal()">
    <div id="modal-panel" class="bg-[#FAF5EB] border-t-3 sm:border-3 border-[#3B2E2A] w-full sm:max-w-2xl rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto p-5 sm:p-7 relative">
      <!-- Modal content injected here -->
    </div>
  </div>

  <!-- Hidden Offscreen Canvas for High-DPI PNG Poster Generation -->
  <canvas id="poster-canvas" width="900" height="1280" class="hidden"></canvas>

  <script>
    /**
     * ============================================================================
     * 1. STORYBOOK CHIBI INK-OUTLINE ILLUSTRATION ENGINE (ChibiArtEngine)
     * Warm coffee-brown ink (#3B2E2A), soft watercolor pastel fills, cream parchment
     * backdrop (#FAF5EB), expressive chibi proportions, custom career/archetype
     * props, and floating hand-drawn doodles (?, !, ♥, ✦, ♪, ☘, ☾).
     * ============================================================================
     */
    const ChibiArtEngine = (() => {
      const INK = '#3B2E2A';
      const SKIN = '#FDE6D2';
      const BLUSH = '#F39C9C';

      // Helper: Floating hand-drawn storybook symbols around character
      function renderFloatingDoodles(symbols = ['sparkle', 'heart']) {
        const positions = [
          { x: 24, y: 34, rot: -12 },
          { x: 136, y: 32, rot: 14 },
          { x: 20, y: 92, rot: -8 },
          { x: 140, y: 96, rot: 10 }
        ];
        return `<g class="floating-doodles">` + symbols.slice(0, 4).map((sym, idx) => {
          const p = positions[idx % positions.length];
          switch (sym) {
            case 'question':
              return `<g transform="translate(${p.x},${p.y}) rotate(${p.rot})">
                <path d="M-4,-6 C-4,-11 4,-11 4,-6 C4,-2 0,-1 0,2" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>
                <circle cx="0" cy="6" r="1.4" fill="${INK}"/>
              </g>`;
            case 'exclaim':
              return `<g transform="translate(${p.x},${p.y}) rotate(${p.rot})">
                <line x1="0" y1="-9" x2="0" y2="1" stroke="#D9534F" stroke-width="2.6" stroke-linecap="round"/>
                <circle cx="0" cy="6" r="1.6" fill="#D9534F"/>
              </g>`;
            case 'heart':
              return `<g transform="translate(${p.x},${p.y}) rotate(${p.rot})">
                <path d="M0,5 C-7,-1 -9,-6 -4.5,-8.5 C-1.8,-10 0,-7.5 0,-7.5 C0,-7.5 1.8,-10 4.5,-8.5 C9,-6 7,-1 0,5 Z" fill="#F08A8C" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
              </g>`;
            case 'sparkle':
              return `<g transform="translate(${p.x},${p.y}) rotate(${p.rot})">
                <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#F2CA6B" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>
              </g>`;
            case 'note':
              return `<g transform="translate(${p.x},${p.y}) rotate(${p.rot})">
                <path d="M-2,5 L-2,-6 L6,-8 L6,3" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <ellipse cx="-4.5" cy="5.5" rx="3" ry="2.2" fill="#87B5D6" stroke="${INK}" stroke-width="1.5"/>
                <ellipse cx="3.5" cy="3.5" rx="3" ry="2.2" fill="#87B5D6" stroke="${INK}" stroke-width="1.5"/>
              </g>`;
            case 'clover':
              return `<g transform="translate(${p.x},${p.y}) rotate(${p.rot})">
                <circle cx="-2.5" cy="-2.5" r="2.8" fill="#8CC49E" stroke="${INK}" stroke-width="1.4"/>
                <circle cx="2.5" cy="-2.5" r="2.8" fill="#8CC49E" stroke="${INK}" stroke-width="1.4"/>
                <circle cx="-2.5" cy="2.5" r="2.8" fill="#8CC49E" stroke="${INK}" stroke-width="1.4"/>
                <circle cx="2.5" cy="2.5" r="2.8" fill="#8CC49E" stroke="${INK}" stroke-width="1.4"/>
                <path d="M0,3 Q1,8 -2,10" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>
              </g>`;
            case 'moon':
              return `<g transform="translate(${p.x},${p.y}) rotate(${p.rot})">
                <path d="M3,-7 A7,7 0 1,0 6,5 A5.5,5.5 0 1,1 3,-7 Z" fill="#F5D77F" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>
              </g>`;
            default:
              return '';
          }
        }).join('') + `</g>`;
      }

      // Helper: Chibi Head + Facial Expression based on A/O (decisive/hesitant) & H/C (warm/cool)
      function renderChibiFace({ mood = 'AH', eyeType = 'round', blush = true }) {
        const isWarm = mood.includes('H');
        const isDecisive = mood.includes('A');

        // Eyebrows
        let brows = '';
        if (isDecisive && isWarm) {
          brows = `<path d="M62,56 Q67,53 72,56" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
                   <path d="M88,56 Q93,53 98,56" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;
        } else if (isDecisive && !isWarm) {
          brows = `<path d="M62,55 L72,58" fill="none" stroke="${INK}" stroke-width="2.1" stroke-linecap="round"/>
                   <path d="M98,55 L88,58" fill="none" stroke="${INK}" stroke-width="2.1" stroke-linecap="round"/>`;
        } else if (!isDecisive && isWarm) {
          brows = `<path d="M62,58 Q67,55 72,57" fill="none" stroke="${INK}" stroke-width="1.9" stroke-linecap="round"/>
                   <path d="M88,57 Q93,55 98,58" fill="none" stroke="${INK}" stroke-width="1.9" stroke-linecap="round"/>`;
        } else {
          brows = `<path d="M62,57 L72,57" fill="none" stroke="${INK}" stroke-width="1.9" stroke-linecap="round"/>
                   <path d="M88,57 L98,57" fill="none" stroke="${INK}" stroke-width="1.9" stroke-linecap="round"/>`;
        }

        // Eyes
        let eyes = '';
        if (isWarm && isDecisive) {
          // Happy sparkling eyes
          eyes = `<circle cx="67" cy="65" r="3.4" fill="${INK}"/>
                  <circle cx="68.2" cy="63.8" r="1.2" fill="#FFF"/>
                  <circle cx="93" cy="65" r="3.4" fill="${INK}"/>
                  <circle cx="94.2" cy="63.8" r="1.2" fill="#FFF"/>`;
        } else if (!isWarm && isDecisive) {
          // Sharp confident eyes
          eyes = `<ellipse cx="67" cy="65" rx="3.2" ry="2.7" fill="${INK}"/>
                  <circle cx="68" cy="64.2" r="1" fill="#FFF"/>
                  <ellipse cx="93" cy="65" rx="3.2" ry="2.7" fill="${INK}"/>
                  <circle cx="94" cy="64.2" r="1" fill="#FFF"/>`;
        } else if (isWarm && !isDecisive) {
          // Gentle tilted curious eyes
          eyes = `<circle cx="67" cy="65.5" r="3.2" fill="${INK}"/>
                  <circle cx="66.2" cy="64.5" r="1.1" fill="#FFF"/>
                  <circle cx="93" cy="65.5" r="3.2" fill="${INK}"/>
                  <circle cx="92.2" cy="64.5" r="1.1" fill="#FFF"/>`;
        } else {
          // Analytical calm half-lidded eyes
          eyes = `<path d="M63,65 Q67,62 71,65" fill="none" stroke="${INK}" stroke-width="2.3" stroke-linecap="round"/>
                  <circle cx="67" cy="66.2" r="2.2" fill="${INK}"/>
                  <path d="M89,65 Q93,62 97,65" fill="none" stroke="${INK}" stroke-width="2.3" stroke-linecap="round"/>
                  <circle cx="93" cy="66.2" r="2.2" fill="${INK}"/>`;
        }

        // Mouth
        let mouth = '';
        if (isWarm && isDecisive) {
          mouth = `<path d="M75,74 Q80,80 85,74 Z" fill="#E87A7C" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`;
        } else if (!isWarm && isDecisive) {
          mouth = `<path d="M76,75 Q80,77.5 85,74" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;
        } else if (isWarm && !isDecisive) {
          mouth = `<path d="M76,74.5 Q80,78 84,74.5" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;
        } else {
          mouth = `<path d="M77,75.5 L83,75.5" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>`;
        }

        const blushMarkup = blush ? `
          <ellipse cx="59" cy="71" rx="4.2" ry="2.4" fill="${BLUSH}" opacity="0.72"/>
          <ellipse cx="101" cy="71" rx="4.2" ry="2.4" fill="${BLUSH}" opacity="0.72"/>
        ` : '';

        return `
          <!-- Ears -->
          <circle cx="51" cy="66" r="4.5" fill="${SKIN}" stroke="${INK}" stroke-width="2.2"/>
          <circle cx="109" cy="66" r="4.5" fill="${SKIN}" stroke="${INK}" stroke-width="2.2"/>
          <!-- Chibi Head -->
          <rect x="52" y="38" width="56" height="48" rx="24" fill="${SKIN}" stroke="${INK}" stroke-width="2.4"/>
          ${blushMarkup}
          ${brows}
          ${eyes}
          ${mouth}
        `;
      }

      // Render Hair Styles (16 distinct hair silhouettes)
      function renderHairBack(style, color) {
        switch (style) {
          case 'long_flow':
            return `<path d="M48,54 C42,74 44,102 52,110 L108,110 C116,102 118,74 112,54 Z" fill="${color}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
          case 'wizard_long':
            return `<path d="M46,56 C38,80 42,112 54,116 L106,116 C118,112 122,80 114,56 Z" fill="${color}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
          case 'ponytail':
            return `<path d="M104,44 C122,42 128,64 116,78 C110,72 108,60 104,54 Z" fill="${color}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
          case 'curls':
            return `<circle cx="48" cy="68" r="10" fill="${color}" stroke="${INK}" stroke-width="2.3"/>
                    <circle cx="112" cy="68" r="10" fill="${color}" stroke="${INK}" stroke-width="2.3"/>

        const doodles = renderFloatingDoodles(doodleMap[sub] || doodleMap.AH);

    /**
     * ============================================================================
     * 4. PURE SVG RADAR CHARTS & DUAL-TRACK SPECTRUM VISUALIZATIONS
     * ============================================================================
     */
    const ChartEngine = {
      renderRadarSVG(axes, color = '#D9534F', size = 250) {
        const cx = size / 2;
        const cy = size / 2;
        const r = size * 0.34;
        const n = axes.length;
        const angleStep = (Math.PI * 2) / n;

        // Concentric Web Rings (25%, 50%, 75%, 100%)
        let rings = '';
        [0.25, 0.5, 0.75, 1].forEach(level => {
          const pts = axes.map((_, i) => {
            const a = i * angleStep - Math.PI / 2;
            return `${(cx + r * level * Math.cos(a)).toFixed(1)},${(cy + r * level * Math.sin(a)).toFixed(1)}`;
          }).join(' ');
          rings += `<polygon points="${pts}" fill="none" stroke="#DFD3BE" stroke-width="1.3" stroke-dasharray="${level === 1 ? 'none' : '3 3'}"/>`;
        });

        // Axis Spokes & Labels
        let spokes = '';
        let labels = '';
        axes.forEach((ax, i) => {
          const a = i * angleStep - Math.PI / 2;
          const x2 = cx + r * Math.cos(a);
          const y2 = cy + r * Math.sin(a);
          spokes += `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#DFD3BE" stroke-width="1.3"/>`;

          const lx = cx + (r + 24) * Math.cos(a);
          const ly = cy + (r + 20) * Math.sin(a);
          labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="#3B2E2A" font-size="11" font-weight="700">${ax.label}</text>`;
        });

        // Data Polygon
        const dataPts = axes.map((ax, i) => {
          const val = Math.max(15, Math.min(100, ax.value)) / 100;
          const a = i * angleStep - Math.PI / 2;
          return `${(cx + r * val * Math.cos(a)).toFixed(1)},${(cy + r * val * Math.sin(a)).toFixed(1)}`;
        }).join(' ');

        const dots = axes.map((ax, i) => {
          const val = Math.max(15, Math.min(100, ax.value)) / 100;
          const a = i * angleStep - Math.PI / 2;
          const px = cx + r * val * Math.cos(a);
          const py = cy + r * val * Math.sin(a);
          return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="${color}" stroke="#3B2E2A" stroke-width="1.8"/>`;
        }).join('');

        return `<svg viewBox="0 0 ${size} ${size}" class="w-full max-w-[260px] mx-auto overflow-visible">
          ${rings}
          ${spokes}
          <polygon points="${dataPts}" fill="${color}" fill-opacity="0.26" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
          ${dots}
          ${labels}
        </svg>`;
      },

      renderDualTrackBars(tracks) {
        return `<div class="space-y-3.5">
          ${tracks.map(t => {
            const leftWin = t.leftPct >= 50;
            return `<div>
              <div class="flex justify-between text-xs font-bold mb-1">
                <span class="${leftWin ? 'text-[#3B2E2A]' : 'text-[#8C7A70]'}">${t.leftLabel} ${t.leftPct}%</span>
                <span class="text-[11px] text-[#8C7A70]">${t.dimName}</span>
                <span class="${!leftWin ? 'text-[#3B2E2A]' : 'text-[#8C7A70]'}">${100 - t.leftPct}% ${t.rightLabel}</span>
              </div>
              <div class="h-3.5 w-full bg-[#EFE6D5] rounded-full border-2 border-[#3B2E2A] overflow-hidden flex relative">
                <div style="width:${t.leftPct}%; background:${t.color || '#D97736'}" class="h-full transition-all duration-500"></div>
                <div style="left:calc(${t.leftPct}% - 6px)" class="w-3 h-3 bg-[#FFFDF9] border-2 border-[#3B2E2A] rounded-full absolute top-1/2 -translate-y-1/2 shadow-xs"></div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }
    };

        container.appendChild(el);

        this.state.viewportMode = mode;

      applyViewportMode() {
        const mode = this.state.viewportMode;
        const isMobile = mode === 'mobile' || (mode === 'auto' && window.innerWidth <= 768);

        // Highlight mode buttons
        ['auto', 'desktop', 'mobile'].forEach(m => {
          const btn = document.getElementById(`mode-btn-${m}`);
          if (!btn) return;
          if (m === mode) {
            btn.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-[#3B2E2A] text-[#FAF5EB]';
          } else {
            btn.className = 'px-2.5 py-1 rounded-full text-xs font-bold text-[#6E5A52] hover:bg-[#EFE6D5]';
          }
        });

        const desktopNav = document.getElementById('desktop-nav');
        const mobileNav = document.getElementById('mobile-bottom-nav');
        const desktopFooter = document.getElementById('desktop-footer');

        if (mode === 'mobile') {
          document.body.classList.add('force-mobile-view');
          if (desktopNav) desktopNav.classList.add('!hidden');
          if (mobileNav) mobileNav.classList.remove('md:hidden');
          if (desktopFooter) desktopFooter.classList.add('pb-24');
        } else if (mode === 'desktop') {
          document.body.classList.remove('force-mobile-view');
          if (desktopNav) {
            desktopNav.classList.remove('hidden', '!hidden');
            desktopNav.classList.add('flex');
          }
          if (mobileNav) mobileNav.classList.add('hidden');
          if (desktopFooter) desktopFooter.classList.remove('pb-24');
        } else {
          document.body.classList.remove('force-mobile-view');
          if (desktopNav) {
            desktopNav.classList.remove('!hidden');
            desktopNav.classList.add('hidden', 'md:flex');
          }
          if (mobileNav) {
            mobileNav.classList.remove('hidden');
            mobileNav.classList.add('md:hidden');

      calculateResult(sysId, answers) {
        const timestamp = new Date().toLocaleDateString('zh-CN');

        if (sysId === 'mbti64') {
          const scores = { EI: 0, SN: 0, TF: 0, JP: 0, AO: 0, HC: 0 };
          QUIZ_BANKS.mbti64.questions.forEach((q, idx) => {

            scores[q.dim] += centered * q.dir;

          const toPct = (v) => Math.max(12, Math.min(88, Math.round(50 + (v / 6) * 42)));
          const eiPct = toPct(scores.EI);
          const snPct = toPct(scores.SN);
          const tfPct = toPct(scores.TF);
          const jpPct = toPct(scores.JP);
          const aoPct = toPct(scores.AO);
          const hcPct = toPct(scores.HC);

          const base = `${eiPct >= 50 ? 'E' : 'I'}${snPct >= 50 ? 'S' : 'N'}${tfPct >= 50 ? 'T' : 'F'}${jpPct >= 50 ? 'J' : 'P'}`;

          const profile = ALL_MBTI64.find(p => p.code === code) || ALL_MBTI64[0];

            code,
            base,
            sub,
            title: profile.title,
            subtitle: `${code} · ${profile.subLabel}`,
            tier: profile.tier,
            prop: profile.prop,

            ],
            tracks: [
              { dimName: '心动表达节奏', leftLabel: '主动热烈 A', rightLabel: '慢热含蓄 I', leftPct: ai, color: '#E06C75' },
              { dimName: '爱情价值取向', leftLabel: '浪漫幻想 R', rightLabel: '务实守护 P', leftPct: rp, color: '#D4A024' },

            ]
          };
        }

        if (sysId === 'jung12') {
          const allScores = JUNG_12_ARCHETYPES.map((a, idx) => ({
            ...a,
            score: Math.round(((answers[idx] || 4) / 7) * 100)
          }));
          const sorted = [...allScores].sort((a, b) => b.score - a.score);
          const top = sorted[0];
          const second = sorted[1];

          return {
            sysId,
            archId: top.id,
            title: top.name,
            subtitle: `核心箴言：「${top.motto}」· 次原型：${second.name.split(' ')[0]}`,
            prop: top.prop,
            core: top.desc,
            tags: [top.name.split(' ')[0], `次原型·${second.name.split(' ')[0]}`, top.prop.split('与')[0]],
            timestamp,
            radarAxes: allScores.map(s => ({ label: s.name.split(' ')[0], value: s.score })),
            tracks: sorted.slice(0, 5).map((s, i) => ({
              dimName: `TOP ${i + 1} 能量原型`,

              leftPct: s.score,
              color: ['#8459A8', '#D9534F', '#D97736', '#589E47', '#3B86C4'][i]

          };

        // MBTI Duality
        const dayS = { EI: 0, SN: 0, TF: 0, JP: 0 };
        const nightS = { EI: 0, SN: 0, TF: 0, JP: 0 };
        QUIZ_BANKS.duality.questions.forEach((q, idx) => {
          const val = (answers[idx] - 4) * q.dir;

          else nightS[q.dim] += val;

        const toPct = (v) => Math.max(15, Math.min(85, Math.round(50 + (v / 3) * 35)));
        const dEI = toPct(dayS.EI), dSN = toPct(dayS.SN), dTF = toPct(dayS.TF), dJP = toPct(dayS.JP);

        const dayCode = `${dEI >= 50 ? 'E' : 'I'}${dSN >= 50 ? 'S' : 'N'}${dTF >= 50 ? 'T' : 'F'}${dJP >= 50 ? 'J' : 'P'}`;

        const contrastIndex = Math.round((Math.abs(dEI - nEI) + Math.abs(dSN - nSN) + Math.abs(dTF - nTF) + Math.abs(dJP - nJP)) / 4);

          sysId,
          dayCode,
          nightCode,
          title: `白昼 ${dayCode} ⇄ 深夜 ${nightCode}`,
          subtitle: `昼夜双面反差指数：${contrastIndex}% · ${contrastIndex >= 35 ? '高反差双子灵魂' : '表里如一稳态灵魂'}`,

          tracks: [

            { dimName: '白昼 vs 深夜 · 实感度', leftLabel: `白昼 S (${dSN}%)`, rightLabel: `深夜 S (${nSN}%)`, leftPct: dSN, color: '#589E47' },
            { dimName: '白昼 vs 深夜 · 理智度', leftLabel: `白昼 T (${dTF}%)`, rightLabel: `深夜 T (${nTF}%)`, leftPct: dTF, color: '#3B86C4' },

        if (tab === 'jung12') {

        // Duality Pairs Showcase

          { day: 'ESFJ', night: 'ISTP', label: '阳光东道主 ⇄ 巧手机械师', desc: '白天热情周到照顾所有人情绪，深夜只想戴上耳机独自拆解研究硬核世界。' }
        ];
        return `<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          ${pairs.map(p => `

      },

      demoFillAllPassport() {
        ['mbti64', 'animal', 'love16', 'jung12', 'duality'].forEach(sysId => {
          const bank = QUIZ_BANKS[sysId];
          const answers = {};
          bank.questions.forEach((_, idx) => {
            const choices = [1, 2, 3, 5, 6, 7];
            answers[idx] = choices[Math.floor(Math.random() * choices.length)];
          });
          this.state.passport[sysId] = this.calculateResult(sysId, answers);
        });
        this.savePassport();
        this.toast('已一键生成全套 5 项全维人格护照报告！', '🎉');
        this.render();
      },

      clearPassport() {
        this.state.passport = {};
        this.savePassport();
        this.toast('已清空本地护照记录', '🧹');
        this.render();
      },

      /**
       * ==========================================================================
       * MODALS: CHARACTER ATLAS DETAIL MODAL & HIGH-DPI PNG POSTER GENERATOR
       * ==========================================================================
       */
      openCharacterModal(sysId, id) {
        let illu = '', title = '', badge = '', desc = '', prop = '', extra = '';

        if (sysId === 'mbti64') {
          const m = ALL_MBTI64.find(p => p.code === id);
          illu = ChibiArtEngine.getMbtiChibiSVG(m.code, 'w-44 h-44');
          title = `${m.code} · ${m.title}`;
          badge = `<span style="background:${m.tier.color}" class="text-white text-xs font-bold px-3 py-1 rounded-full border border-[#3B2E2A]">${m.tier.name}</span>`;
          prop = m.prop;
          desc = `${m.core}。${m.subDesc}`;
          extra = `<p class="text-xs font-bold text-[#6E5A52] bg-[#FAF5EB] p-3 rounded-xl border border-[#DFD3BE] mt-3">${m.tier.desc}</p>`;
        } else if (sysId === 'animal') {
          const a = ANIMAL_ARCHETYPES.find(x => x.id === id);
          illu = ChibiArtEngine.getAnimalChibiSVG(a.id, 'w-44 h-44');
          title = a.name;
          badge = `<span class="bg-[#F2CA6B] text-[#3B2E2A] text-xs font-bold px-3 py-1 rounded-full border border-[#3B2E2A]">${a.role}</span>`;
          prop = a.prop;
          desc = a.desc;
          extra = `<p class="text-xs font-bold text-[#589E47] mt-2">💞 最佳灵魂拍档：${a.bestMatch}</p>`;
        } else if (sysId === 'love16') {
          const l = LOVE_TYPES_16.find(x => x.code === id);
          illu = ChibiArtEngine.getLoveChibiSVG(l.code, 'w-44 h-44');
          title = `${l.name} (${l.code})`;
          badge = `<span class="bg-[#E8989A] text-white text-xs font-bold px-3 py-1 rounded-full border border-[#3B2E2A]">16型恋爱人格</span>`;
          prop = l.prop;
          desc = l.desc;
        } else if (sysId === 'jung12') {
          const j = JUNG_12_ARCHETYPES.find(x => x.id === id);
          illu = ChibiArtEngine.getJungianChibiSVG(j.id, 'w-44 h-44');
          title = j.name;
          badge = `<span class="bg-[#8459A8] text-white text-xs font-bold px-3 py-1 rounded-full border border-[#3B2E2A]">「${j.motto}」</span>`;
          prop = j.prop;
          desc = j.desc;
        }

        const panel = document.getElementById('modal-panel');
        panel.innerHTML = `
          <button onclick="App.closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-[#FFFDF9] border-2 border-[#3B2E2A] font-bold text-sm flex items-center justify-center hover:bg-[#F2CA6B]">✕</button>
          <div class="flex flex-col items-center text-center">
            <div class="mb-2">${badge}</div>
            <div class="w-48 h-48 bg-[#FFFDF9] border-3 border-[#3B2E2A] rounded-3xl shadow-[0_5px_0_#3B2E2A] flex items-center justify-center my-2 chibi-float">
              ${illu}
            </div>
            <span class="text-xs font-bold text-[#6E5A52] mt-1">专属绘本道具：${prop}</span>
            <h2 class="font-display font-bold text-2xl text-[#3B2E2A] mt-2">${title}</h2>
            <p class="text-sm text-[#4A3B35] leading-relaxed mt-3 max-w-lg">${desc}</p>
            ${extra}
            <div class="flex gap-3 mt-6">
              <button onclick="App.closeModal(); App.startQuiz('${sysId}')" class="sb-btn bg-[#3B2E2A] text-white px-5 py-2.5 text-xs sm:text-sm">
                测测我是不是这一型 →
              </button>
            </div>
          </div>
        `;
        this.showModal();
      },

      /**
       * High-DPI PNG Share Poster Generator (Renders live SVG Chibi Art onto Canvas)
       */
      openPosterModal(overrideSysId = null) {
        const res = overrideSysId ? this.state.passport[overrideSysId] : this.state.currentResult;
        if (!res) return;

        const panel = document.getElementById('modal-panel');
        panel.innerHTML = `
          <button onclick="App.closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-[#FFFDF9] border-2 border-[#3B2E2A] font-bold text-sm flex items-center justify-center">✕</button>
          <div class="text-center">
            <h2 class="font-display font-bold text-xl text-[#3B2E2A] mb-1">🖼️ 生成专属手绘绘本分享海报</h2>
            <p class="text-xs text-[#6E5A52] mb-4">输入你的专属昵称，将Q版绘本立绘与多维光谱渲染为高清 PNG</p>

            <div class="flex items-center justify-center gap-2 max-w-sm mx-auto mb-4">
              <input id="poster-nickname-input" type="text" value="绘本探索家" maxlength="16" placeholder="输入海报昵称..." class="flex-1 px-4 py-2 rounded-full bg-[#FFFDF9] border-2 border-[#3B2E2A] text-xs sm:text-sm font-bold focus:outline-none"/>
              <button onclick="App.renderPosterPreview('${res.sysId}')" class="sb-btn bg-[#F2CA6B] text-[#3B2E2A] px-4 py-2 text-xs sm:text-sm">
                刷新预览
              </button>
            </div>

            <div id="poster-preview-box" class="bg-[#EFE6D5] p-3 rounded-2xl border-2 border-[#3B2E2A] max-w-xs mx-auto mb-4 flex items-center justify-center min-h-[320px]">
              <span class="text-xs font-bold text-[#6E5A52]">正在绘制高清绘本海报...</span>
            </div>

            <button id="download-poster-btn" class="sb-btn bg-[#D9534F] text-white px-6 py-2.5 text-sm inline-flex items-center gap-2">
              <span>⬇️ 下载高清 PNG 海报</span>
            </button>
          </div>
        `;
        this.showModal();
        setTimeout(() => this.renderPosterPreview(res.sysId), 80);
      },

      async renderPosterPreview(sysId) {
        const res = (sysId && this.state.passport[sysId]) ? this.state.passport[sysId] : this.state.currentResult;
        if (!res) return;

        const nickInput = document.getElementById('poster-nickname-input');
        const nickname = (nickInput && nickInput.value.trim()) ? nickInput.value.trim() : '绘本探索家';

        const canvas = document.getElementById('poster-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;  // 900
        const H = canvas.height; // 1280

        // 1. Cream Parchment Background
        ctx.fillStyle = '#FAF5EB';
        ctx.fillRect(0, 0, W, H);

        // Subtle polka dots
        ctx.fillStyle = 'rgba(186, 165, 134, 0.25)';
        for (let x = 30; x < W; x += 36) {
          for (let y = 30; y < H; y += 36) {
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 2. Outer Hand-Drawn Ink Frame
        ctx.fillStyle = '#FFFDF9';
        this.roundRect(ctx, 44, 44, W - 88, H - 88, 36);
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#3B2E2A';
        ctx.stroke();

        // 3. Top Lab Header Pill
        ctx.fillStyle = '#F2CA6B';
        this.roundRect(ctx, 250, 80, 400, 48, 24);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#3B2E2A';
        ctx.font = 'bold 22px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('64personality · 全维人格绘本实验室', W / 2, 112);

        // Nickname Subtitle
        ctx.fillStyle = '#6E5A52';
        ctx.font = 'bold 24px "Noto Sans TC", sans-serif';
        ctx.fillText(`@${nickname} 的专属人格图鉴`, W / 2, 174);

        // 4. Rasterize Live SVG Chibi Illustration onto Canvas
        const svgMarkup = this.getResultIllustration(res, '');
        const img = await this.svgToImage(svgMarkup);

        // Illustration Card Backdrop
        ctx.fillStyle = '#FAF5EB';
        this.roundRect(ctx, 170, 200, 560, 400, 32);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#3B2E2A';
        ctx.stroke();

        if (img) {
          const aspect = img.width / img.height || 1.15;
          const drawH = 340;
          const drawW = Math.min(500, drawH * aspect);
          ctx.drawImage(img, (W - drawW) / 2, 225, drawW, drawH);
        }

        // Popularity Tier Pill (if MBTI-64)
        const activeCode = (res.sysId === 'mbti64') ? (this.state.selectedSubtypePreview || res.code) : res.code;
        const activeProfile = (res.sysId === 'mbti64') ? ALL_MBTI64.find(p => p.code === activeCode) : null;

        if (activeProfile) {
          ctx.fillStyle = activeProfile.tier.color;
          this.roundRect(ctx, 355, 575, 190, 42, 21);
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#3B2E2A';
          ctx.stroke();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 20px "Noto Sans TC", sans-serif';
          ctx.fillText(activeProfile.tier.name, W / 2, 603);
        }

        // 5. Title & Core Summary
        const displayTitle = activeProfile ? activeProfile.title : res.title;
        const displaySub = activeProfile ? `${activeProfile.code} · ${activeProfile.subLabel}` : res.subtitle;
        const displayCore = activeProfile ? `${activeProfile.core}。${activeProfile.subDesc}` : res.core;

        ctx.fillStyle = '#3B2E2A';
        ctx.font = '900 40px "Noto Sans TC", sans-serif';
        ctx.fillText(displayTitle, W / 2, 675);

        ctx.fillStyle = '#D97736';
        ctx.font = 'bold 24px "Noto Sans TC", sans-serif';
        ctx.fillText(displaySub, W / 2, 718);

        // Wrapped Description Text
        ctx.fillStyle = '#4A3B35';
        ctx.font = '500 22px "Noto Sans TC", sans-serif';
        this.wrapCanvasText(ctx, displayCore, W / 2, 772, 720, 34);

        // 6. Dimension Spectrum Bars on Poster
        const tracks = res.tracks.slice(0, 4);
        let barY = 920;
        tracks.forEach(t => {
          ctx.textAlign = 'left';
          ctx.fillStyle = '#3B2E2A';
          ctx.font = 'bold 20px "Noto Sans TC", sans-serif';
          ctx.fillText(`${t.leftLabel} ${t.leftPct}%`, 110, barY);

          ctx.textAlign = 'right';
          ctx.fillStyle = '#6E5A52';
          ctx.fillText(`${100 - t.leftPct}% ${t.rightLabel}`, W - 110, barY);

          // Bar Track
          ctx.fillStyle = '#EFE6D5';
          this.roundRect(ctx, 110, barY + 10, W - 220, 18, 9);
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#3B2E2A';
          ctx.stroke();

          // Bar Fill
          const fillW = Math.max(24, ((W - 220) * t.leftPct) / 100);
          ctx.fillStyle = t.color || '#D97736';
          this.roundRect(ctx, 110, barY + 10, fillW, 18, 9);
          ctx.fill();

          barY += 62;
        });

        // 7. Footer Stamp
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8C7A70';
        ctx.font = 'bold 18px "Noto Sans TC", sans-serif';
        ctx.fillText(`64personality · 手绘绘本风Q版人格测评实验室 · ${res.timestamp}`, W / 2, 1205);

        const dataUrl = canvas.toDataURL('image/png');
        const previewBox = document.getElementById('poster-preview-box');
        if (previewBox) {
          previewBox.innerHTML = `<img src="${dataUrl}" alt="人格海报预览" class="w-full rounded-xl shadow-md border border-[#3B2E2A]" />`;
        }

        const dlBtn = document.getElementById('download-poster-btn');
        if (dlBtn) {
          dlBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = `64personality_${nickname}_${res.sysId}.png`;
            link.href = dataUrl;
            link.click();
            this.toast('高清绘本海报已开始下载！', '📥');
          };
        }
      },

      svgToImage(svgMarkup) {
        return new Promise((resolve) => {
          try {
            // Ensure explicit width/height attributes for clean browser rasterization
            const enriched = svgMarkup.replace('<svg ', '<svg width="320" height="272" ');
            const blob = new Blob([enriched], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
              URL.revokeObjectURL(url);
              resolve(img);
            };
            img.onerror = () => resolve(null);
            img.src = url;
          } catch (e) {
            resolve(null);
          }
        });
      },

      roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      },

      wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
        const chars = text.split('');
        let line = '';
        let currY = y;
        let lineCount = 0;
        for (let i = 0; i < chars.length; i++) {
          const testLine = line + chars[i];
          if (ctx.measureText(testLine).width > maxWidth && i > 0) {
            ctx.fillText(line, x, currY);
            line = chars[i];
            currY += lineHeight;
            lineCount++;
            if (lineCount >= 3) break;
          } else {
            line = testLine;
          }
        }
        if (lineCount < 3) ctx.fillText(line, x, currY);
      },

      showModal() {
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
      },

      closeModal() {
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      },

      render() {
        this.updateNavHighlight();
        const container = document.getElementById('main-content');
        if (!container) return;

        switch (this.state.view) {
          case 'hub':
            container.innerHTML = this.renderHub();
            break;
          case 'quiz':
            container.innerHTML = this.renderQuiz();
            break;
          case 'result':
            container.innerHTML = this.renderResult();
            break;
          case 'atlas':
            container.innerHTML = this.renderAtlas();
            break;
          case 'profile':
            container.innerHTML = this.renderProfile();
            break;
          default:
            container.innerHTML = this.renderHub();
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
