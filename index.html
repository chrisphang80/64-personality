<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>64personality · 多维人格测评实验室</title>
  <style>
    /* ==========================================================================
       1. 设计令牌与全局基础样式（零外部依赖，自适应全端设备）
       ========================================================================== */
    :root {
      --bg-page: #f5f7fb;
      --bg-card: rgba(255, 255, 255, 0.92);
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border-soft: rgba(226, 232, 240, 0.88);
      --shadow-sm: 0 4px 14px -2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 32px -8px rgba(15, 23, 42, 0.08), 0 4px 12px -4px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 22px 48px -12px rgba(15, 23, 42, 0.14);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-pill: 9999px;

      /* 五大测评专属主题色 */
      --mbti64-primary: #3498DB;
      --mbti64-dark: #1d6fa5;
      --mbti64-soft: #eaf5fc;

      --animal-primary: #B87333;
      --animal-dark: #87501d;
      --animal-soft: #faf1e6;

      --love-primary: #E06377;
      --love-dark: #b83d51;
      --love-soft: #fcebf1;

      --arch-primary: #7B3F9E;
      --arch-dark: #582875;
      --arch-soft: #f3eaf8;

      --dual-primary: #2563EB;
      --dual-dark: #1d4ed8;
      --dual-soft: #ebf2fe;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* 背景柔和氛围光斑 */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.42;
      animation: floatOrb 13s ease-in-out infinite;
    }
    .orb-1 { top: -110px; left: -90px; width: 360px; height: 360px; background: #bae6fd; }
    .orb-2 { top: 32%; right: -100px; width: 370px; height: 370px; background: #fbcfe8; animation-delay: -4.5s; }
    .orb-3 { bottom: -130px; left: 26%; width: 420px; height: 420px; background: #ddd6fe; animation-delay: -9s; }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-22px) scale(1.04); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-enter {
      animation: fadeSlideUp 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ==========================================================================
       2. 顶部粘性导航栏
       ========================================================================== */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-soft);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3498DB 0%, #7B3F9E 52%, #E06377 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 14px rgba(52, 152, 219, 0.28);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: none;
    }

    @media (min-width: 720px) {
      .brand-title { font-size: 17px; }
      .brand-sub { display: block; }
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @media (min-width: 640px) {
      .nav-tabs { gap: 8px; }
    }

    .nav-tab {
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sub);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    @media (min-width: 640px) {
      .nav-tab { padding: 8px 14px; font-size: 13.5px; }
    }

    .nav-tab:hover {
      background: rgba(241, 245, 249, 0.9);
      color: var(--text-main);
    }

    .nav-tab.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    }

    .nav-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #3498DB;
      color: #fff;
    }
    .nav-tab.active .nav-badge {
      background: #fff;
      color: #0f172a;
    }

    /* ==========================================================================
       3. 主容器与门户大厅（5大低多边形粉彩宽幅卡片）
       ========================================================================== */
    .main-wrap {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px 16px 52px;
    }

    @media (min-width: 640px) {
      .main-wrap { padding: 32px 24px 68px; }
    }

    .portal-header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 28px;
    }

    .portal-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: #ffffff;
      border: 1px solid var(--border-soft);
      font-size: 12px;
      font-weight: 800;
      color: #2563EB;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
    }

    .portal-h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    @media (min-width: 640px) {
      .portal-h1 { font-size: 35px; }
    }

    .portal-desc {
      font-size: 14px;
      color: var(--text-sub);
    }

    .banner-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (min-width: 640px) {
      .banner-stack { gap: 24px; }
    }

    .test-banner {
      position: relative;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.95);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
      min-height: 215px;
      display: flex;
      align-items: stretch;
    }

    .test-banner:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .banner-poly-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .banner-content {
      position: relative;
      z-index: 2;
      flex: 1;
      padding: 22px 18px 22px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 64%;
    }

    @media (min-width: 640px) {
      .banner-content {
        padding: 30px 36px;
        max-width: 60%;
      }
    }

    .banner-badge-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .banner-cn-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.85);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .banner-q-tag {
      font-size: 11.5px;
      font-weight: 700;
      color: #475569;
    }

    .banner-title {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    @media (min-width: 640px) {
      .banner-title { font-size: 32px; }
    }

    .banner-sub-en {
      font-size: 12.5px;
      font-weight: 500;
      color: #334155;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .banner-sub-en { font-size: 14.5px; margin-bottom: 20px; }
    }

    .banner-btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .banner-btn-group { gap: 10px; }
    }

    .banner-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    @media (min-width: 640px) {
      .banner-cta {
        padding: 11px 24px;
        font-size: 13.5px;
      }
    }

    .banner-cta:hover {
      transform: scale(1.03);
      filter: brightness(1.06);
    }

    .banner-demo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 9px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.88);
      color: #1e293b;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      transition: all 0.18s ease;
    }

    .banner-demo-btn:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .banner-art {
      position: relative;
      z-index: 1;
      width: 38%;
      min-width: 140px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding-right: 4px;
      pointer-events: none;
    }

    @media (min-width: 640px) {
      .banner-art {
        width: 42%;
        padding-right: 18px;
      }
    }

    .banner-art svg {
      width: 100%;
      max-width: 300px;
      height: auto;
      display: block;
    }

    /* ==========================================================================
       4. 通用卡片、按钮与标签组件
       ========================================================================== */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #ffffff;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      padding: 20px;
    }

    @media (min-width: 640px) {
      .card { padding: 28px; }
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); opacity: 0.95; }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      background: #ffffff;
      border: 1px solid #cbd5e1;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s ease;
    }
    .btn-secondary:hover { background: #f8fafc; border-color: #94a3b8; }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #e2e8f0;
      transition: all 0.18s ease;
    }
    .btn-ghost:hover { color: var(--text-main); background: #ffffff; }

    /* ==========================================================================
       5. 7级李克特量表答题交互样式
       ========================================================================== */
    .progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .likert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      max-width: 540px;
      margin: 0 auto;
      padding: 8px 4px;
    }

    @media (min-width: 640px) {
      .likert-row { gap: 14px; }
    }

    .likert-dot {
      border-radius: 50%;
      border-style: solid;
      border-width: 2.5px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
    }

    .likert-dot:hover { transform: scale(1.13); }
    .likert-dot:active { transform: scale(0.94); }

    .dot-lg { width: 44px; height: 44px; }
    .dot-md { width: 37px; height: 37px; }
    .dot-sm { width: 31px; height: 31px; }
    .dot-xs { width: 26px; height: 26px; }

    @media (min-width: 640px) {
      .dot-lg { width: 54px; height: 54px; }
      .dot-md { width: 45px; height: 45px; }
      .dot-sm { width: 37px; height: 37px; }
      .dot-xs { width: 30px; height: 30px; }
    }

    .likert-labels {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 540px;
      margin: 10px auto 0;
      font-size: 13px;
      font-weight: 800;
    }

    /* ==========================================================================
       6. 报告网格与光谱进度条
       ========================================================================== */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); gap: 20px; }
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 920px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 768px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); gap: 15px; }
    }

    .grid-5 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .grid-5 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 960px) {
      .grid-5 { grid-template-columns: repeat(5, 1fr); }
    }

    .spectrum-bar-bg {
      width: 100%;
      height: 12px;
      background: #eef2f6;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      padding: 2px;
      gap: 2px;
    }

    .spectrum-seg-left {
      height: 100%;
      border-radius: 999px 0 0 999px;
      transition: width 0.6s ease;
    }
    .spectrum-seg-right {
      height: 100%;
      border-radius: 0 999px 999px 0;
      transition: width 0.6s ease;
    }

    /* ==========================================================================
       7. 图鉴筛选器与模态弹窗
       ========================================================================== */
    .atlas-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .atlas-tab {
      padding: 9px 15px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: 800;
      background: #ffffff;
      color: var(--text-sub);
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
    }

    .atlas-tab.active {
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.14);
    }

    .filter-bar {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .filter-input, .filter-select {
      padding: 8px 12px;
      border-radius: 11px;
      border: 1px solid #cbd5e1;
      font-size: 12.5px;
      font-weight: 600;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
    }
    .filter-input:focus, .filter-select:focus {
      border-color: #3498DB;
      background: #ffffff;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 26px;
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.28);
      animation: fadeSlideUp 0.3s ease forwards;
    }

    .modal-head {
      padding: 15px 20px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-foot {
      padding: 13px 20px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #f8fafc;
    }

    /* Toast 提示 */
    .toast-wrap {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .toast-msg {
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
      animation: fadeSlideUp 0.25s ease forwards;
    }

    .site-footer {
      border-top: 1px solid var(--border-soft);
      background: rgba(255, 255, 255, 0.65);
      padding: 20px 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- 背景氛围光斑 -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- 顶部粘性导航栏 -->
  <header class="top-nav">
    <div class="nav-inner">
      <button class="brand-btn" onclick="switchTab('tests')">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"></polygon>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
        <div>
          <div class="brand-title">64personality · 全维人格测评实验室</div>
          <div class="brand-sub">MBTI-64 · Animal Archetype · 16 Love Type · 12 Archetype · MBTI Duality</div>
        </div>
      </button>

      <nav class="nav-tabs">

    const STORAGE_KEY = 'personality_64_unified_lab_v1';

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state.history = raw ? JSON.parse(raw) : [];
      } catch (e) {
        state.history = [];
      }
      updateHistoryBadge();
    }

    function saveHistory(record) {
      try {
        state.history.unshift(record);
        if (state.history.length > 50) state.history = state.history.slice(0, 50);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
        updateHistoryBadge();
      } catch (e) {}
    }

    function updateHistoryBadge() {
      const el = document.getElementById('history-count');
      if (!el) return;
      if (state.history.length > 0) {
        el.textContent = state.history.length;
        el.style.display = 'inline-flex';
      } else {
        el.style.display = 'none';
      }
    }

    function switchTab(tabName) {
      state.tab = tabName;
      state.confirmClearHistory = false;
      if (tabName === 'tests') {
        state.stage = 'portal';
      }
      ['tests', 'atlas', 'profile'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        if (btn) btn.classList.toggle('active', t === tabName);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function render6AxisHexRadarSVG(axes, primaryColor) {
      const cx = 180, cy = 165, maxR = 100;
      const getPt = (i, ratio) => {
        const ang = (-90 + i * 60) * (Math.PI / 180);
        return { x: +(cx + maxR * ratio * Math.cos(ang)).toFixed(1), y: +(cy + maxR * ratio * Math.sin(ang)).toFixed(1) };
      };
      const grids = [0.25, 0.5, 0.75, 1].map(lvl => {
        const pts = axes.map((_, i) => { const p = getPt(i, lvl); return `${p.x},${p.y}`; }).join(' ');
        return `<polygon points="${pts}" fill="${lvl === 1 ? '#f8fafc' : 'none'}" stroke="#cbd5e1" stroke-width="1.2" ${lvl === 0.5 ? 'stroke-dasharray="3 3"' : ''}/>`;
      }).join('');
      const lines = axes.map((_, i) => { const p = getPt(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#cbd5e1" stroke-width="1"/>`; }).join('');
      const dataPts = axes.map((ax, i) => getPt(i, ax.val / 100));
      const polyStr = dataPts.map(p => `${p.x},${p.y}`).join(' ');
      const dots = dataPts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#ffffff" stroke="${primaryColor}" stroke-width="2.5"/>`).join('');
      const labels = axes.map((ax, i) => {
        const p = getPt(i, 1.28);
        let anchor = 'middle';
        if (i === 1 || i === 2) anchor = 'start';
        if (i === 4 || i === 5) anchor = 'end';
        const dy = i === 0 ? -4 : (i === 3 ? 6 : 0);
        return `
          <text x="${p.x}" y="${p.y + dy}" text-anchor="${anchor}" fill="#0f172a" font-size="12" font-weight="800">${ax.label} ${ax.val}%</text>
          <text x="${p.x}" y="${p.y + dy + 14}" text-anchor="${anchor}" fill="#64748b" font-size="10.5" font-weight="600">${ax.sub}</text>
        `;
      }).join('');

      return `
        <svg viewBox="0 0 360 330" style="width:100%;max-width:350px;height:auto;display:block;margin:0 auto;overflow:visible;">
          ${grids}${lines}
          <polygon points="${polyStr}" fill="${primaryColor}" fill-opacity="0.25" stroke="${primaryColor}" stroke-width="2.5" stroke-linejoin="round"/>
          ${dots}${labels}
        </svg>
      `;
    }

    function render4AxisRadarSVG(axes, primaryColor) {
      const cx = 165, cy = 150, maxR = 92;
      const dirs = [
        { dx: 0, dy: -1, anchor: 'middle', dyTxt: -12 },
        { dx: 1, dy: 0, anchor: 'start', dxTxt: 12 },
        { dx: 0, dy: 1, anchor: 'middle', dyTxt: 18 },
        { dx: -1, dy: 0, anchor: 'end', dxTxt: -12 }
      ];
      const grids = [0.25, 0.5, 0.75, 1].map(lvl => {
        const pts = dirs.map(d => `${cx + d.dx * maxR * lvl},${cy + d.dy * maxR * lvl}`).join(' ');
        return `<polygon points="${pts}" fill="${lvl === 1 ? '#f8fafc' : 'none'}" stroke="#cbd5e1" stroke-width="1.2" ${lvl === 0.5 ? 'stroke-dasharray="3 3"' : ''}/>`;
      }).join('');
      const lines = dirs.map(d => `<line x1="${cx}" y1="${cy}" x2="${cx + d.dx * maxR}" y2="${cy + d.dy * maxR}" stroke="#cbd5e1" stroke-width="1"/>`).join('');
      const ptsArr = axes.map((ax, i) => ({ x: cx + dirs[i].dx * (ax.val / 100) * maxR, y: cy + dirs[i].dy * (ax.val / 100) * maxR }));
      const polyPts = ptsArr.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const dots = ptsArr.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="#ffffff" stroke="${primaryColor}" stroke-width="2.5"/>`).join('');
      const texts = axes.map((ax, i) => {
        const d = dirs[i];
        const lx = cx + d.dx * maxR + (d.dxTxt || 0);
        const ly = cy + d.dy * maxR + (d.dyTxt || 0);
        return `
          <text x="${lx}" y="${ly}" text-anchor="${d.anchor}" fill="#0f172a" font-size="12" font-weight="800">${ax.label} ${ax.val}%</text>
          <text x="${lx}" y="${ly + 14}" text-anchor="${d.anchor}" fill="#64748b" font-size="10.5" font-weight="600">${ax.sub}</text>

      return `
        <svg viewBox="0 0 330 305" style="width:100%;max-width:330px;height:auto;display:block;margin:0 auto;overflow:visible;">
          ${grids}${lines}
          <polygon points="${polyPts}" fill="${primaryColor}" fill-opacity="0.24" stroke="${primaryColor}" stroke-width="2.5" stroke-linejoin="round"/>
          ${dots}${texts}
        </svg>
      `;
    }

    function render12SpokeRadarSVG(scoresMap) {
      const cx = 195, cy = 185, maxR = 110;
      const count = JUNG_ARCHETYPES.length;
      const rings = [0.33, 0.66, 1].map(lvl => {
        const pts = JUNG_ARCHETYPES.map((_, i) => {
          const ang = (-90 + i * (360 / count)) * (Math.PI / 180);
          return `${(cx + maxR * lvl * Math.cos(ang)).toFixed(1)},${(cy + maxR * lvl * Math.sin(ang)).toFixed(1)}`;
        }).join(' ');
        return `<polygon points="${pts}" fill="${lvl === 1 ? '#f8fafc' : 'none'}" stroke="#cbd5e1" stroke-width="1"/>`;
      }).join('');
      const spokes = JUNG_ARCHETYPES.map((_, i) => {
        const ang = (-90 + i * (360 / count)) * (Math.PI / 180);
        return `<line x1="${cx}" y1="${cy}" x2="${(cx + maxR * Math.cos(ang)).toFixed(1)}" y2="${(cy + maxR * Math.sin(ang)).toFixed(1)}" stroke="#e2e8f0" stroke-width="1"/>`;
      }).join('');
      const dataPts = JUNG_ARCHETYPES.map((arch, i) => {
        const val = scoresMap[arch.code] || 50;
        const r = (val / 100) * maxR;
        const ang = (-90 + i * (360 / count)) * (Math.PI / 180);
        return { x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang) };
      });
      const polyStr = dataPts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const dots = dataPts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#ffffff" stroke="#7B3F9E" stroke-width="2"/>`).join('');
      const labels = JUNG_ARCHETYPES.map((arch, i) => {
        const ang = (-90 + i * (360 / count)) * (Math.PI / 180);
        const lx = cx + (maxR + 26) * Math.cos(ang);
        const ly = cy + (maxR + 26) * Math.sin(ang);
        const qColor = ARCHETYPE_QUADRANTS[arch.quad].color;
        let anchor = 'middle';
        if (Math.cos(ang) > 0.25) anchor = 'start';
        if (Math.cos(ang) < -0.25) anchor = 'end';
        const val = scoresMap[arch.code] || 50;
        return `
          <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" fill="${qColor}" font-size="11" font-weight="800">${arch.name}</text>
          <text x="${lx.toFixed(1)}" y="${(ly + 12).toFixed(1)}" text-anchor="${anchor}" fill="#64748b" font-size="9.5" font-weight="600">${val}%</text>
        `;
      }).join('');

      return `
        <svg viewBox="0 0 390 370" style="width:100%;max-width:390px;height:auto;display:block;margin:0 auto;overflow:visible;">
          ${rings}${spokes}
          <polygon points="${polyStr}" fill="#7B3F9E" fill-opacity="0.24" stroke="#7B3F9E" stroke-width="2.4" stroke-linejoin="round"/>
          ${dots}${labels}
        </svg>
      `;
    }

    /**
     * ============================================================================
     * 五、五大测评题库构建与核心计分引擎
     * ============================================================================
     */
    function buildMBTI64Questions(mode) {
      const dims = ['EI', 'SN', 'TF', 'JP', 'AO', 'HC'];
      const perDim = mode === 'quick' ? 4 : 8;
      const grouped = {};
      dims.forEach(d => { grouped[d] = MBTI64_QUESTIONS.filter(q => q.dim === d).slice(0, perDim); });
      const list = [];
      for (let i = 0; i < perDim; i++) {
        for (let d of dims) {
          if (grouped[d][i]) list.push(grouped[d][i]);
        }
      }
      return list;
    }

    function startIntro(testId) {
      state.activeTest = testId;
      state.stage = 'intro';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function beginQuiz(testId, customMbtiMode = null) {
      state.activeTest = testId;
      if (testId === 'mbti64') {
        if (customMbtiMode) state.mbtiMode = customMbtiMode;
        state.questions = buildMBTI64Questions(state.mbtiMode);
      } else if (testId === 'animal') {
        state.questions = [...ANIMAL_QUESTIONS];
      } else if (testId === 'love') {
        state.questions = [...LOVE_QUESTIONS];
      } else if (testId === 'archetype') {
        state.questions = [...ARCHETYPE_QUESTIONS];
      } else if (testId === 'duality') {
        state.questions = [...DUALITY_QUESTIONS];
      }

      state.qIndex = 0;
      state.answers = {};
      state.stage = 'quiz';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function handleAnswer(val) {
      const q = state.questions[state.qIndex];
      if (!q) return;
      state.answers[q.id] = val;
      render();

      setTimeout(() => {
        if (state.qIndex < state.questions.length - 1) {
          state.qIndex++;
          render();
        } else {
          computeAndShowResult();
        }
      }, 210);
    }

    function prevStep() {
      if (state.qIndex > 0) {
        state.qIndex--;
        render();
      }
    }

    function runRandomDemo(testId = null, customMbtiMode = null) {
      if (testId) {
        state.activeTest = testId;
        if (testId === 'mbti64') {
          if (customMbtiMode) state.mbtiMode = customMbtiMode;
          state.questions = buildMBTI64Questions(state.mbtiMode);
        } else if (testId === 'animal') state.questions = [...ANIMAL_QUESTIONS];
        else if (testId === 'love') state.questions = [...LOVE_QUESTIONS];
        else if (testId === 'archetype') state.questions = [...ARCHETYPE_QUESTIONS];
        else if (testId === 'duality') state.questions = [...DUALITY_QUESTIONS];
      }

      const t = state.activeTest;
      state.answers = {};

      if (t === 'mbti64') {
        const dims = ['EI', 'SN', 'TF', 'JP', 'AO', 'HC'];
        const bias = {};
        dims.forEach(d => { bias[d] = Math.random() > 0.5 ? 1.5 : -1.5; });
        state.questions.forEach(q => {
          const raw = bias[q.dim] * q.dir + (Math.random() * 2.4 - 1.2);
          state.answers[q.id] = Math.max(-3, Math.min(3, Math.round(raw)));
        });
      } else if (t === 'animal' || t === 'love') {
        const dims = t === 'animal' ? ['DOM', 'SOC', 'AGI', 'WIS'] : ['AI', 'RP', 'FS', 'DM'];
        const bias = {};
        dims.forEach(d => { bias[d] = Math.random() > 0.5 ? 1.6 : -1.6; });
        state.questions.forEach(q => {
          const raw = bias[q.dim] * q.dir + (Math.random() * 2.4 - 1.2);
          state.answers[q.id] = Math.max(-3, Math.min(3, Math.round(raw)));
        });
      } else if (t === 'archetype') {
        const codes = JUNG_ARCHETYPES.map(a => a.code);
        const top1 = codes[Math.floor(Math.random() * codes.length)];
        const top2 = codes[(codes.indexOf(top1) + 4) % codes.length];
        const low1 = codes[(codes.indexOf(top1) + 7) % codes.length];
        state.questions.forEach(q => {
          let base = Math.round(Math.random() * 4 - 2);
          if (q.arch === top1) base = 3;
          else if (q.arch === top2) base = 2;
          else if (q.arch === low1) base = -3;
          state.answers[q.id] = base;
        });
      } else if (t === 'duality') {
        const sBias = { EI: Math.random() > 0.5 ? 1.8 : -1.8, SN: Math.random() > 0.5 ? 1.8 : -1.8, TF: Math.random() > 0.5 ? 1.8 : -1.8, JP: Math.random() > 0.5 ? 1.8 : -1.8 };
        const hBias = { EI: -sBias.EI * 0.85, SN: sBias.SN * 0.7, TF: -sBias.TF * 0.9, JP: -sBias.JP * 0.85 };
        state.questions.forEach(q => {
          const b = q.layer === 'day' ? sBias[q.dim] : hBias[q.dim];
          const raw = b * q.dir + (Math.random() * 1.8 - 0.9);
          state.answers[q.id] = Math.max(-3, Math.min(3, Math.round(raw)));
        });
      }

      showToast('⚡ 已随机填充作答并生成深度报告！');
      setTimeout(() => computeAndShowResult(), 200);
    }

    function computeAndShowResult() {
      const t = state.activeTest;
      const meta = TEST_META[t];
      const timestamp = new Date().toLocaleString('zh-CN', { hour12: false });
      let resObj = null;

      if (t === 'mbti64') {
        const dimCfg = [
          { key: 'EI', l: 'E', r: 'I', lName: '外向 (E)', rName: '内向 (I)', label: '能量来源' },
          { key: 'SN', l: 'S', r: 'N', lName: '实感 (S)', rName: '直觉 (N)', label: '认知方式' },
          { key: 'TF', l: 'T', r: 'F', lName: '理智 (T)', rName: '情感 (F)', label: '决策模式' },
          { key: 'JP', l: 'J', r: 'P', lName: '计划 (J)', rName: '随性 (P)', label: '生活方式' },
          { key: 'AO', l: 'A', r: 'O', lName: '果断 (A)', rName: '纠结 (O)', label: '行为表现' },
          { key: 'HC', l: 'H', r: 'C', lName: '温暖 (H)', rName: '高冷 (C)', label: '待人态度' }
        ];
        const dimensions = {};
        let baseCode = '';
        let aoWin = 'A', hcWin = 'H';

        dimCfg.forEach((cfg, idx) => {
          const qs = state.questions.filter(q => q.dim === cfg.key);
          const maxAbs = (qs.length || 4) * 3;
          let sum = 0;
          qs.forEach(q => { sum += (state.answers[q.id] || 0) * q.dir; });
          let leftPct = Math.round(((sum + maxAbs) / (2 * maxAbs)) * 100);
          if (leftPct === 50) leftPct = sum >= 0 ? 52 : 48;
          leftPct = Math.max(6, Math.min(95, leftPct));
          const rightPct = 100 - leftPct;
          const winner = leftPct >= 50 ? cfg.l : cfg.r;
          const winnerPct = Math.max(leftPct, rightPct);

          if (idx < 4) baseCode += winner;
          else if (idx === 4) aoWin = winner;
          else if (idx === 5) hcWin = winner;

          dimensions[cfg.key] = { ...cfg, leftPct, rightPct, winner, winnerPct };
        });

        const subKey = `${aoWin}-${hcWin}`;
        const fullCode = `${baseCode}-${subKey}`;
        const baseInfo = MBTI_16_TYPES[baseCode];
        const subInfo = MBTI_SUBTYPES[subKey];
        const tempInfo = TEMPERAMENTS[baseInfo.temp];
        const fullTitle = `${subInfo.label}${baseInfo.name}`;

        resObj = {
          id: 'res_' + Date.now(),
          testId: 'mbti64',
          testName: meta.cnName,
          enTitle: meta.enTitle,
          modeLabel: state.mbtiMode === 'quick' ? '24题快速版' : '48题专业版',
          timestamp,
          fullCode,
          baseCode,
          subKey,
          fullTitle,
          headline: `${fullCode} · ${fullTitle}`,
          subHeadline: `${tempInfo.name} · ${subInfo.tag}`,
          tempInfo,
          baseInfo,
          subInfo,
          dimensions
        };
      } else if (t === 'animal') {
        const scores = {};
        ANIMAL_DIMENSIONS.forEach(d => {
          const qs = state.questions.filter(q => q.dim === d.key);
          const maxAbs = qs.length * 3;
          let sum = 0;
          qs.forEach(q => { sum += (state.answers[q.id] || 0) * q.dir; });
          let pct = Math.round(((sum + maxAbs) / (2 * maxAbs)) * 100);
          scores[d.key] = Math.max(8, Math.min(96, pct));
        });

        const userVec = [scores.DOM, scores.SOC, scores.AGI, scores.WIS];
        const ranked = Object.values(ANIMAL_ARCHETYPES).map(anim => {
          const dist = Math.sqrt(anim.vector.reduce((acc, v, i) => acc + Math.pow(v - userVec[i], 2), 0));
          const matchPct = Math.max(60, Math.min(98, Math.round(100 - dist * 0.44)));
          return { ...anim, dist, matchPct };
        }).sort((a, b) => a.dist - b.dist);

        const primary = ranked[0];
        const secondary = ranked[1];

        resObj = {
          id: 'res_' + Date.now(),
          testId: 'animal',
          testName: meta.cnName,
          enTitle: meta.enTitle,
          timestamp,
          headline: `${primary.name} · ${primary.title}`,
          subHeadline: `契合度 ${primary.matchPct}% · 潜藏影子动物：${secondary.name} (${secondary.title})`,
          primary,
          secondary,
          scores
        };
      } else if (t === 'love') {
        const dims = {};
        let code = '';
        LOVE_DIMENSIONS.forEach(d => {
          const qs = state.questions.filter(q => q.dim === d.key);
          const maxAbs = qs.length * 3;
          let sum = 0;
          qs.forEach(q => { sum += (state.answers[q.id] || 0) * q.dir; });
          let leftPct = Math.round(((sum + maxAbs) / (2 * maxAbs)) * 100);
          if (leftPct === 50) leftPct = sum >= 0 ? 52 : 48;
          leftPct = Math.max(8, Math.min(94, leftPct));
          const rightPct = 100 - leftPct;
          const win = leftPct >= 50 ? d.lCode : d.rCode;
          code += win;
          dims[d.key] = { ...d, leftPct, rightPct, win, winPct: Math.max(leftPct, rightPct) };
        });

        const profile = LOVE_TYPES[code];
        resObj = {
          id: 'res_' + Date.now(),
          testId: 'love',
          testName: meta.cnName,
          enTitle: meta.enTitle,
          timestamp,
          code,
          headline: `${code} · ${profile.name}`,
          subHeadline: `${profile.en} · 灵魂伴侣：${profile.match} (${LOVE_TYPES[profile.match].name})`,
          profile,
          dims
        };
      } else if (t === 'archetype') {
        const scoresMap = {};
        JUNG_ARCHETYPES.forEach(arch => {
          const qs = state.questions.filter(q => q.arch === arch.code);
          const maxAbs = qs.length * 3;
          let sum = 0;
          qs.forEach(q => { sum += (state.answers[q.id] || 0); });
          const jitter = (arch.code.charCodeAt(0) % 5) - 2;
          let pct = Math.round(((sum + maxAbs) / (2 * maxAbs)) * 100) + jitter;
          scoresMap[arch.code] = Math.max(15, Math.min(96, pct));
        });

        const sorted = [...JUNG_ARCHETYPES].map(a => ({ ...a, score: scoresMap[a.code] })).sort((a, b) => b.score - a.score);
        const primary = sorted[0];
        const wing = sorted[1];
        const shadow = sorted[sorted.length - 1];

        resObj = {
          id: 'res_' + Date.now(),
          testId: 'archetype',
          testName: meta.cnName,
          enTitle: meta.enTitle,
          timestamp,
          headline: `${primary.name} (${primary.en})`,
          subHeadline: `辅助翼型：${wing.name} (${wing.score}%) · 阴影原型：${shadow.name}`,
          primary,
          wing,
          shadow,
          scoresMap,
          sorted
        };
      } else if (t === 'duality') {
        const calcLayer = (layerName) => {
          const axisList = [
            { key: 'EI', l: 'E', r: 'I', lName: '外向 E', rName: '内向 I' },
            { key: 'SN', l: 'S', r: 'N', lName: '实感 S', rName: '直觉 N' },
            { key: 'TF', l: 'T', r: 'F', lName: '理智 T', rName: '情感 F' },
            { key: 'JP', l: 'J', r: 'P', lName: '计划 J', rName: '随性 P' }
          ];
          const resAxes = {};
          let code = '';
          axisList.forEach(ax => {
            const qs = state.questions.filter(q => q.layer === layerName && q.dim === ax.key);
            const maxAbs = qs.length * 3;
            let sum = 0;
            qs.forEach(q => { sum += (state.answers[q.id] || 0) * q.dir; });
            let lPct = Math.round(((sum + maxAbs) / (2 * maxAbs)) * 100);
            if (lPct === 50) lPct = sum >= 0 ? 53 : 47;
            lPct = Math.max(10, Math.min(92, lPct));
            const rPct = 100 - lPct;
            const win = lPct >= 50 ? ax.l : ax.r;
            code += win;
            resAxes[ax.key] = { ...ax, lPct, rPct, win };
          });
          return { code, axes: resAxes, meta: MBTI_16_TYPES[code] };
        };

        const day = calcLayer('day');
        const night = calcLayer('night');
        const diffs = ['EI', 'SN', 'TF', 'JP'].map(k => Math.abs(day.axes[k].lPct - night.axes[k].lPct));
        const avgDiff = diffs.reduce((a, b) => a + b, 0) / 4;
        const contrastIndex = Math.max(16, Math.min(96, Math.round(avgDiff * 1.35)));
        let contrastLabel = '表里如一 · 高度自洽型';
        if (contrastIndex >= 72) contrastLabel = '极致反转 · 昼夜镜像灵魂';
        else if (contrastIndex >= 48) contrastLabel = '双面魅影 · 鲜明反差切换';
        else if (contrastIndex >= 30) contrastLabel = '温润调适 · 弹性社交面具';

        resObj = {
          id: 'res_' + Date.now(),
          testId: 'duality',
          testName: meta.cnName,
          enTitle: meta.enTitle,
          timestamp,
          headline: `白昼 ${day.code} × 深夜 ${night.code}`,
          subHeadline: `昼夜反差指数：${contrastIndex}% (${contrastLabel})`,
          day,
          night,
          contrastIndex,
          contrastLabel
        };
      }

      state.result = resObj;
      state.dualityViewMode = 'both';
      saveHistory(resObj);
      state.stage = 'result';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    /**

    function renderAtlasView() {
      const f = state.atlasTab;
      let content = '';

      if (f === 'mbti64') {
        const { search, temp, base, ao, hc } = state.atlasFilter;
        const kw = search.trim().toLowerCase();
        const cards = [];

        Object.keys(MBTI_16_TYPES).forEach(bCode => {
          const bInfo = MBTI_16_TYPES[bCode];
          if (temp !== 'ALL' && bInfo.temp !== temp) return;
          if (base !== 'ALL' && bCode !== base) return;

          Object.keys(MBTI_SUBTYPES).forEach(sKey => {
            const sInfo = MBTI_SUBTYPES[sKey];
            if (ao !== 'ALL' && sInfo.ao !== ao) return;
            if (hc !== 'ALL' && sInfo.hc !== hc) return;

            const fullCode = `${bCode}-${sKey}`;
            const compactCode = `${bCode}-${sInfo.ao}${sInfo.hc}`;
            const title = `${sInfo.label}${bInfo.name}`;
            const haystack = `${fullCode} ${compactCode} ${title} ${sInfo.tag} ${bInfo.en}`.toLowerCase();
            if (kw && !haystack.includes(kw)) return;

            cards.push({ fullCode, title, bInfo, sInfo, tInfo: TEMPERAMENTS[bInfo.temp] });
          });
        });

        content = `
          <div class="filter-bar">
            <div class="filter-row">
              <input type="text" class="filter-input" style="flex:1; min-width:190px;" value="${search}"

              <select class="filter-select" onchange="state.atlasFilter.temp=this.value; render();">
                <option value="ALL" ${temp==='ALL'?'selected':''}>全部阵营 (NT/NF/SJ/SP)</option>
                <option value="NT" ${temp==='NT'?'selected':''}>NT 分析家阵营</option>
                <option value="NF" ${temp==='NF'?'selected':''}>NF 外交家阵营</option>
                <option value="SJ" ${temp==='SJ'?'selected':''}>SJ 守护者阵营</option>
                <option value="SP" ${temp==='SP'?'selected':''}>SP 探险家阵营</option>
              </select>

              <select class="filter-select" onchange="state.atlasFilter.base=this.value; render();">
                <option value="ALL" ${base==='ALL'?'selected':''}>全部16基础型</option>
                ${Object.keys(MBTI_16_TYPES).map(c => `<option value="${c}" ${base===c?'selected':''}>${c} · ${MBTI_16_TYPES[c].name}</option>`).join('')}

            </div>

            <div class="filter-row">
              <span style="font-size:12px; font-weight:700; color:#64748b;">亚型筛选：</span>
              <select class="filter-select" onchange="state.atlasFilter.ao=this.value; render();">
                <option value="ALL" ${ao==='ALL'?'selected':''}>第五维 A/O (全部)</option>
                <option value="A" ${ao==='A'?'selected':''}>-A 果断自信型</option>
                <option value="O" ${ao==='O'?'selected':''}>-O 纠结敏锐型</option>
              </select>
              <select class="filter-select" onchange="state.atlasFilter.hc=this.value; render();">
                <option value="ALL" ${hc==='ALL'?'selected':''}>第六维 H/C (全部)</option>
                <option value="H" ${hc==='H'?'selected':''}>-H 温暖共情型</option>
                <option value="C" ${hc==='C'?'selected':''}>-C 高冷克制型</option>
              </select>
              <span style="margin-left:auto; font-size:12px; font-weight:800; color:#3498DB;">共匹配 ${cards.length} / 64 种亚型</span>
            </div>
          </div>

          ${cards.length === 0 ? `
            <div class="card" style="text-align:center; padding:40px; color:#64748b;">未找到匹配的 64 型人格，请调整筛选条件</div>
          ` : `
            <div class="grid-4">
              ${cards.map(c => `
                <div class="card" onclick="openAtlasDetail('mbti64', '${c.fullCode}')" style="padding:16px; cursor:pointer;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <span style="font-size:13.5px; font-weight:900; color:${c.tInfo.primary};">${c.fullCode}</span>
                    <span style="padding:2px 8px; border-radius:999px; background:${c.tInfo.softBg}; color:${c.tInfo.text}; font-size:10.5px; font-weight:800;">${c.bInfo.temp}</span>
                  </div>
                  <div style="font-size:15.5px; font-weight:900; color:#0f172a; margin-bottom:4px;">${c.title}</div>
                  <div style="font-size:11.5px; color:#64748b;">${c.sInfo.tag}</div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      } else if (f === 'animal') {
        content = `
          <div class="grid-4">
            ${Object.values(ANIMAL_ARCHETYPES).map(a => `

                <p style="font-size:12px; color:#64748b; line-height:1.5;">${a.motto}</p>
              </div>
            `).join('')}
          </div>
        `;
      } else if (f === 'love') {
        content = `
          <div class="grid-4">
            ${Object.values(LOVE_TYPES).map(l => `
              <div class="card" onclick="openAtlasDetail('love', '${l.code}')" style="padding:18px; cursor:pointer;">

                  <span style="font-size:15px; font-weight:900; color:#E06377;">${l.code}</span>

                <div style="font-size:17px; font-weight:900; color:#0f172a;">${l.name}</div>
                <div style="font-size:11px; color:#64748b; margin-bottom:8px;">${l.en}</div>
                <p style="font-size:12px; color:#475569; line-height:1.5;">${l.motto}</p>
              </div>
            `).join('')}
          </div>
        `;
      } else if (f === 'archetype') {
        content = `
          <div class="grid-3">
            ${JUNG_ARCHETYPES.map(a => {
              const q = ARCHETYPE_QUADRANTS[a.quad];
              return `
                <div class="card" onclick="openAtlasDetail('archetype', '${a.code}')" style="padding:20px; cursor:pointer;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">

                </div>
              `;
            }).join('')}
          </div>

        const oppositeCode = (c) => {
          const map = { E: 'I', I: 'E', S: 'N', N: 'S', T: 'F', F: 'T', J: 'P', P: 'J' };
          return c.split('').map(ch => map[ch]).join('');
        };
        content = `
          <div class="card" style="margin-bottom:20px;">
            <h3 style="font-size:17px; font-weight:900; margin-bottom:6px;">🌗 自由双面人格镜像模拟器</h3>
            <p style="font-size:12.5px; color:#64748b; margin-bottom:14px;">任意搭配白昼表层人格与深夜潜意识人格，探索 256 种双面组合</p>
            ${renderDualityExplorerWidget()}
          </div>

          <h3 style="font-size:16px; font-weight:900; margin-bottom:12px; color:#0f172a;">📖 16型核心「白昼 × 镜像影子」对照谱</h3>
          <div class="grid-4">
            ${Object.values(MBTI_16_TYPES).map(t => {
              const shadowCode = oppositeCode(t.code);
              const shadowInfo = MBTI_16_TYPES[shadowCode];
              return `
                <div class="card" onclick="openAtlasDetail('duality', '${t.code}')" style="padding:16px; cursor:pointer;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <span style="font-size:14px; font-weight:900; color:#2563EB;">☀️ ${t.code}</span>
                    <span style="font-size:12px; font-weight:800; color:#475569;">🌙 ${shadowCode}</span>
                  </div>

                  <div style="font-size:11.5px; color:#64748b; line-height:1.45;">${t.motto}</div>
                </div>
              `;

          </div>
        `;
      }

      return `
        <div class="animate-enter">
          <div style="margin-bottom:18px;">
            <h1 style="font-size:26px; font-weight:900; color:#0f172a;">🧭 全人格图鉴 (Atlas)</h1>

          </div>

          <div class="atlas-tabs">
            <button class="atlas-tab ${f === 'mbti64' ? 'active' : ''}" style="${f === 'mbti64' ? 'background:#3498DB;' : ''}" onclick="state.atlasTab='mbti64'; render();">🔷 MBTI-64 全图鉴 (64)</button>

    function renderDualityExplorerWidget() {
      const codes = Object.keys(MBTI_16_TYPES);
      const dCode = state.dualitySim.day;
      const nCode = state.dualitySim.night;
      const dMeta = MBTI_16_TYPES[dCode];
      const nMeta = MBTI_16_TYPES[nCode];

      let diffLetters = 0;
      for (let i = 0; i < 4; i++) if (dCode[i] !== nCode[i]) diffLetters++;
      const simPct = [18, 42, 65, 84, 96][diffLetters];

      return `
        <div>
          <div class="grid-2" style="margin-bottom:14px;">
            <div>
              <label style="display:block; font-size:12px; font-weight:800; color:#2563EB; margin-bottom:5px;">☀️ 白昼表层人格：</label>

     * ============================================================================
     * 八、综合人格档案 (My Profile & History) — 多维人格全景护照 + 跨体系融合分析
     * ============================================================================
     */
    function generateCrossSystemSynthesis(latestMap) {
      const doneKeys = Object.keys(latestMap);
      if (doneKeys.length < 2) return null;

      const insights = [];
      const m64 = latestMap.mbti64;
      const anim = latestMap.animal;
      const love = latestMap.love;
      const arch = latestMap.archetype;
      const dual = latestMap.duality;

      // 1. MBTI-64 + 动物原型联动分析
      if (m64 && anim) {
        const isIntro = m64.baseCode[0] === 'I';
        const isHighDom = anim.scores.DOM >= 60;
        if (isIntro && isHighDom) {
          insights.push(`<strong>【静水流深的领地掌控力】</strong>你的 MBTI-64 为内向能量型（${m64.fullCode}），但动物原型呈现出高领地领导力特质（${anim.primary.name} · ${anim.scores.DOM}%），说明你不依赖喧嚣社交刷存在感，而是在关键决策时刻用深思熟虑后的权威定调全局。`);
        } else {
          insights.push(`<strong>【认知结构与原始本能共振】</strong>你的 ${m64.fullCode}（${m64.fullTitle}）认知架构与「${anim.primary.name} · ${anim.primary.title}」本能形成高度协同，赋予你在日常处事中「${m64.subInfo.label}」的外显风格与「${anim.primary.strengths[0]}」的底层行动力。`);
        }
      }

      // 2. MBTI-64 / 动物原型 + 16型恋爱人格联动
      if (love && (m64 || anim)) {
        const isWarm = m64 ? m64.subInfo.hc === 'H' : anim.scores.SOC >= 55;
        const isActiveLove = love.code[0] === 'A';
        if (!isWarm && isActiveLove) {
          insights.push(`<strong>【外冷内热的直球恋爱反差】</strong>日常社交中你倾向克制边界，但在亲密关系里（${love.code} · ${love.profile.name}）却敢于主动奔赴，把最珍贵的偏爱留给唯一认定的人。`);
        } else {
          insights.push(`<strong>【亲密依恋与情感光谱映射】</strong>在亲密关系中你化身为「${love.code} · ${love.profile.name}」，最看重「${love.profile.language}」，与 ${love.profile.match}（${LOVE_TYPES[love.profile.match].name}）能产生最深层的灵魂共振。`);
        }
      }

      // 3. 荣格12原型 + 昼夜双面人格联动
      if (arch && dual) {
        insights.push(`<strong>【生命原动力与昼夜面具张力】</strong>驱动你人生的核心荣格原型是「${arch.primary.name}」（渴望${arch.primary.desire}）。在白昼社会场域中你以 ${dual.day.code} 的姿态回应外界期待，而深夜独处时则切换为 ${dual.night.code}（昼夜反差指数 ${dual.contrastIndex}%），通过「${arch.wing.name}」翼型平衡内外能量。`);
      } else if (arch) {
        insights.push(`<strong>【核心生命驱动力】</strong>荣格「${arch.primary.name}」原型（${arch.primary.score}%）赋予你追求「${arch.primary.desire}」的使命感，同时需留意接纳潜意识阴影「${arch.shadow.name}」所代表的能量维度。`);
      } else if (dual) {
        insights.push(`<strong>【昼夜双面心理弹性】</strong>白昼表层 ${dual.day.code} 与深夜潜意识 ${dual.night.code} 构成了你 ${dual.contrastIndex}% 的昼夜反差指数（${dual.contrastLabel}），体现了你在社会角色适应与本真自我保护之间的精妙平衡。`);
      }

      return insights;
    }

    /**
     * ============================================================================
     * 九、专属分享海报生成 (自定义昵称 + 100% 离线 HTML5 Canvas PNG 导出) & 文本复制
     * ============================================================================
     */
    function getPosterMetadata(r) {
      const m = TEST_META[r.testId];
      let motto = '';
      let bars = [];
      if (r.testId === 'mbti64') {
        motto = r.baseInfo.motto;
        bars = ['EI', 'SN', 'TF', 'JP', 'AO', 'HC'].map(k => {
          const d = r.dimensions[k];
          return { label: d.winner === d.l ? d.lName : d.rName, pct: d.winnerPct };
        });
      } else if (r.testId === 'animal') {
        motto = r.primary.motto;
        bars = [
          { label: '领地领导力', pct: r.scores.DOM },
          { label: '群居共情力', pct: r.scores.SOC },
          { label: '敏捷变通度', pct: r.scores.AGI },
          { label: '沉思洞察力', pct: r.scores.WIS }
        ];
      } else if (r.testId === 'love') {
        motto = r.profile.motto;
        bars = LOVE_DIMENSIONS.map(d => {
          const info = r.dims[d.key];
          return { label: info.win === d.lCode ? d.left : d.right, pct: info.winPct };
        });
      } else if (r.testId === 'archetype') {
        motto = r.primary.desire;
        bars = r.sorted.slice(0, 4).map(a => ({ label: `${a.name} (${a.en})`, pct: a.score }));
      } else if (r.testId === 'duality') {
        motto = `昼夜反差指数 ${r.contrastIndex}% · ${r.contrastLabel}`;
        bars = ['EI', 'SN', 'TF', 'JP'].map(k => {
          const dAx = r.day.axes[k];
          const nAx = r.night.axes[k];
          return { label: `昼 ${dAx.win}(${dAx.lPct}%) / 夜 ${nAx.win}(${nAx.lPct}%)`, pct: Math.max(dAx.lPct, nAx.lPct) };
        });
      }
      return { m, motto, bars };
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = text.split('');
      let line = '';
      let curY = y;
      for (let i = 0; i < chars.length; i++) {
        const testLine = line + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          ctx.fillText(line, x, curY);
          line = chars[i];
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, curY);
      return curY;
    }

    function downloadPosterPNG() {
      const r = state.result;
      if (!r) return;
      const { m, motto, bars } = getPosterMetadata(r);
      const nick = state.posterNickname.trim();

      const canvas = document.createElement('canvas');
      const W = 750;
      const H = 1080;
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, W, H);

      drawRoundRect(ctx, 36, 36, W - 72, H - 72, 36);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = m.border;
      ctx.stroke();

      ctx.save();
      drawRoundRect(ctx, 36, 36, W - 72, 460, 36);
      ctx.clip();
      const grad = ctx.createLinearGradient(0, 36, W, 496);
      grad.addColorStop(0, m.softBg);
      grad.addColorStop(1, '#ffffff');
      ctx.fillStyle = grad;
      ctx.fillRect(36, 36, W - 72, 460);
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.fillStyle = m.primary;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(`64PERSONALITY · ${m.cnName}`, W / 2, 98);

      if (nick) {
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(`@${nick} 的专属灵魂档案`, W / 2, 138);
      }

      const cy = nick ? 218 : 200;
      ctx.beginPath();
      ctx.arc(W / 2, cy, 56, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = m.primary;
      ctx.stroke();

      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = (-90 + i * 60) * Math.PI / 180;
        const px = W / 2 + 34 * Math.cos(ang);
        const py = cy + 34 * Math.sin(ang);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = m.primary;
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.font = '900 42px sans-serif';
      ctx.fillText(r.headline, W / 2, cy + 108);

      ctx.fillStyle = '#475569';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(r.subHeadline, W / 2, cy + 148);

      drawRoundRect(ctx, 76, cy + 174, W - 152, 86, 18);
      ctx.fillStyle = m.softBg;
      ctx.fill();
      ctx.fillStyle = '#334155';
      ctx.font = 'italic 20px sans-serif';
      wrapCanvasText(ctx, `“${motto}”`, W / 2, cy + 212, W - 190, 28);

      let barY = 550;
      const barStep = bars.length > 4 ? 64 : 84;
      bars.forEach(b => {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(b.label, 84, barY);

        ctx.textAlign = 'right';
        ctx.fillStyle = m.primary;
        ctx.fillText(`${b.pct}%`, W - 84, barY);

        drawRoundRect(ctx, 84, barY + 12, W - 168, 16, 8);
        ctx.fillStyle = '#f1f5f9';
        ctx.fill();

        const fillW = Math.max(24, ((W - 168) * b.pct) / 100);
        drawRoundRect(ctx, 84, barY + 12, fillW, 16, 8);
        ctx.fillStyle = m.primary;
        ctx.fill();

        barY += barStep;
      });

      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(84, H - 115);
      ctx.lineTo(W - 84, H - 115);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 19px sans-serif';
      ctx.fillText('64personality · 全维人格测评实验室', 84, H - 72);

      ctx.textAlign = 'right';
      ctx.fillText(r.timestamp.split(' ')[0], W - 84, H - 72);

      try {
        const dataUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `64personality_${r.testId}_${Date.now()}.png`;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('✅ 高清分享海报 (PNG) 已成功下载！');
      } catch (e) {
        showToast('海报渲染完成，请长按或右键保存图像');
      }
    }

    function closeModal() {
      document.getElementById('app-modal').classList.remove('open');
    }

    function copyReport() {
      const r = state.result;
      if (!r) return;
      const nickPrefix = state.posterNickname.trim() ? `【@${state.posterNickname.trim()} 的专属测评】\n` : '';
      const text = `${nickPrefix}【64personality · ${r.testName}】\n我的测评结果：${r.headline}\n${r.subHeadline}\n测评时间：${r.timestamp}\n—— 64personality 全维人格测评实验室`;
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✅ 完整测评报告文案已复制到剪贴板！');
      } catch (e) {
        showToast('复制失败，请手动复制文本');
      }
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      const wrap = document.getElementById('toast-wrap');
      const el = document.createElement('div');
      el.className = 'toast-msg';
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2500);
    }

    /**
     * ============================================================================
     * 十、初始化启动
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      loadHistory();
      render();
    });
  </script>
</body>
